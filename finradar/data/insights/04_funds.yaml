# 专题洞察 · 公募基金与资产管理
category: 公募基金与资产管理

insights:

  - id: funds-fee-reform
    topic: 公募基金改革：费率三连降之后，钱从哪里来
    category: 公募基金与资产管理
    thesis: >-
      费率改革把主动权益的"规模即收入"模式打断了：管理费、托管费降了，交易佣金降了，
      销售费用也要降。收入端被压住之后，行业会分三条路走——被动化（靠规模但费率更低）、
      多资产与工具化（靠差异化）、买方投顾（靠服务费而不是销售费）。
      判断一家公司的转型真伪，看它的非货规模结构，而不是总规模。
    actors: [监管, 公募, 券商, 银行]
    keywords: [公募基金, 费率, 管理费, 托管费, 交易佣金, 销售费用, 浮动费率, 被动,
               ETF, 指数基金, 买方投顾, 基金投顾, 高质量发展, 业绩比较基准, 中长期资金]
    timeline:
      - when: 2023-07
        event: 公募基金费率改革启动（第一阶段：主动权益管理费、托管费下调，管理费与业绩挂钩的浮动费率试点）
        source: 证监会
      - when: 2024
        event: 第二阶段：交易佣金改革（佣金费率下调、单家券商佣金比例上限约束）
        source: 证监会
      - when: 2025-05-07
        event: 《推动公募基金高质量发展行动方案》（证监发〔2025〕21号）——提出浮动费率常态化、强化业绩比较基准约束、"投资者为本"
        source: 证监会
      - when: 2026-01-01
        event: 《公开募集证券投资基金销售费用管理规定》施行，销售环节费率与收费模式进一步规范
        source: 证监会
      - when: 2025-2026
        event: 被动投资继续扩张，ETF 成为承接中长期资金与增量居民资金的主要工具；基金投顾从试点走向规范发展
        source: 证监会、基金业协会
    snapshot:
      - label: 改革文件
        value: 证监发〔2025〕21号《推动公募基金高质量发展行动方案》（2025-05-07）
        as_of: 2025-05-07
      - label: 销售费用新规
        value: 2026-01-01 起施行
        as_of: 2026-01-01
      - label: 浮动费率主流模式
        value: 与持有期 / 与规模 / 与业绩比较基准三挂钩
        as_of: 2026
    outlook:
      - actor: 监管
        horizon: 2026 年内
        action: >-
          把"业绩比较基准"变成硬约束：基准偏离、风格漂移会被盯；同时推动浮动费率常态化，
          并把销售费用改革落到尾佣上，压缩"重首发、轻持续"的销售激励。
        trigger: 改革方案进入评估期，若行业收入下滑过快，会同步放宽工具类产品审批以对冲
      - actor: 公募
        horizon: 2026 年内
        action: >-
          三条路：一是被动与 ETF（低成本承接长钱）、二是多资产/固收+（用差异化对冲费率下行）、
          三是投顾化（把服务费做成收入）。同时主动权益要"减数量、提质量"，
          用浮动费率与持有期产品留住客户。
        trigger: 主动权益份额持续净流出、销售费用新规落地后尾佣收入下降
      - actor: 券商
        horizon: 2026 年内
        action: >-
          交易佣金下降后，经纪业务向"ETF 做市 + 基金投顾 + 财富管理"要利润；
          研究与销售交易从"卖方分仓"转向为投顾与机构客户提供组合解决方案。
        trigger: 佣金改革全面落地、ETF 成交占比上升
      - actor: 银行
        horizon: 2026 年内
        action: >-
          代销从"卖爆款"转向"做投顾"，用低费率指数、固收+与养老目标产品替代高费率主动权益，
          靠投顾服务费与保有量收入补收入缺口。
        trigger: 销售费用新规压降尾佣、客户对高费率产品敏感度上升
    watchlist:
      - 浮动费率基金的发行数量与业绩比较基准设定（基准定得低就是"假浮动"）
      - 主动权益 vs 被动指数的新发规模与存量份额变化
      - 基金销售费用新规实施后的尾佣与代销收入结构
      - 基金投顾规模与持仓结构（判断"服务费模式"能否跑通）
    interview_take: >-
      这一轮改革的主线是费率三连降：2023 年管理费和托管费、2024 年交易佣金、
      2026 年 1 月起销售费用新规施行，2025 年 5 月的《推动公募基金高质量发展行动方案》
      是总纲，核心是浮动费率和强化业绩比较基准。费率降下来以后，行业收入从
      "规模即收入"变成要靠产品差异化，我看有三条路：被动化用低成本接长钱、
      多资产和固收+做差异化、买方投顾把服务费变成收入。所以判断一家公司转型真假，
      我会看非货规模的结构和投顾保有量，而不是总规模。银行的代销会从卖爆款转向做投顾，
      券商的经纪业务要靠 ETF 做市和组合服务赚钱，因为佣金这条腿基本被削平了。
    related_terms: [公募基金高质量发展改革（浮动费率 / 投资者为本）, ETF 与被动化浪潮,
                    公募REITs, 银行理财与净值化转型]
