# 专题洞察 · 资本市场与证券行业
category: 资本市场与证券行业

insights:

  - id: capital-market-long-money
    topic: 中长期资金入市：为什么说核心矛盾是"长钱短考"
    category: 资本市场与证券行业
    thesis: >-
      缺的从来不是钱，而是"能承受波动、考核周期够长的钱"。所以政策抓手一直是两头：
      一头放开保险、社保、年金的权益比例上限（供给端），另一头改考核机制——
      把国有保险公司的净资产收益率考核从当年改成三年以上周期（这才是真正的堵点）。
    actors: [监管, 保险, 公募, 券商]
    keywords: [中长期资金, 中长期资金入市, 长钱短考, 险资, 保险资金, 社保基金, 年金,
               权益投资比例, 长周期考核, 公募基金, 高股息, 市值管理, 分红, 回购,
               并购重组, 注册制, IPO, 退市, 科创板, 创业板]
    timeline:
      - when: 2024-04
        event: 新"国九条"（2024）《关于加强监管防范风险推动资本市场高质量发展的若干意见》发布，确立强监管、防风险、促高质量发展主线
        source: 国务院
      - when: 2024-09
        event: 中央金融办、证监会《关于推动中长期资金入市的指导意见》；同期“并购六条”与并购重组新周期（《关于深化上市公司并购重组市场改革的意见》）
        source: 中央金融办、证监会
      - when: 2024-11
        event: 《上市公司监管指引第10号——市值管理》发布，要求长期破净公司制定估值提升计划，鼓励注销式回购与分红
        source: 证监会
      - when: 2025-01
        event: 六部门《关于推动中长期资金入市工作的实施方案》——明确公募基金持有 A 股流通市值未来三年每年至少增长 10%、大型国有保险公司新增保费 30% 用于投资 A 股等量化目标
        source: 六部门
      - when: 2025-2026
        event: 科创板改革（"1+6"/科创成长层）、市值管理与分红回购常态化、并购重组作为 IPO 之外的退出通道被反复强调
        source: 证监会、交易所
    snapshot:
      - label: 政策目标
        value: 公募持 A 股流通市值三年每年至少增长 10%；大型国有险企新增保费 30% 投 A 股
        as_of: 2025-01
      - label: 考核机制
        value: 国有保险公司经营效益类指标改为"当年度 + 3 年周期 + 5 年周期"结合，权重向长周期倾斜
        as_of: 2025-01
      - label: 股东回报工具
        value: 现金分红、注销式回购被列为提升投资价值的首选；长期破净公司需披露估值提升计划
        as_of: 2024-11
    outlook:
      - actor: 监管
        horizon: 2026 年内
        action: >-
          继续从"考核端"下手：把长周期考核从保险扩到更多机构投资者（社保、年金、银行理财），
          并配套降低权益投资的资本占用与会计波动；同时保持 IPO 节奏的相机调节，
          给并购重组和再融资留通道。
        trigger: 权益市场波动加大、机构"不敢配"的症结从制度问题变成考核问题
      - actor: 保险
        horizon: 2026 年内
        action: >-
          在新增保费 30% 投 A 股的政策框架下，增配高股息、宽基 ETF 与长久期资产；
          同时用 FVOCI 会计处理减少利润表波动，把权益仓位做成"类固收 + 弹性"结构。
        trigger: 长端利率低位、负债成本刚性与偿付能力约束同时存在
      - actor: 公募
        horizon: 2026 年内
        action: >-
          承接长钱的产品形态会继续向"低费率宽基 + 被动指数 + 红利/多资产"集中；
          同时用浮动费率、持有期产品把资金留住，减少"长钱短持"。
        trigger: 公募持 A 股流通市值年增 10% 的量化目标逐年考核
      - actor: 券商
        horizon: 2026 年内
        action: >-
          投行重心从 IPO 转向并购重组与再融资；机构业务上做保险、社保的长钱交易与做市，
          研究端加大对高股息与产业整合的覆盖。
        trigger: IPO 受理节奏与并购重组审核效率的变化
    watchlist:
      - 六部门实施方案里量化目标的落地进度（公募持 A 股市值、险资新增保费投向）
      - 保险资金权益投资比例上限与实际仓位（金融监管总局季度数据）
      - 上市公司分红与注销式回购规模（交易所月度/年度统计）
      - IPO 受理与过会节奏、并购重组审核数量（判断投行业务重心）
    interview_take: >-
      中长期资金入市的核心矛盾不是"钱不够"，而是"长钱短考"：保险、社保的钱期限很长，
      但考核是按年甚至按季，导致机构不敢承受波动。所以政策两步走：一是放开比例上限，
      比如大型国有险企新增保费 30% 投 A 股、公募持 A 股流通市值三年每年至少增长 10%；
      二是改考核，把保险的经营效益指标改成当年度加三年、五年周期结合。我觉得第二点才是关键，
      因为比例上限早就放开过，真正卡住的是考核和会计处理。往后看，监管大概率会把这套长周期考核
      从保险扩到社保、年金和理财；对机构来说，权益仓位会往"高股息 + 宽基被动"集中，
      对投行来说，重心会继续从 IPO 转向并购重组。
    related_terms: [中长期资金入市, 新"国九条"（2024）, 市值管理与"注销式回购", “并购六条”与并购重组新周期,
                    科创板改革（"1+6"、科创成长层）, ETF 与被动化浪潮, 保险资金长期投资改革试点]
