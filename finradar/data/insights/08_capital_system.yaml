# 专题洞察 · 资本市场与证券行业（基础制度）
category: 资本市场与证券行业

insights:

  - id: capital-market-institutions
    topic: 资本市场基础制度：注册制之后，真正难的是退市与投资者保护
    category: 资本市场与证券行业
    thesis: >-
      注册制解决的是"能不能上市"，但一个市场能不能留住长期资金，
      取决于另外两件事：**退市是否真的执行**、**投资者被侵害后能不能拿到赔偿**。
      所以 2024 年新"国九条"之后，政策重心明显从"入口"转向"出口 + 追责"，
      这也是判断 A 股生态有没有变化的真正观察点。
    actors: [监管, 券商, 公募, 保险]
    keywords: [注册制, 退市, 投资者保护, 代表人诉讼, 先行赔付, 减持, 分红, 回购,
               信息披露, 财务造假, 欺诈发行, 发行上市, 上市公司治理, 分红激励]
    timeline:
      - when: 2018-10
        event: 证监会修改《关于改革完善并严格实施上市公司退市制度的若干意见》，退市制度开始"动真格"
        source: 证监会令第146号
      - when: 2019-2023
        event: 科创板、创业板、北交所相继试点并全面推开注册制；2023 年 2 月全面注册制落地，债券注册制改革同步推进（2023-08 证监会债券注册制指导意见）
        source: 证监会
      - when: 2024-04
        event: 新"国九条"《关于加强监管防范风险推动资本市场高质量发展的若干意见》，确立强监管、防风险、促高质量发展主线
        source: 国务院
      - when: 2024-11
        event: 《上市公司监管指引第10号——市值管理》，长期破净公司须制定估值提升计划
        source: 证监会
      - when: 2025-12
        event: 《关于加强资本市场中小投资者保护的若干意见》（证监会公告〔2025〕19号）
        source: 证监会
      - when: 2026
        event: 强化分红与回购的制度约束、"减持新规"持续执行；中长期资金入市的量化目标进入年度考核
        source: 证监会、六部门实施方案
    snapshot:
      - label: 入口
        value: 全面注册制（2023-02 起），审核重心转向信息披露质量
        as_of: 2023-02
      - label: 出口
        value: 退市制度 2018 年修订后逐步硬化，财务类、交易类、规范类、重大违法类四类强制退市
        as_of: 2018-10
      - label: 追责
        value: 特别代表人诉讼（"默示加入、明示退出"）+ 先行赔付，康美案为标志性案例
        as_of: 2025
      - label: 中小投资者保护
        value: 证监会公告〔2025〕19号《关于加强资本市场中小投资者保护的若干意见》
        as_of: 2025-12
    outlook:
      - actor: 监管
        horizon: 2026 年内
        action: >-
          把重心继续放在"出口与追责"上：提高退市执行的确定性（减少"保壳"空间）、
          完善特别代表人诉讼与先行赔付的衔接、规范减持与破发破净公司的融资限制；
          同时保持 IPO 节奏的逆周期调节。
        trigger: 退市家数与强制退市比例、代表人诉讼案件数量的变化
      - actor: 券商
        horizon: 2026 年内
        action: >-
          投行从"过会"转向"执业质量"：注册制下中介机构承担实质性的核查责任，
          财务造假会被追责到保荐与审计；业务重心转移到并购重组、再融资与
          合规风控能力更强的客户，研究端加大对治理与分红的覆盖。
        trigger: 中介机构执业质量评价与处罚案例
      - actor: 公募
        horizon: 2026 年内
        action: >-
          投研上把"治理与股东回报"变成硬指标：分红率、回购注销、减持约束、
          财务质量纳入选股与风控；指数产品会更多采用红利、公司治理因子，
          承接长钱的低波需求。
        trigger: 上市公司分红与回购数据披露的常态化
      - actor: 保险
        horizon: 中期
        action: >-
          长周期考核落地后，权益配置会向"高分红 + 治理良好"的资产集中，
          同时参与特别代表人诉讼等投资者保护机制作为机构股东的一员。
        trigger: 险资长周期考核与偿付能力规则对长期权益的优待
    watchlist:
      - 每年强制退市家数与"保壳"案例的对比（制度是否真执行）
      - 特别代表人诉讼的立案与赔付金额（维权成本是否下降）
      - 上市公司分红总额、注销式回购规模与减持规模（三者的相对变化）
      - 中介机构被处罚的数量与类型（注册制下"看门人"约束是否有效）
    interview_take: >-
      我理解资本市场制度这几年有个明显的重心转移：注册制解决的是入口，
      但真正决定长期资金愿不愿意来的是出口和追责。所以新"国九条"之后，
      政策重点放在退市执行、减持约束、分红回购和投资者保护上。
      标志性的东西有两个：一是 2018 年修订退市制度后，财务类、交易类、
      规范类、重大违法类四类强制退市逐步硬化；二是特别代表人诉讼和先行赔付，
      康美案让"默示加入、明示退出"这种机制真正跑通。对从业者来说，
      影响是投行的责任从过会转向执业质量，公募的选股要把治理与分红
      变成硬指标，保险的长钱更偏好高分红和治理好的公司。
    feature:
      lead: >-
        谈资本市场改革，大家习惯从注册制讲起。但注册制只解决了"谁能上市"，
        真正决定一个市场能不能留住长期资金的，是两件更笨的事：
        退市是否真的执行、投资者被侵害后能不能拿到赔偿。
        这几年政策的注意力，正好在这两件事上。
      sections:
        - title: 这条线是怎么来的
          body: >-
            2018 年证监会修订退市制度的决定是一个转折点，此前"一年退不了几家"
            的局面开始改变；2019 到 2023 年，注册制从科创板试点走到全面落地，
            入口端完成改革，同期债券注册制改革也同步推进。2024 年 4 月新"国九条"
            发布，把"强监管、防风险、促高质量发展"确立为主线，随后市值管理指引、
            分红回购导向、减持约束陆续落地。到 2025 年 12 月，证监会又专门发了
            《关于加强资本市场中小投资者保护的若干意见》（证监会公告〔2025〕19号），
            把保护中小投资者从原则落到具体机制。
        - title: 今天站在哪
          body: >-
            入口（注册制）已经完成，出口（退市）在硬化，追责（代表人诉讼、先行赔付）
            跑通了样板案例，但"执行的确定性"仍是关键变量——退市家数、
            保壳与炒壳的空间、中介机构被追责的比例，才是检验制度是否真落地的
            三个刻度。另一个正在变重的变量是"股东回报"：分红、注销式回购、
            减持约束这一组制度，把上市公司从"融资平台"往"回报载体"上推，
            也是中长期资金敢进来的前提。
        - title: 各方接下来可能怎么做
          body: >-
            监管大概率继续提高退市执行的确定性、完善代表人诉讼与先行赔付的衔接、
            规范减持与破发破净公司的融资行为，同时用 IPO 节奏做逆周期调节；
            券商的投行会从"拼过会"转向"拼执业质量"，并购重组与再融资成为
            项目来源，研究与风控的权重要上来；公募会把治理与股东回报
            变成选股的硬指标，用红利与治理因子产品承接长钱；
            保险在长周期考核落地后，配置会向高分红、治理良好的资产集中。
            这些变化的验证信号都很具体：退市家数、诉讼赔付金额、
            分红与回购规模相对减持规模的比值。
        - title: 反方观点与风险
          body: >-
            反方的担心是"制度在，执行不在"：退市如果年年只有个位数，
            壳价值就还在，炒小炒差的风气就散不掉；代表人诉讼如果立案门槛高、
            赔偿执行难，投资者保护就只是姿态。另一种风险来自节奏——
            IPO 与再融资的逆周期调节如果与市场化定价的承诺冲突，
            会削弱市场主体对规则稳定性的预期，而这恰恰是长期资金最在意的。
        - title: 面试里怎么说
          body: >-
            我会用"入口—出口—追责—回报"四个词来组织：入口是全面注册制，
            出口是退市制度硬化，追责是特别代表人诉讼与先行赔付，回报是分红、
            注销式回购与减持约束。然后指出判断标准不是看文件数量，
            而是看退市家数、赔付金额、分红回购与减持的相对规模。
            最后落到岗位：投行的责任从过会转向执业质量，公募的选股要把治理
            和分红变成硬指标。这样讲既有框架，也有可验证的刻度。
    related_terms: [全面注册制, 投资者保护制度（适当性 / 代表人诉讼 / 先行赔付）,
                    新"国九条"（2024）, 市值管理与"注销式回购",
                    “并购六条”与并购重组新周期]
