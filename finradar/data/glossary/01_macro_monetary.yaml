terms:

  - id: financial_power
    term: 金融强国
    category: 宏观与货币政策
    era: 2023
    plan: 十四五末提出，十五五落地
    heat: 5
    institutions: [券商, 公募, 银行]
    source: 2023年10月中央金融工作会议首次提出；2024年省部级专题研讨班讲话系统阐述"六个强大"；写入《"十五五"规划纲要》(2026.03)
    definition: >-
      以"强大的货币、强大的中央银行、强大的金融机构、强大的国际金融中心、强大的金融监管、
      强大的金融人才队伍"为核心要素（俗称"六个强大"），配套"六个坚持"的金融发展路径，
      目标是到本世纪中叶建成与经济强国相匹配的现代金融体系。
    why_hot: >-
      它是 2023 年以来所有金融政策的总纲。"五篇大文章""中央银行制度""中长期资金入市"
      等具体政策，逻辑起点都挂在金融强国之下。面试官用它考察你有没有政策框架感，
      而不是只会背单个指标。
    exam_points:
      - 六个强大的具体内容（最容易被要求原样复述）
      - 与"金融是国民经济的血脉""金融要为实体经济服务"的关系
      - 金融强国 ≠ 金融规模大：强调质量、定价权、风险抵御能力，中国已是金融大国但非强国
      - 落到本机构：券商→直接融资与定价能力；银行→服务实体与风险管理；公募→居民财富管理
    interview_answer: >-
      金融强国是 2023 年中央金融工作会议提出的总目标，核心是"六个强大"：强大的货币、
      中央银行、金融机构、国际金融中心、金融监管和金融人才队伍。我理解它解决的是
      "大而不强"的问题——我们银行业资产规模全球第一、股市市值全球第二，但人民币的
      国际计价份额、机构的全球定价能力、长钱占比都还有差距。所以后面的政策，比如
      五篇大文章、中长期资金入市、完善中央银行制度，其实都是在补这几块短板。
      落到券商这个岗位上，我觉得最直接相关的是"强大的金融机构"和"国际金融中心"，
      也就是提升投行的定价、承销和跨境服务能力。
    followups:
      - q: 金融强国和金融大国的区别？
        a: >-
          大国看规模（银行业总资产、上市公司市值、社融存量），强国看质量与话语权
          （本币国际化程度、机构全球竞争力、风险定价与处置能力、监管有效性）。
          中国是典型"体量领先、效率与话语权待补"的阶段。
      - q: 六个强大里你觉得最难的是哪个？
        a: >-
          可以答"强大的货币"。人民币在全球支付、储备、大宗计价中的份额与经济体量不匹配，
          且受制于资本项目可兑换程度、离岸市场深度和国债市场的安全资产供给。这是个
          需要制度、市场、信用长期积累的过程，不是短期政策能拉动的。
    related: [五篇大文章, 中央银行制度, 十五五规划]

  - id: five_articles
    term: 金融"五篇大文章"
    aliases: [科技金融, 绿色金融, 普惠金融, 养老金融, 数字金融]
    category: 宏观与货币政策
    era: 2023
    plan: 十四五末提出，十五五全面铺开
    heat: 5
    institutions: [券商, 公募, 银行]
    source: >-
      2023年10月中央金融工作会议；《国务院办公厅关于做好金融"五篇大文章"的指导意见》
      (国办发〔2025〕8号，2025.03)；各行各业配套细则
    definition: >-
      做好科技金融、绿色金融、普惠金融、养老金融、数字金融五篇大文章，是金融服务
      实体经济的五个重点方向。国办发〔2025〕8号文首次给出统一的国家层面部署，
      明确了各条线的目标、工具和考核导向。
    why_hot: >-
      这是最容易被问、也最容易答得空洞的题。区分度在于：能否说出每一篇背后的
      具体工具/产品，以及五篇之间的内在联系（不是五个并列口号，而是"科技金融打头、
      数字金融托底"）。
    exam_points:
      - 五篇的准确名称与顺序（科技、绿色、普惠、养老、数字），漏一个直接扣分
      - 每篇对应的落地抓手：科技金融→科技创新和技术改造再贷款、债券市场"科技板"、
        科创债、银行AIC股权投资、"投贷联动"；绿色金融→碳减排支持工具、绿色债券、
        转型金融目录；普惠金融→普惠小微贷款支持工具、首贷户、无还本续贷；
        养老金融→个人养老金账户、养老目标基金/FOF、养老理财；数字金融→数字人民币、
        数据要素、智能风控
      - 五篇的关系：科技金融是"矛"（培育新动能），绿色金融是"转型"，普惠金融是
        "补短板"，养老金融应对"人口结构"，数字金融是"基础设施"，五篇共用数字底座
      - 结合岗位：银行问"你所在支行怎么做普惠"，券商问"科创债/并购如何服务科技金融"，
        公募问"养老FOF与个人养老金产品设计"
    interview_answer: >-
      五篇大文章是科技金融、绿色金融、普惠金融、养老金融和数字金融，2023年中央
      金融工作会议提出，2025年国办发8号文做了系统部署。我不把它当五个并列口号，
      而是一个结构：科技金融负责培育新动能，对应科创债、科技创新再贷款、银行AIC
      股权投资试点；绿色金融负责存量转型，靠碳减排支持工具和转型金融标准；普惠
      金融补小微和涉农的短板；养老金融对接人口老龄化，落到个人养老金和养老目标
      基金；数字金融是底座，前面四篇的获客、风控、定价都要靠它。如果让我做一个
      具体产品，我会从科技金融切入，因为它的痛点最清晰——科技企业轻资产、缺抵押，
      传统信贷模型不适用，需要靠知识产权质押、投贷联动和债券市场"科技板"来解决。
    followups:
      - q: 科技金融最难的地方在哪？
        a: >-
          风险收益不匹配。银行信贷是"固定收益、覆盖尾部风险"的模式，科技企业是
          高失败率、高上限的分布，用债权工具去承担股权风险必然亏。所以政策方向是
          让股权工具进来（AIC股权投资试点扩围、险资长期投资试点）、让债券市场
          分层（科创债、"科技板"），再用风险分担机制（政府性融资担保、风险补偿金）
          兜住尾部。
      - q: 五篇大文章会不会"各写各的"？
        a: >-
          业内确实有这个担心。五篇共用同一批客户和同一套数据底座，如果分条线考核，
          容易出现重复统计、指标打架。合理的做法是以客户为中心做交叉，比如一家
          绿色科技中小企业，同时属于科技、绿色、普惠三篇，应该统一授信、分类计量。
    related: [新质生产力, 科创债, 银行AIC, 个人养老金, 数字人民币]

  - id: moderately_loose
    term: 适度宽松的货币政策
    category: 宏观与货币政策
    era: 2024
    plan: 十四五末转向，2025-2026 延续
    heat: 5
    institutions: [券商, 公募, 银行]
    source: >-
      2024年12月中央政治局会议、中央经济工作会议首次将货币政策基调由"稳健"改为
      "适度宽松"；2025、2026年延续，2026年增加"灵活高效运用降准降息等工具""促进
      物价合理回升"表述
    definition: >-
      货币政策五档基调（宽松 / 适度宽松 / 稳健 / 适度从紧 / 从紧）中的第二档。
      2024年12月的转向是自2011年以来首次离开"稳健"，标志政策重心从防风险
      转向稳增长与促进物价合理回升。
    why_hot: >-
      基调词是宏观题的"送分题"，但很多人只会说"宽松"而说不出档位、转向时点和
      配套变化。2026年新增的"物价合理回升作为重要考量"是一个非常好的加分点。
    exam_points:
      - 五档基调名称与排序；上一次"适度宽松"是 2008年11月—2010年（应对次贷危机）
      - 转向时点：2024年12月9日政治局会议，2024年12月中央经济工作会议确认
      - 2026年新变化：社会综合融资成本表述由"稳中有降"→"低位运行"；首提把
        "物价合理回升"作为货币政策重要考量（对应 GDP 平减指数长期负值）
      - 与财政政策的搭配："更加积极的财政政策 + 适度宽松的货币政策"
      - 传导：降准（释放长期资金）→ 政策利率（7天期逆回购）→ LPR → 贷款与存款利率
    interview_answer: >-
      货币政策基调有五档，从宽松到从紧，"适度宽松"是第二档。2024年12月中央经济
      工作会议把基调从"稳健"改成"适度宽松"，这是2011年以来第一次，上一次用这个
      提法还是2008年应对金融危机。2026年延续了这个基调，但表述更精细：一是社会
      综合融资成本从"稳中有降"变成"低位运行"，说明降息空间在收窄、更看重维持
      低位；二是首次把"促进物价合理回升"写成货币政策的重要考量，这实际上是在回应
      GDP平减指数持续为负、实际利率偏高的问题。所以我的判断是，后续更可能是
      降准优先于降息，加上结构性工具定向发力，而不是大水漫灌。
    followups:
      - q: 为什么说"物价合理回升"重要？
        a: >-
          名义利率减去通胀才是实际利率。当 CPI/PPI 或 GDP 平减指数低迷时，即使
          名义政策利率降到很低，企业面对的实际融资成本仍然偏高，还会形成
          "价格下跌→收入下降→需求收缩"的循环。所以把物价纳入考量，等于给货币
          政策增加了一个反通缩的锚。
      - q: 降准和降息哪个先来？为什么？
        a: >-
          市场普遍预期降准更可能先行。降息直接压缩银行净息差，而息差已在历史低位、
          关系到银行内生资本补充能力；降准释放的是低成本长期资金，能降低负债端
          成本、对息差反而是正向缓冲，同时配合政府债券大规模发行提供流动性。
    facts_snapshot:
      as_of: 2026-08-20
      LPR_1Y: 3.00%
      LPR_5Y_plus: 3.50%
      基调: "适度宽松（2024年12月至今）"
      note: 数值为公开报道口径，请用 `finradar facts` 或央行官网核对最新值
    related: [LPR, 存款准备金率, 政策利率, 中央银行制度]

  - id: central_bank_system
    term: 中央银行制度（加快完善）
    category: 宏观与货币政策
    era: 2023
    plan: 十五五重点
    heat: 5
    institutions: [券商, 银行]
    source: >-
      2023年中央金融工作会议"加快建设中国特色现代金融体系"；《中国人民银行"十五五"
      改革发展规划》(2026年8月印发) 明确"加快完善中央银行制度"
    definition: >-
      指以健全中国特色现代货币政策框架为核心，推动调控方式从数量型为主转向价格型
      为主，完善基础货币投放机制、市场化利率形成与传导机制，并与宏观审慎管理
      构成"双支柱"的制度安排。
    why_hot: >-
      2026年8月央行"十五五"规划印发后，这是最新、最"硬"的宏观考点，很多同学还
      停留在2019年的LPR改革叙事，答出"十五五规划"的具体提法会明显拉开差距。
    exam_points:
      - 数量调控→价格调控：淡化 M2/社融增速目标，强化以 7天期逆回购利率为主的
        政策利率体系，收窄利率走廊
      - 基础货币投放机制变化：MLF 逐步淡化政策利率属性、改为多重价位中标；
        新增买断式逆回购；重启国债买卖（二级市场）作为流动性投放工具
      - 双支柱：货币政策（总量与价格）+ 宏观审慎管理（跨周期、跨机构、跨市场），
        十五五提出"拓展宏观审慎管理覆盖范围""丰富工具"
      - 汇率：发挥市场在汇率形成中的决定性作用，保持人民币汇率在合理均衡水平上
        基本稳定
      - 开放：人民币国际化、离岸人民币市场、金融基础设施跨境互联互通
    interview_answer: >-
      "加快完善中央银行制度"是2023年中央金融工作会议提出、2026年8月央行"十五五"
      改革发展规划系统落地的一条主线。我理解核心是三件事：第一，调控方式从数量型
      转向价格型，也就是淡化M2和社融增速目标，把7天期逆回购利率确立为主要政策
      利率，收窄利率走廊，让利率信号更清晰；第二，重构基础货币投放，MLF淡化政策
      利率属性、改成多重价位中标，同时新增买断式逆回购、重启国债买卖，工具箱更
      灵活；第三，把宏观审慎作为第二支柱做实，覆盖范围从银行扩展到更多机构和市场。
      对券商研究来说，这意味着看货币政策要盯的锚变了——过去看MLF，现在要看
      7天逆回购和利率走廊。
    followups:
      - q: 为什么央行要买卖国债？是QE吗？
        a: >-
          不是QE。QE是在政策利率触及零下限后、通过大规模购债压低长端利率的非常规
          手段；央行的国债买卖是常规流动性管理工具，目的是丰富基础货币投放渠道
          （替代部分外汇占款和MLF）、并配合调节收益率曲线形态，是双向操作而非
          单向扩表。
      - q: 利率走廊的上下限是什么？
        a: >-
          上限是常备借贷便利（SLF）利率，下限是超额存款准备金利率（IOER）。
          收窄走廊的目的是减少市场利率围绕政策利率的波动，提高利率传导效率。
    related: [政策利率, 买断式逆回购, 宏观审慎, 双支柱]

  - id: policy_rate
    term: 政策利率体系（7天期逆回购利率为主）
    aliases: [OMO, 逆回购利率, 利率走廊]
    category: 宏观与货币政策
    era: 2024
    plan: 十四五末改革，十五五定型
    heat: 5
    institutions: [券商, 公募, 银行]
    source: 2024年6月陆家嘴论坛潘功胜行长讲话；2024年7月起 OMO 改为固定利率、数量招标
    definition: >-
      以公开市场7天期逆回购操作利率为主要政策利率，SLF利率为走廊上限、超额准备金
      利率为走廊下限，通过 DR007 等市场利率围绕政策利率运行，再传导至 LPR、
      债券收益率和存贷款利率。
    why_hot: 债券、固收、宏观岗的必考基础；也是判断"降息"到底降什么的关键。
    exam_points:
      - “降息”在2024年后特指下调7天期逆回购利率，不再指MLF
      - OMO 2024年7月改为固定利率、数量招标（此前为利率招标），使政策利率信号更明确
      - MLF 2024年起改为多重价位中标，回归中期流动性工具属性，不再是政策利率
      - LPR 由 20 家报价行在 7天逆回购利率基础上加点形成，每月20日9:00公布
      - 传导链：7天逆回购 → DR007 → 同业存单/短端国债 → LPR → 贷款利率；
        存款端通过"存款利率市场化调整机制"跟随10年期国债与1年期LPR
    interview_answer: >-
      现在讲"降息"，指的是下调公开市场7天期逆回购操作利率，它是主要政策利率。
      2024年做了两件事把这个体系立起来：一是7月把OMO从利率招标改成固定利率、
      数量招标，政策利率信号不再被投标行为干扰；二是MLF改成多重价位中标，
      淡化它的政策利率属性，回归中期流动性工具。所以传导链是7天逆回购到DR007，
      再到同业存单和短端利率，然后是LPR加点、贷款利率，存款端则通过存款利率
      市场化调整机制参考10年期国债收益率和1年期LPR。判断货币政策松紧，我会
      同时看政策利率的绝对水平和DR007相对政策利率的偏离度。
    followups:
      - q: DR007 和 R007 有什么区别？
        a: >-
          DR007 是存款类金融机构以利率债为质押的7天回购利率，参与者和质押品都
          更"干净"，能更好反映银行体系流动性；R007 覆盖全市场（含非银），会
          包含信用溢价和分层因素。观察政策松紧看 DR007，观察非银流动性分层
          看 R007-DR007 的利差。
      - q: LPR 加点为什么会和政策利率脱钩？
        a: >-
          因为加点部分反映银行的资金成本、风险溢价和供求。当净息差压缩到极限、
          银行缺乏让利空间时，即使政策利率下调，LPR 也可能不动或少动，出现
          "降息不降 LPR"。这也是为什么要同步推动存款利率下行、规范手工补息。
    related: [LPR, DR007, MLF, 适度宽松的货币政策]

  - id: structural_tools
    term: 结构性货币政策工具
    category: 宏观与货币政策
    era: 2020
    plan: 十四五贯穿，十五五继续
    heat: 4
    institutions: [券商, 银行]
    source: 人民银行历年货币政策执行报告"结构性货币政策工具情况表"专栏
    definition: >-
      央行以再贷款、再贴现为载体，对特定领域提供低成本、有期限、"先贷后借"的
      定向资金支持，兼具总量与结构双重功能，被称为"精准滴灌"。
    why_hot: 银行岗位问"你们行怎么用这些工具"，券商宏观问"结构性工具能否替代总量宽松"。
    exam_points:
      - 长期性工具：支农再贷款、支小再贷款、再贴现
      - 阶段性工具：碳减排支持工具、科技创新和技术改造再贷款、普惠养老专项再贷款、
        保障性住房再贷款、股票回购增持再贷款、服务消费与养老再贷款
      - 资本市场专用：证券基金保险公司互换便利（SFISF）、股票回购增持再贷款
        （2024年10月创设的两项支持资本市场工具）
      - 运作机制："先贷后借"——金融机构先按要求投放，再向央行申请等额低成本资金，
        央行按比例报销，不直接投放到企业
      - 局限：只能改变资金价格与方向，改变不了融资需求本身；退出时点与道德风险
    interview_answer: >-
      结构性货币政策工具是央行的"精准滴灌"，本质是再贷款：机构先按政策要求投放
      贷款，再向央行申请等额、低成本、有期限的资金，也就是"先贷后借"。它分三类：
      长期性的支农支小再贷款和再贴现；阶段性的碳减排支持工具、科技创新和技术改造
      再贷款、保障性住房再贷款；还有2024年10月为资本市场专门创设的互换便利SFISF
      和股票回购增持再贷款。它的价值在于总量宽松传导不畅时能定向发力，但它改变
      不了融资需求本身——如果企业没有扩产意愿，再低的资金成本也推不动，这也是
      为什么2026年会强调要和物价回升、财政发力配合。
    followups:
      - q: SFISF 是什么？会扩大基础货币吗？
        a: >-
          证券基金保险公司互换便利：符合条件的非银机构以债券、股票ETF、沪深300
          成分股等资产为质押，从央行换入国债、央票等高流动性资产，再在市场融资
          投向股市。它是"以券换券"，不直接投放基础货币，理论上不扩表，但会提升
          非银机构的融资能力。
    related: [再贷款, SFISF, 碳减排支持工具, 科创债]

  - id: new_quality_productivity
    term: 新质生产力
    category: 宏观与货币政策
    era: 2023
    plan: 十四五末提出，十五五主线
    heat: 5
    institutions: [券商, 公募, 银行]
    source: 2023年9月习近平总书记在黑龙江考察时首次提出；2024年、2025年、2026年政府工作报告持续部署
    definition: >-
      由技术革命性突破、生产要素创新性配置、产业深度转型升级催生的先进生产力质态，
      特征是高科技、高效能、高质量，核心标志是全要素生产率大幅提升。
    why_hot: >-
      它是产业研究和权益投资的顶层叙事。券商行研、公募投研面试常问"你怎么用
      新质生产力框架看某个行业"。
    exam_points:
      - 三个"新"：新技术（AI、量子、生物制造、商业航天、低空经济）、新要素（数据要素）、
        新产业（战略性新兴产业 + 未来产业）
      - “因地制宜发展新质生产力”——反对一哄而上、防止重复建设与内卷式竞争
      - 与金融的接口：科技金融、耐心资本、股权投资、多层次资本市场
      - 衡量指标：全要素生产率（TFP）、研发强度（R&D/GDP）、战略性新兴产业增加值占比
    interview_answer: >-
      新质生产力是2023年提出、现在贯穿整个十五五的产业主线，定义上强调技术
      革命性突破、要素创新性配置和产业深度转型，落脚点是全要素生产率的提升。
      我在做行业研究时会把它拆成三层来用：技术层看AI、商业航天、低空经济、
      生物制造这些方向的技术拐点；要素层看数据要素能不能真正定价和流通；
      产业层看战略性新兴产业和未来产业的渗透率曲线。金融的接口在于它需要
      "耐心资本"——高风险、长周期、失败率高的项目，靠银行债权是喂不出来的，
      所以才有科创债、AIC股权投资、险资长期投资试点这一系列配套。
    followups:
      - q: “因地制宜”这四个字为什么重要？
        a: >-
          针对的是各地一拥而上上同一批赛道导致的重复投资和产能过剩，也是2025年
          以来“反内卷”（综合整治内卷式竞争）政策的逻辑起点。做区域研究和信贷
          投放时，这决定了同一个赛道在不同省份的风险定价完全不同。
    related: [数据要素, 耐心资本, 科创债, 反内卷]

  - id: anti_involution
    term: 反内卷（综合整治"内卷式"竞争）
    category: 宏观与货币政策
    era: 2024
    plan: 十四五末—十五五
    heat: 4
    institutions: [券商, 公募]
    source: 2024年7月中央政治局会议首提"防止‘内卷式’恶性竞争"；2025年中央财经委会议、政府工作报告延续
    definition: >-
      针对部分行业低价无序竞争、地方招商引资过度补贴、产能重复建设导致的
      "增收不增利"现象，通过整治低价倾销、规范地方招商行为、推动落后产能有序
      退出来修复行业盈利能力。
    why_hot: >-
      2025—2026 年权益市场最重要的中观主题之一，直接对应光伏、锂电、汽车、
      电商、外卖等板块的盈利拐点判断，公募/券商权益岗高频。
    exam_points:
      - 宏观含义：与"物价合理回升"是一体两面，PPI 长期负增长的重要成因是供给
        过剩与价格战
      - 政策抓手：《价格法》修订、规范地方政府招商引资行为、行业自律公约、
        产能置换与能耗标准、平台"最低价"规则整改
      - 投资映射：供给收缩逻辑 → 关注行业集中度（CR5）、产能利用率、单位盈利修复
      - 与2015—2016年"供给侧改革"的区别：那轮以行政去产能为主、集中在上游国企；
        这轮更多依赖标准、法治与自律，涉及大量民企和新兴产业，见效更慢
    interview_answer: >-
      "反内卷"是2024年7月政治局会议提出的"防止内卷式恶性竞争"，2025年以后
      升级为综合整治。它和"促进物价合理回升"其实是一件事的两面：PPI持续为负，
      很大程度上不是需求不行，而是供给端产能重复建设、企业打价格战。政策抓手
      包括修订价格法规范低价倾销、规范地方招商引资的补贴行为、行业自律公约、
      以及能耗和产能置换标准。做投资的话，我会把它当成一个供给侧变量，重点跟踪
      产能利用率、行业CR5和单位盈利有没有触底。但要注意它和2016年供给侧改革
      不一样，那轮是行政化去产能、上游国企为主，见效快；这轮主要靠标准和法治，
      对象很多是民企和新兴行业，节奏会更慢、更结构化。
    followups:
      - q: 反内卷会不会推高通胀？
        a: >-
          方向上有利于 PPI 回升，但幅度取决于需求端能否配合。若只压供给而需求
          不改善，可能表现为量缩价平、行业总收入下降。所以政策组合是"反内卷 +
          扩内需（以旧换新、服务消费）+ 适度宽松货币"三条腿。
    related: [新质生产力, 物价合理回升, 供给侧结构性改革]

  - id: local_debt_resolution
    term: 一揽子化债 / 隐性债务置换
    aliases: [化债, 12万亿化债方案, 特殊再融资债]
    category: 宏观与货币政策
    era: 2023
    plan: 十四五末—十五五前期
    heat: 4
    institutions: [券商, 银行]
    source: >-
      2023年7月政治局会议"制定实施一揽子化债方案"；2024年11月全国人大常委会批准
      6万亿元债务限额置换 + 连续5年每年8000亿新增专项债（合计4万亿）+ 2029年后
      到期的2万亿棚改隐性债务不予提前偿还，合计"12万亿"
    definition: >-
      通过提高地方政府债务限额、发行再融资专项债券置换地方政府存量隐性债务，
      实现"高息转低息、短期转长期"，缓释区域流动性风险并腾出财政空间。
    why_hot: 固收、城投研究、银行对公与授信岗高频；也是理解2024年以来信用债利差的关键。
    exam_points:
      - “12万亿”的三段构成必须能拆开讲（6万亿限额 + 4万亿专项债 + 2万亿棚改展期）
      - 化债不是"免债"：是置换与展期，降低利息成本（测算五年节省利息约6000亿元）
      - 对银行的影响：城投贷款/非标被债券置换 → 资产质量改善但资产收益率下降，
        进一步压制净息差
      - 对债市的影响：城投债供给收缩 + 信用风险下降 → 利差压缩、"资产荒"
      - 后续方向：从应急处置转向常态化监管，遏制新增隐性债务、推动城投market化转型
    interview_answer: >-
      一揽子化债始于2023年7月政治局会议，2024年11月落地了通常说的"12万亿"，
      它由三部分组成：一次性提高6万亿债务限额用于置换、连续五年每年8000亿
      新增专项债共4万亿、以及2029年后到期的2万亿棚改隐性债务不再要求提前偿还。
      本质是置换而不是免除，作用是把高息、短久期的隐性债务换成低息、长久期的
      政府债券，测算五年能省下大约6000亿利息。对银行来说是双刃剑：城投类资产
      的信用风险明显缓释，但收益率也从非标的高息降到了政府债的低息，是净息差
      持续承压的一个结构性原因。对债市来说，城投债净供给收缩叠加风险下降，
      直接造就了这两年的"资产荒"和信用利差极致压缩。
    followups:
      - q: 化债和"资产荒"什么关系？
        a: >-
          化债让高票息城投债被低息政府债替代，高收益资产净供给下降；同时银行
          存款利率下调推动居民资金流向理财与债基，配置需求上升。供给下降+需求
          上升，就是"资产荒"——表现为信用利差收窄到历史低位、久期被拉长。
    related: [专项债, 城投, 资产荒, 净息差]

  - id: fifteenth_five_year
    term: “十五五”规划（2026—2030）
    category: 宏观与货币政策
    era: 2025
    plan: 十五五
    heat: 5
    institutions: [券商, 公募, 银行]
    source: >-
      2025年10月二十届四中全会通过《中共中央关于制定国民经济和社会发展第十五个
      五年规划的建议》；2026年3月全国人大审议通过《"十五五"规划纲要》；
      2026年8月央行印发《中国人民银行"十五五"改革发展规划》
    definition: >-
      我国第十五个五年规划期（2026—2030年），是基本实现社会主义现代化的
      关键五年。金融部分的主线是加快建设金融强国、完善中央银行制度、
      提高直接融资比重、深化金融体制改革。
    why_hot: >-
      2026年秋招的"时政第一题"。能把十四五和十五五的金融提法做对比，几乎是
      拉开差距最有效的一招。
    exam_points:
      - 时间线：建议（2025.10四中全会）→ 纲要（2026.03全国人大）→ 部门专项规划
        （如央行2026.08）
      - 金融相关主线：金融强国、完善中央银行制度、提高直接融资比重、
        健全金融监管体系、防范化解重点领域风险、人民币国际化
      - 与"十四五"的差异：十四五强调"防范化解重大金融风险""注册制改革"；
        十五五更强调"强国建设""科技金融体制""耐心资本""统一大市场"
      - 产业接口：新质生产力、人工智能+、数据要素、全国统一大市场、
        碳达峰碳中和中期目标
    interview_answer: >-
      十五五是2026到2030年，2025年10月四中全会先出建议，2026年3月人大通过
      纲要，之后各部门出专项规划，比如央行8月印发了《"十五五"改革发展规划》。
      金融部分我会抓四条主线：一是金融强国和完善中央银行制度，这是总纲；
      二是提高直接融资比重，对应资本市场改革和耐心资本；三是构建科技金融体制，
      包括债券市场"科技板"；四是扩大制度型开放和人民币国际化。和十四五对比，
      十四五的关键词是"防范化解重大金融风险"和"注册制"，是补短板；十五五的
      关键词转向"强国""体制""耐心资本"，是从治乱转向建制。
    followups:
      - q: 十五五规划里和券商最相关的是什么？
        a: >-
          提高直接融资比重与资本市场制度建设：科创板成长层、创业板改革、
          再融资储架发行、并购重组常态化、中长期资金入市、以及债券市场
          "科技板"。这些直接对应投行的项目来源和研究所的覆盖重心。
    related: [金融强国, 中央银行制度, 直接融资, 新质生产力]
