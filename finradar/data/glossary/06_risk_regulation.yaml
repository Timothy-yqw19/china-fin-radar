# 金融热词库 · 金融风险与监管体系
category: 金融风险与监管体系
terms:

  - id: regulatory_framework
    term: “一行一局一会”新监管架构
    aliases: [国家金融监督管理总局, 中央金融委员会, 中央金融工作委员会]
    category: 金融风险与监管体系
    era: 2023
    plan: 十四五末改革，十五五运行
    heat: 5
    institutions: [券商, 公募, 银行]
    source: 2023年3月《党和国家机构改革方案》；2023年5月国家金融监督管理总局挂牌
    definition: >-
      形成"党中央集中统一领导 + 一行一局一会"的架构：中央金融委员会
      （决策议事协调）、中央金融工作委员会（党的建设）；中国人民银行、
      国家金融监督管理总局、中国证券监督管理委员会（调整为国务院直属机构）。
    why_hot: 最基础的送分题，但答不全"三定"变化就会失分。
    exam_points:
      - 银保监会撤销，组建国家金融监督管理总局，统一负责除证券业外的
        金融业监管；划入央行的金融控股公司等监管职责、划入证监会的
        投资者保护职责
      - 央行：撤销大区分行、恢复省级分行体制；剥离部分监管职能，
        聚焦货币政策与宏观审慎
      - 证监会：由事业单位调整为国务院直属机构；划入国家发改委的
        企业债券发行审核职责（实现公司债、企业债统一监管）
      - 地方：设立地方金融管理机构，压实地方风险处置属地责任，
        统一挂"地方金融管理局"牌子，不再加挂金融办
      - 核心逻辑："机构监管 + 行为监管 + 功能监管 + 穿透式监管 +
        持续监管"五位一体，消除监管空白与套利
    interview_answer: >-
      2023 年机构改革后，形成的是"党中央集中统一领导 + 一行一局一会"。
      中央金融委员会负责顶层决策和统筹，中央金融工作委员会负责党的建设；
      执行层面，银保监会撤销、组建国家金融监督管理总局，统一负责除证券业
      外的金融业监管，同时把央行的金融控股公司监管和证监会的投资者保护
      职责划过去；央行撤销大区分行、恢复省级分行，聚焦货币政策和宏观审慎；
      证监会从事业单位改为国务院直属机构，还接过了发改委的企业债审核，
      实现了公司债和企业债的统一监管。地方层面设地方金融管理机构，压实
      属地风险处置责任。整个改革的逻辑就是消除监管空白和监管套利，
      落实"五位一体"的监管方式。
    followups:
      - q: 为什么要把企业债审核划给证监会？
        a: >-
          此前企业债由发改委审核、公司债由证监会审核、非金融企业债务
          融资工具由交易商协会注册，同一类信用债三套规则，存在标准不一
          和监管套利。统一后有利于统一发行、披露与违约处置标准，
          推动债券市场"一个市场、一套规则"。
    related: [中央金融工作会议, 穿透式监管, 金融强国]

  - id: penetrating_supervision
    term: 穿透式监管与"金融牌照持牌经营"
    category: 金融风险与监管体系
    era: 2017
    plan: 十四五强化，十五五常态
    heat: 4
    institutions: [券商, 公募, 银行]
    source: 2017年第五次全国金融工作会议；2023年中央金融工作会议"依法将所有金融活动纳入监管"
    definition: >-
      按照"实质重于形式"原则，穿透识别产品的最终资金来源、中间环节和
      最终投向，将同一类业务纳入同一套规则；同时要求金融活动必须持牌经营。
    exam_points:
      - 四个穿透：穿透资金来源、穿透中间环节、穿透最终投向、穿透
        实际控制人
      - ‘金融活动全部纳入监管’的含义：不存在‘监管空白地带’，
        地方交易场所、类金融机构、互联网平台金融业务都要纳入
      - 典型应用：资管产品嵌套整改、金控公司准入、互联网存贷款规范、
        私募基金"伪私募"整治
      - 与"分业监管"的关系：机构是分业的，但产品是跨业的，
        所以要用功能监管与行为监管补位
    interview_answer: >-
      穿透式监管的原则是实质重于形式，具体是"四个穿透"：穿透资金来源、
      中间环节、最终投向和实际控制人。它要解决的是分业监管框架下的
      结构性漏洞——机构是按银行、证券、保险分业发牌的，但产品是跨业的，
      一个资管产品可以嵌套好几层跨越三个行业，如果只看形式，就会出现
      同样的业务适用不同规则的监管套利。所以 2023 年中央金融工作会议
      提出"依法将所有金融活动纳入监管"，配合功能监管和行为监管补位。
      落地案例包括资管新规的去嵌套、金控公司准入、互联网存贷款规范和
      私募"伪私募"整治。
    related: [资管新规, 一行一局一会, 金融控股公司]

  - id: systemic_risk
    term: 防范化解重点领域金融风险
    aliases: [房地产, 地方债务, 中小金融机构, 三大重点领域]
    category: 金融风险与监管体系
    era: 2023
    plan: 十四五末攻坚，十五五收尾
    heat: 5
    institutions: [券商, 银行]
    source: 2023年中央金融工作会议明确房地产、地方债务、中小金融机构三大重点领域
    definition: >-
      以"稳定大局、统筹协调、分类施策、精准拆弹"为原则，
      针对房地产、地方政府债务、中小金融机构三大风险源分类处置。
    exam_points:
      - 三大领域及各自抓手：房地产→白名单、保交房、收储；
        地方债务→隐性债务置换、遏制新增；中小金融机构→兼并重组、
        村镇银行"村改支/村改分"、农信社改制为省级农商行
      - “精准拆弹”原则：避免处置风险的风险，防止引发次生流动性冲击
      - 金融稳定保障基金 + 存款保险基金 + 行业保障基金构成的
        风险处置资金池
      - 早期纠正机制：金融监管总局对高风险机构的"硬约束"早期干预
      - 《金融稳定法》立法进程：为风险处置提供统一法律依据
    interview_answer: >-
      2023 年中央金融工作会议把风险重点收敛到三个领域：房地产、地方债务
      和中小金融机构。房地产的抓手是白名单融资协调机制、保交房和收储
      存量房；地方债务是隐性债务置换加遏制新增，也就是通常说的一揽子
      化债；中小金融机构是兼并重组，村镇银行做"村改支""村改分"，
      农信社改制成省级农商行，用规模化和股权集中来提高治理水平。
      原则是"精准拆弹"，强调不要在处置风险的过程中引发新的风险。
      制度保障上有三层资金池：金融稳定保障基金、存款保险基金和行业
      保障基金，再加上早期纠正机制和正在推进的《金融稳定法》立法。
    related: [化债, 房地产金融新模式, 存款保险]

  - id: deposit_insurance
    term: 存款保险制度
    category: 金融风险与监管体系
    era: 2015
    plan: 长期制度
    heat: 3
    institutions: [银行]
    source: 《存款保险条例》2015年5月1日施行
    definition: >-
      对同一存款人在同一家投保机构的本金和利息合并计算，最高偿付限额
      50 万元人民币；实行风险差别费率，兼具早期纠正与风险处置功能。
    exam_points:
      - 偿付限额 50 万元，覆盖 99% 以上存款人的全额存款
      - 保的是"存款"，不保理财、基金、保险等非存款产品
      - 差别费率：风险越高、费率越高，形成市场化约束
      - 存款保险基金管理机构可参与问题机构的收购承接与风险处置
    interview_answer: >-
      存款保险条例 2015 年施行，最高偿付限额是 50 万元，按同一存款人在
      同一家投保机构的本息合并计算，能全额覆盖 99% 以上的存款人。
      要注意它保的只是存款，理财、基金、保险这些非存款产品不在保障
      范围内，这也是销售适当性中必须讲清楚的一点。费率是风险差别费率，
      经营越激进、风险越高的银行交得越多，形成市场化约束。除了赔付，
      存款保险基金还能参与问题机构的收购承接，是中小金融机构风险处置
      的重要工具。
    related: [系统性风险, 中小金融机构改革]

  - id: aml
    term: 反洗钱与新《反洗钱法》
    category: 金融风险与监管体系
    era: 2024
    plan: 十四五末修法，十五五实施
    heat: 4
    institutions: [银行, 券商, 公募]
    source: >-
      《中华人民共和国反洗钱法》2024年11月8日修订通过，2025年1月1日起施行；
      配套《反洗钱和反恐怖融资监督管理办法》
    definition: >-
      修订后的反洗钱法扩大了适用范围（覆盖特定非金融机构）、
      强化了受益所有人识别、明确了"风险为本"原则，并加大了处罚力度。
    exam_points:
      - 三大核心义务：客户尽职调查（CDD/KYC）、大额与可疑交易报告、
        客户身份资料与交易记录保存（不少于 5 年）
      - “风险为本”：按风险等级配置资源，高风险客户加强尽调（EDD）
      - 新法要点：受益所有人信息登记与识别、特定非金融机构（房地产、
        贵金属、律所会计所等）纳入、保护个人信息与合理便利并重
      - “反洗钱三反”：反洗钱、反恐怖融资、反逃税
      - 高频面试点：柜面/合规岗会问"发现可疑交易怎么处理"——
        流程是识别→内部报告→上报中国反洗钱监测分析中心，不得泄露
        （"禁止泄密"义务）
    interview_answer: >-
      新的《反洗钱法》2024 年 11 月修订通过、2025 年 1 月 1 日施行。
      核心义务还是三项：客户尽职调查、大额和可疑交易报告、客户身份
      资料和交易记录保存至少五年。修订的重点有三个：一是确立"风险为本"
      原则，按风险等级配置合规资源，不再一刀切；二是强化受益所有人
      识别和信息登记，穿透到最终自然人；三是把房地产、贵金属、
      律师会计师这些特定非金融机构纳入适用范围，同时也强调保护个人
      信息、不能过度收集。实操上如果发现可疑交易，流程是识别、内部
      报告、通过系统上报中国反洗钱监测分析中心，并且负有保密义务，
      不能向客户泄露。
    related: [合规, 客户适当性]

  - id: investor_protection
    term: 投资者保护制度（适当性 / 代表人诉讼 / 先行赔付）
    category: 金融风险与监管体系
    era: 2019
    plan: 十四五建立，十五五强化
    heat: 4
    institutions: [券商, 公募, 银行]
    source: >-
      2019年新《证券法》确立中国特色证券集体诉讼（特别代表人诉讼）；
      2022年《期货和衍生品法》；《证券期货投资者适当性管理办法》
      （2020年修订、2023年再修订）
    definition: >-
      以"卖者尽责、买者自负"为前提的一整套安排：投资者适当性管理、
      特别代表人诉讼（默示加入、明示退出）、先行赔付、支持诉讼、
      示范判决与调解机制。
    exam_points:
      - 适当性三要素：了解客户（KYC）、了解产品（KYP）、适当性匹配；
        举证责任在机构（"卖者尽责"未履行则承担赔偿责任）
      - 特别代表人诉讼："默示加入、明示退出"，由投服中心接受 50 名以上
        投资者委托后作为代表人提起；康美药业案是首例
      - 先行赔付：由发行人控股股东、实际控制人或中介机构先行赔付投资者，
        再向其他责任方追偿（如紫晶存储案）
      - “追首恶”与“惩帮凶”：对实际控制人和中介机构（券商、会计师、律师）
        的连带责任认定
    interview_answer: >-
      投资者保护现在是一套组合拳。前端是适当性管理，三要素是了解客户、
      了解产品、做适当性匹配，关键在于举证责任在机构，如果机构不能证明
      自己尽责，就要承担赔偿责任，这就是"卖者尽责、买者自负"的法律含义。
      后端是救济机制：2019 年新证券法确立了中国特色的特别代表人诉讼，
      采用"默示加入、明示退出"，由投服中心接受五十名以上投资者委托后
      作为代表人起诉，康美药业案是首例；还有先行赔付，由控股股东、
      实际控制人或者中介机构先赔投资者再去追偿，紫晶存储案是典型。
      配合"追首恶、惩帮凶"的责任认定，整个逻辑是把违法成本真正抬起来。
    related: [新国九条, 注册制, 退市]

  - id: program_trading
    term: 程序化交易与量化监管
    category: 金融风险与监管体系
    era: 2024
    plan: 十四五末立规，十五五执行
    heat: 4
    institutions: [券商, 公募]
    source: >-
      2023年沪深交易所程序化交易报告制度；
      2024年5月证监会《证券市场程序化交易管理规定（试行）》；
      2025年沪深北交易所程序化交易管理实施细则（含高频交易差异化收费）
    definition: >-
      对程序化交易实行报告管理、差异化收费与重点监控，明确高频交易的
      认定标准（如每秒申报笔数、单日申报笔数上限）并从严管理。
    exam_points:
      - 报告制度：先报告后交易，报告账户信息、策略类型、系统信息
      - 高频交易认定：单账户每秒申报/撤单笔数达到一定阈值，或单日
        申报/撤单笔数达到阈值
      - 差异化收费：对高频交易提高流量费、撤单费
      - 异常交易监控：瞬时申报速率异常、频繁瞬时撤单、日内高频突击
        拉抬打压等四类
      - 监管取向：不否定量化的定价效率与流动性贡献，但要求"公平性"
        与"不放大波动"
    interview_answer: >-
      程序化交易监管这两年成体系了。2024 年 5 月证监会出了《证券市场
      程序化交易管理规定（试行）》，2025 年交易所又发了实施细则。
      框架是三层：一是报告制度，先报告后交易，报账户、策略类型和
      系统信息；二是高频交易的认定和差异化收费，按每秒申报撤单笔数和
      单日笔数设阈值，达到阈值的按高频管理并提高流量费和撤单费；
      三是异常交易监控，重点盯瞬时申报速率异常、频繁瞬时撤单、
      日内高频突击拉抬打压这几类。监管的态度我理解不是否定量化——
      量化对流动性和定价效率是有贡献的——而是要解决速度优势带来的
      公平性问题，以及避免在极端行情下放大波动。
    related: [新国九条, 交易制度]
