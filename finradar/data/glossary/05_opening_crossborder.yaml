# 金融热词库 · 对外开放与跨境投融资
# 这一类是"额度型"考点：几乎每个制度都要能答出「谁能用 / 投什么 / 额度多少 / 最新变化」

category: 对外开放与跨境投融资
terms:

  - id: qdii
    term: QDII（合格境内机构投资者）
    aliases: [Qualified Domestic Institutional Investor, QDII额度]
    category: 对外开放与跨境投融资
    era: 2006
    plan: 十四五扩容，十五五常态化
    heat: 5
    institutions: [公募, 银行, 券商]
    source: >-
      2006年试点；《合格境内机构投资者境外证券投资管理试行办法》；
      额度由国家外汇管理局按机构逐笔核准，每月在外汇局官网公示
      《合格境内机构投资者（QDII）投资额度审批情况表》
    definition: >-
      在人民币资本项目尚未完全可兑换的前提下，允许经批准的境内基金公司、
      证券公司、银行、保险、信托等机构，在外汇局核准的额度内，将境内资金
      结汇后投资境外证券市场的制度安排。个人无法直接做 QDII，只能通过
      买 QDII 基金/理财参与。
    why_hot: >-
      2024—2026 年境内投资者出海需求（美股、日股、印度、港股、黄金、
      海外债）暴涨，QDII 基金频繁限购、二级市场高溢价，额度就成了硬约束。
      公募面试问"你怎么看 QDII 溢价"，银行理财问"跨境资产配置怎么落地"，
      都要从额度制度讲起。
    exam_points:
      - 额度是机构额度、不是产品额度：外汇局批给机构一个总盘子，机构在内部
        分配给各只 QDII 基金/理财产品
      - 额度用满 → 基金只能限购或暂停申购 → 场内 LOF 出现高溢价 → 溢价套利
        风险提示。这是 QDII 溢价的制度性成因，不是市场情绪
      - 额度审批口径：以美元计价，累计批准额度（存量概念），外汇局按月公示
      - 2026 年最新表态：外汇局提出「稳妥有序、常态化发放QDII额度」，并明确
        向公募产品倾斜，支持投资管理能力强、产品认可度高、合规水平高的机构
      - QDII 与 QDLP/QDIE 的区别：QDII 投境外二级市场证券；QDLP/QDIE 是地方
        试点，投境外一级市场/另类资产（对冲基金、PE、不动产）
      - 汇率维度：QDII 涉及结汇购汇，额度节奏本身就是外汇管理逆周期调节的工具，
        人民币贬值压力大时发放趋缓，压力缓解时扩容
    facts_snapshot:
      as_of: 2026-06-30
      QDII累计批准额度: "1761.69 亿美元"
      较2025年末新增: "约 53 亿美元"
      其中证券基金类机构: "972.80 亿美元"
      节奏: "2026-03-23 发放一轮后三个多月停发；7月外汇局表态常态化发放；8月末新一轮发放落地"
      source_note: 外汇局按月公示；数字随时更新，答题时说清截止时点即可
    interview_answer: >-
      QDII 是合格境内机构投资者，本质是在资本项目没有完全开放的前提下，
      给境内机构开的一个"出海通道"：外汇局按机构核准一个美元额度，机构在
      额度内把境内资金结汇出去投境外证券。要注意额度是给机构的，不是给单只
      产品的，所以当一家基金公司的总额度用满，它旗下的 QDII 基金就只能限购
      甚至暂停申购，场内 LOF 因为份额不能新增，就会出现明显溢价——这也是
      为什么这两年频繁看到 QDII 基金溢价风险提示，它是制度性的，不完全是
      情绪。数据上，截至 2026 年 6 月末累计批准额度是 1761.69 亿美元，比
      2025 年末增加大约 53 亿，其中证券基金类占 972.8 亿。2026 年 7 月外汇局
      明确要"常态化发放"并向公募产品倾斜，8 月末就落地了新一轮，方向是
      更规则化、更向零售端倾斜。另外额度的发放节奏本身也带有逆周期属性，
      跟人民币汇率压力是有关联的。
    followups:
      - q: QDII 基金溢价能套利吗？
        a: >-
          理论上"场内买、赎回"或"申购、场内卖"可以套，但溢价往往正好发生在
          申购被限制的时候，套利通道被堵住，所以溢价可以长期存在。对投资者
          而言，高溢价买入意味着一旦额度放开、溢价回归，会承受净值之外的
          额外亏损，这是典型的"制度性风险"而非市场风险。
      - q: QDII 和港股通有什么不同？
        a: >-
          QDII 是"资金出境"，要结汇、占用外汇额度，可投全球；港股通是
          "闭环互联互通"，资金以人民币交收、原路返回，不动用 QDII 额度，
          但只能投港股且有标的范围限制。所以监管更鼓励互联互通模式，因为
          跨境资金流动是可控闭环的。
      - q: 为什么额度不干脆取消？
        a: >-
          因为它是资本项目管理的最后一道闸门。QDII 是纯粹的资金流出通道，
          在人民币汇率或国际收支承压时，额度节奏就是一个成本很低、可逆的
          调节工具。QFII 的额度已经取消，是因为那是资金流入方向。
    related: [QFII, QDLP, 港股通, 跨境理财通, 资本项目可兑换]

  - id: qfii_rqfii
    term: QFII / RQFII（合格境外投资者）
    aliases: [合格境外机构投资者, 人民币合格境外机构投资者, 合格境外投资者]
    category: 对外开放与跨境投融资
    era: 2002
    plan: 十三五取消额度，十四五合并制度，十五五深化
    heat: 5
    institutions: [券商, 公募]
    source: >-
      QFII 2002年设立、RQFII 2011年设立；
      2019年9月10日国家外汇管理局宣布取消 QFII/RQFII 投资额度限制；
      2020年9月证监会、人民银行、外汇局发布《合格境外机构投资者和人民币合格
      境外机构投资者境内证券期货投资管理办法》（2020年11月1日施行），
      将两项制度合并为"合格境外投资者"
    definition: >-
      允许经证监会批准的境外机构投资者，在完成登记后将外汇（QFII）或离岸
      人民币（RQFII）汇入境内，投资境内证券期货市场的制度。合并后统称
      "合格境外投资者"（QFI）。
    why_hot: >-
      这是最容易答错的一个额度题：很多人还在说"QFII 额度多少"，
      实际上额度早在 2019 年就取消了。能准确说出"取消额度 + 2020 年合并制度 +
      投资范围扩大"，是非常明显的加分点。
    exam_points:
      - ★ 额度已取消：2019年9月10日外汇局取消 QFII/RQFII 额度限制，
        改为登记备案管理；现在没有「QFII 额度」这个说法，只有「合格境外
        投资者名录」
      - 2020年11月1日起 QFII 与 RQFII 合并为一套规则：统一资格条件、简化
        申请材料、取消准入门槛中的资产规模与经营年限硬指标
      - 投资范围扩大：在股票、债券、基金基础上，新增金融期货、商品期货、
        期权、私募基金、债券回购、证券出借、融资融券等
      - 2024年7月起进一步放宽汇出币种限制（允许更灵活地选择汇出币种），
        便利资金进出
      - QFI 与"互联互通"（陆股通）的关系：QFI 是"引进来"的机构渠道，可投
        范围更广、可做衍生品与私募；陆股通是交易所层面的闭环通道，标的受限
        但便利度高。外资持A股的主流渠道是陆股通，QFI 是补充但不可替代
      - 与 QDII 的方向差异：QFI = 资金流入（无额度）；QDII = 资金流出（有额度）。
        这一"入无额度、出有额度"的不对称本身就是资本项目管理思路的体现
    interview_answer: >-
      QFII 和 RQFII 是境外机构投资境内市场的渠道，区别只在汇入的是外汇还是
      离岸人民币。这里有两个关键节点必须说清：第一，2019 年 9 月外汇局已经
      取消了 QFII/RQFII 的投资额度限制，改成登记管理，所以现在严格来说不存在
      "QFII 额度"了；第二，2020 年 11 月两项制度正式合并为"合格境外投资者"，
      统一了资格条件、放宽了准入门槛，投资范围也从股债基扩大到金融期货、
      商品期货、期权、私募基金、融资融券和证券出借。2024 年 7 月又放宽了
      汇出币种限制。我觉得这里最有意思的是不对称：流入方向的 QFI 已经无额度，
      流出方向的 QDII 还是逐笔核准额度，这恰恰反映了当前资本项目管理"宽进
      慎出"的取向，跟人民币汇率和国际收支的压力方向是一致的。
    followups:
      - q: 既然 QFI 没有额度了，外资进 A 股还有什么约束？
        a: >-
          主要是持股比例和行业限制：单个境外投资者持有单一上市公司股份
          比例上限、全部境外投资者合计持股上限，以及负面清单行业的外资准入
          限制；另外还有资金汇出的税务与合规审查、以及跨境数据与信息报送要求。
      - q: 外资更爱用陆股通还是 QFI？
        a: >-
          绝大部分被动和交易型资金走陆股通，因为开户简单、结算便利、不需要
          在境内落地；QFI 主要被需要做衍生品对冲、参与打新与定增、投资债券
          回购和私募的机构使用。两者是互补关系。
    related: [QDII, 陆股通, 互联互通, 资本项目可兑换]

  - id: qdlp_qflp
    term: QDLP / QDIE 与 QFLP
    aliases: [合格境内有限合伙人, 合格境内投资企业, 合格境外有限合伙人]
    category: 对外开放与跨境投融资
    era: 2012
    plan: 十四五扩围，十五五常态化
    heat: 3
    institutions: [券商, 公募]
    source: 上海（QDLP，2012）、深圳（QDIE，2014）、北京、青岛、天津等地试点；QFLP 2011年上海首推
    definition: >-
      - QDLP（合格境内有限合伙人）/ QDIE（合格境内投资企业）：地方试点的"出海"
        通道，允许境内合格投资者认购境内私募基金，再由基金投向境外二级市场
        以外的另类资产（对冲基金、PE/VC、境外不动产、大宗商品）。
      - QFLP（合格境外有限合伙人）：允许境外资金结汇后，以人民币投资境内
        私募股权基金、参与境内非上市企业股权投资。
    why_hot: >-
      是 QDII/QFI 之外的"另类通道"，跨境业务岗、私募 FOF、券商跨境衍生品岗
      会问到；也常被用来考察你对"通道分层"的理解。
    exam_points:
      - 一句话记忆：QDII 出海买证券、QDLP/QDIE 出海买另类、QFLP 引外资做股权、
        QFI 引外资买证券
      - QDLP/QDIE 是地方试点额度，由地方金融管理部门 + 外汇局分局共同管理，
        额度规模远小于 QDII
      - 参与门槛高：面向合格投资者（通常 100 万元起，部分试点 200 万/300 万起）
      - 风险点：底层是境外另类资产，估值频率低、流动性差、信息披露弱
    interview_answer: >-
      如果把跨境通道排个表，最清楚：出海方向，QDII 走的是境外二级市场证券，
      QDLP 和 QDIE 是地方试点，走的是境外另类资产，比如对冲基金、PE、
      境外不动产；引进方向，合格境外投资者 QFI 买境内证券，QFLP 则是外资
      通过人民币基金做境内股权投资。QDLP/QDIE 的额度是地方给的、规模小得多，
      投资门槛也高，通常一百万起，底层资产估值频率低、流动性差，所以是
      面向高净值和机构的补充通道，不是零售产品。
    related: [QDII, QFII, 私募基金]

  - id: connect_schemes
    term: 互联互通机制（沪深港通 / 债券通 / 互换通 / 跨境理财通）
    aliases: [陆股通, 港股通, 北向通, 南向通, Swap Connect, 跨境理财通]
    category: 对外开放与跨境投融资
    era: 2014
    plan: 十四五持续扩容，十五五深化
    heat: 5
    institutions: [券商, 公募, 银行]
    source: >-
      沪港通 2014.11；深港通 2016.12；债券通北向通 2017.07、南向通 2021.09；
      跨境理财通 2021.09（2024年2月发布 2.0 版优化）；互换通北向 2023.05
    definition: >-
      在两地交易所/基础设施之间建立的封闭式跨境投资通道：资金以本币在两地
      结算、原路返回，不直接冲击外汇管理，因此不占用 QDII/QFI 额度。
    why_hot: >-
      "闭环 + 本币结算"是理解中国资本市场开放路径的核心逻辑，几乎是所有
      开放类问题的标准答题框架。
    exam_points:
      - 闭环原则：资金跨境但净额结算、原路返回，可监测可控，这是它区别于
        QDII/QFI 的最大制度优势
      - 沪深港通：北向（外资买 A 股，即"陆股通"）、南向（内地买港股，即
        "港股通"）；每日额度限制（北向、南向各有当日净买入上限）而非总额度
      - 债券通：北向通（外资买境内债）、南向通（内地机构买境外债，有年度
        总额度与每日额度）
      - 互换通（Swap Connect）：境外投资者通过香港参与境内利率互换（IRS），
        用于对冲持有境内债券的利率风险，2023年5月开通北向
      - 跨境理财通：粤港澳大湾区居民互购两地理财产品，2024年2月的 2.0 版
        降低了投资者准入门槛、扩大了产品范围、提高了个人额度上限（个人额度
        由 100 万元提高到 300 万元人民币），并允许证券公司参与
      - 2024—2026 年方向：ETF 通扩容、REITs 纳入互联互通、人民币柜台纳入
        港股通、优化互换通与债券通的对冲工具
    interview_answer: >-
      互联互通是我国资本市场开放的主路径，它的精髓是"闭环 + 本币结算"：
      资金跨境但净额清算、原路返回，监管可测可控，所以不占用 QDII 或
      合格境外投资者的额度。目前形成了四条主线：沪深港通做股票，分北向的
      陆股通和南向的港股通，限制是每日净买入额度而不是总额度；债券通做债券，
      北向让外资买境内债，南向让内地机构买境外债；互换通做衍生品，让外资
      通过香港参与境内利率互换，解决他们持有境内债券没法对冲利率风险的问题；
      跨境理财通做零售，2024 年 2.0 版把个人额度从 100 万提到 300 万，还
      放开了券商参与。整体趋势是从"股"到"债"再到"衍生品和零售"，从
      "引进来"到"双向"。
    followups:
      - q: 为什么要有互换通？
        a: >-
          外资持有大量境内人民币债券，但此前缺少在岸利率风险对冲工具，
          汇率可以在离岸市场对冲，利率不行。互换通让他们能参与境内 IRS，
          补上了这一环，直接提升了持有境内债券的意愿，是"配套设施决定
          开放深度"的典型例子。
      - q: 跨境理财通 2.0 改了什么？
        a: >-
          主要四点：放宽投资者准入（增加了以"近三年年均收入"为标准的通道）、
          提高个人投资额度（100万→300万元）、扩大合资格产品范围（南向增加
          "R1-R4"风险等级中较高风险产品等）、允许合资格证券公司参与。
    related: [QDII, QFII, 人民币国际化, 港股通]

  - id: rmb_internationalization
    term: 人民币国际化
    category: 对外开放与跨境投融资
    era: 2009
    plan: 十四五稳慎推进，十五五加快
    heat: 5
    institutions: [券商, 银行]
    source: >-
      2009年跨境贸易人民币结算试点；2016年人民币加入 SDR；
      《中国人民银行"十五五"改革发展规划》(2026.08) 提出推进人民币国际化、
      推进离岸人民币市场发展、加强金融基础设施跨境互联互通
    definition: >-
      推动人民币在跨境贸易结算、投融资、外汇交易和官方储备中的使用，
      提法从"稳慎推进"演进为"稳慎扎实推进"，十五五进一步强调离岸市场与
      基础设施建设。
    why_hot: >-
      2025—2026 年热度极高：CIPS 扩容、数字人民币国际运营中心落地上海、
      稳定币与跨境支付的讨论，都挂在这条主线上。
    exam_points:
      - 三大职能：计价、结算、储备。真正的短板是"计价"（大宗商品定价权）
        和"储备"（各国外汇储备中人民币占比）
      - 基础设施：CIPS（人民币跨境支付系统）是核心；2025年底发布新规、
        2026年2月起施行，完善参与者管理与业务规则
      - 数字人民币国际运营中心：2025年设立于上海，2026年6月与首批 26 家
        金融机构签署直接参与协议，推进数字人民币在离岸业务中的应用
      - 离岸市场：香港是最大离岸人民币枢纽（点心债、离岸人民币存款、
        人民币柜台）；新加坡、伦敦、中东为增长极
      - 制约因素：资本项目未完全可兑换、安全资产（国债）供给与二级市场
        深度、法治与信息透明度、网络效应下的路径依赖
    interview_answer: >-
      人民币国际化看三个职能：结算、计价、储备。结算这些年进步最快，
      跨境贸易人民币结算占比明显提升，CIPS 的参与者和处理量持续扩容，
      2025 年底还出了新规、2026 年 2 月起施行。计价和储备是真正的短板，
      大宗商品定价权和各国储备中的人民币份额都还偏低。十五五的抓手我理解
      有三个：一是基础设施，CIPS 加上数字人民币国际运营中心，后者 2026 年
      6 月已经和首批 26 家机构签了直接参与协议；二是离岸市场，香港的点心债、
      离岸存款和人民币柜台，还有中东、东盟这些增量区域；三是安全资产供给，
      也就是国债市场的深度和开放度，因为国际货币的底层是可信的安全资产。
      根本约束还是资本项目可兑换程度和法治透明度，这决定了它是个长周期变量。
    followups:
      - q: 稳定币对人民币国际化是机会还是威胁？
        a: >-
          两面。美元稳定币放大了美元的网络效应，是竞争压力；但代币化清算也
          提供了绕开传统代理行体系的可能，香港 2025 年 8 月生效的《稳定币
          条例》就是在监管框架内探索离岸人民币稳定币的空间。主流判断是
          中国内地以数字人民币（央行数字货币）为主路径，香港作为离岸试验场。
    related: [CIPS, 数字人民币, 稳定币, 互联互通]

  - id: cips
    term: CIPS（人民币跨境支付系统）
    category: 对外开放与跨境投融资
    era: 2015
    plan: 十四五扩容，十五五升级
    heat: 4
    institutions: [银行]
    source: 2015年10月一期上线，2018年二期全面投产；2025年12月发布业务规则新规，2026年2月起施行
    definition: >-
      由中国人民银行组织建设、跨境银行间支付清算（上海）有限责任公司运营的
      人民币跨境支付清算基础设施，提供跨境人民币清算、结算服务，参与者分为
      直接参与者与间接参与者。
    exam_points:
      - CIPS ≠ SWIFT：SWIFT 是报文通道（谁给谁发指令），CIPS 是清算系统
        （钱怎么划转）。CIPS 目前仍大量使用 SWIFT 报文，也支持自有报文
      - 直接参与者可在 CIPS 开户直接清算，间接参与者需通过直参行接入
      - 2026年2月施行的新规重点：完善参与者准入与退出、明确业务处理规则、
        强化风险管理与应急安排
    interview_answer: >-
      CIPS 是人民币的跨境清算系统，2015 年上线、2018 年二期投产。要注意它
      和 SWIFT 不是替代关系：SWIFT 是报文层，负责传递支付指令；CIPS 是清算层，
      负责资金划拨。CIPS 目前也在用 SWIFT 报文，同时支持自有报文标准。参与者
      分直参和间参，直参可以直接在系统里清算。2025 年底出了新的业务规则、
      2026 年 2 月起施行，主要是完善参与者管理和风险处置。它的意义在于，
      人民币要国际化，必须有一套自己可控的清算基础设施，否则结算规模再大
      也是建立在别人的管道上。
    related: [人民币国际化, 数字人民币, 稳定币]

  - id: institutional_opening
    term: 制度型开放
    category: 对外开放与跨境投融资
    era: 2018
    plan: 十四五提出，十五五深化
    heat: 4
    institutions: [券商, 公募, 银行]
    source: 2018年中央经济工作会议首提；十四五规划、十五五规划纲要持续强调
    definition: >-
      从商品和要素流动型开放（降关税、放额度）转向规则、规制、管理、标准等
      制度层面的开放，强调与国际高标准经贸规则对接。
    exam_points:
      - 金融业具体体现：取消证券、基金、期货、寿险外资持股比例限制
        （2020年全面取消）；放宽外资机构业务范围；会计准则、评级、审计的
        国际互认；对接 CPTPP、DEPA 相关规则
      - 与"额度型开放"的区别：额度型是"量"的放开，制度型是"规则"的趋同，
        后者更难逆转、也更影响长期资本流入
    interview_answer: >-
      制度型开放是 2018 年提出的概念，指从降关税、放额度这种"要素流动型开放"，
      转到规则、规制、管理、标准的开放。金融业最典型的例子是 2020 年全面
      取消了证券、基金、期货和寿险的外资持股比例限制，外资可以设立全资
      控股机构；再往后是会计、审计、评级标准的国际互认，以及对接 CPTPP、
      DEPA 这类高标准经贸规则。它比额度型开放更重要，因为额度可以随时收，
      规则一旦对接就形成了长期可预期的环境，这才是长期外资真正看重的。
    related: [QFII, 互联互通, 人民币国际化]
