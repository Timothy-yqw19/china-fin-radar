# 金融热词库 · 银行与保险
category: 银行与保险
terms:

  - id: nim
    term: 净息差（NIM）与息差管理
    aliases: [净利息收益率, 息差收窄]
    category: 银行与保险
    era: 2021
    plan: 十四五持续承压，十五五修复
    heat: 5
    institutions: [银行, 券商]
    source: 金融监管总局按季公布《商业银行主要监管指标情况表》；央行货币政策执行报告专栏多次讨论
    definition: >-
      净利息收入 / 生息资产平均余额。反映银行"存贷价差"的盈利能力，
      是银行最核心的经营指标。2022 年以来受 LPR 下行、存量房贷利率调整、
      化债置换等因素影响持续收窄，已跌破 1.8% 的"合意"参考线。
    why_hot: >-
      银行岗第一必问题。会不会分析息差，直接区分"背过银行知识"和
      "理解银行商业模式"。
    exam_points:
      - 拆解公式：NIM = (生息资产收益率 − 计息负债成本率) × 结构因子；
        分析必须拆到"量、价、结构"三层
      - 资产端下行原因：LPR 多次下调、存量房贷利率批量下调、化债置换
        （高息城投资产→低息政府债）、有效信贷需求不足导致的"资产荒"与内卷式竞价
      - 负债端刚性原因：存款定期化与长期化（居民风险偏好下降）、
        存款竞争、手工补息（已被整治）
      - 政策对冲：存款利率市场化调整机制（参考 10 年期国债收益率和 1 年期 LPR）、
        多轮下调挂牌利率、整治手工补息与高息揽储、规范同业存款定价
      - 修复路径：负债端降成本 + 资产端结构优化（提高零售与中收占比）+
        非息收入（财富管理、投行、结算）
      - 息差与资本的联系：息差 → 利润 → 内源资本补充 → 信贷投放能力，
        所以监管关注息差不是关注银行盈利，而是关注信贷供给可持续性
    interview_answer: >-
      净息差是净利息收入除以生息资产平均余额，是银行最核心的盈利指标。
      这几年持续收窄，我会拆成资产端和负债端看。资产端下行有四个原因：
      LPR 多次下调、存量房贷利率批量调整、化债把高息城投资产置换成低息
      政府债、以及有效信贷需求不足导致银行之间内卷式竞价。负债端则是
      刚性的，居民风险偏好下降带来存款定期化和长期化，成本降不下来。
      政策对冲主要在负债端：存款利率市场化调整机制让挂牌利率跟随 10 年期
      国债和 1 年期 LPR 下调，同时整治手工补息、规范同业存款定价。我认为
      监管盯息差不是关心银行赚不赚钱，而是因为息差决定利润、利润决定内源
      资本补充、资本决定信贷投放能力，是信贷供给可持续性的问题。银行自身
      的出路是负债端压成本，加上提高中间业务收入占比，从"吃息差"转向
      "轻资本"。
    followups:
      - q: 存款利率市场化调整机制怎么运作？
        a: >-
          自律机制下，银行参考 10 年期国债收益率（代表债券市场利率）和
          1 年期 LPR（代表贷款市场利率）合理调整存款挂牌利率。它不是行政
          定价，而是自律加点约束，目的是让存款利率能跟随市场利率下行，
          缓解息差压力。
      - q: 手工补息为什么被禁？
        a: >-
          手工补息是银行在挂牌利率之外通过手工方式额外补贴大客户利息，
          实质是绕开自律上限的高息揽储，既抬高负债成本、又造成"存款空转"
          （企业低息贷款套高息存款）。整治后企业活期存款明显下降，M1 一度
          走低，这也是解读 M1 数据时必须提到的口径扰动。
    related: [LPR, 化债, 存款利率市场化调整机制]

  - id: capital_rules
    term: 资本新规（《商业银行资本管理办法》2024）
    aliases: [巴塞尔III最终版, 资本管理办法]
    category: 银行与保险
    era: 2023
    plan: 十四五末实施，十五五过渡期
    heat: 4
    institutions: [银行, 券商]
    source: 金融监管总局 2023年11月发布，2024年1月1日起施行，部分条款设过渡期
    definition: >-
      对标巴塞尔III最终方案的中国版资本监管规则，建立差异化资本监管体系，
      按规模和业务复杂度将银行划分为三档，分别适用不同的资本计量与
      信息披露要求。
    exam_points:
      - 三档划分：第一档（规模大或有跨境业务）适用全部规则；第二档适用
        简化规则；第三档（小型银行）大幅简化，减轻合规负担
      - 风险权重调整方向：对投资级公司、优质中小企业、个人住房抵押贷款
        （按 LTV 分档）风险权重下调；对次级债、部分同业资产、非标与
        资管产品（穿透不足时）权重上调
      - 资本充足率要求：核心一级 ≥5%、一级 ≥6%、总资本 ≥8%，
        加上储备资本 2.5%、逆周期资本、系统重要性附加资本
      - 影响：利好零售与优质对公，压制同业与非标；推动资管产品提高
        穿透透明度（否则按 1250% 权重）
      - TLAC：全球系统重要性银行（G-SIBs）的总损失吸收能力要求，
        我国五大行通过发行 TLAC 非资本债券补充
    interview_answer: >-
      资本新规是 2023 年 11 月发布、2024 年 1 月实施的《商业银行资本管理
      办法》，对标巴塞尔III最终方案。最大的变化是差异化监管：按规模和
      跨境业务把银行分成三档，第一档全套规则，第三档小银行大幅简化，
      避免"一刀切"增加中小行成本。风险权重上是有保有压：投资级公司、
      优质中小企业和低 LTV 的按揭权重下调，次级债、部分同业资产和穿透
      不足的资管产品权重上调，最极端是穿透不了的按 1250%。所以它的政策
      导向很清楚——鼓励做零售和优质实体，压制同业空转和不透明的嵌套。
      对资管行业的连带影响是必须提高底层穿透和信息披露，否则银行不敢买。
    related: [TLAC, 系统重要性银行, 净息差]

  - id: bank_aic
    term: 银行AIC股权投资试点
    aliases: [金融资产投资公司]
    category: 银行与保险
    era: 2024
    plan: 十四五末扩围，十五五常态化
    heat: 5
    institutions: [银行, 券商]
    source: >-
      AIC 2017年设立（五大行债转股子公司）；2024年9月金融监管总局扩大
      股权投资试点城市范围至 18 个城市，放宽表内资金投资比例与单只基金投资比例；
      2025年进一步扩容至更多城市并允许更多银行设立
    definition: >-
      金融资产投资公司（AIC）原为商业银行开展市场化债转股的子公司，
      现被赋予直接股权投资功能，成为银行体系参与科技企业股权融资的主渠道。
    why_hot: >-
      这是"银行怎么做科技金融"的标准答案，也是理解"耐心资本"从哪来的关键。
      银行与券商一级市场岗高频。
    exam_points:
      - 试点放宽的三条：扩大试点城市范围；表内资金投资比例由 4% 提高到 10%；
        单只私募基金投资比例由 20% 提高到 30%
      - 意义：银行以往只能提供债权，AIC 让银行体系的资金能以股权形式
        进入科技企业，形成"投贷联动"
      - 约束：资本占用高（股权投资风险权重高）、退出通道依赖 IPO 与并购、
        银行的风险文化与股权投资的高失败率不匹配
      - 与科创债、险资长期投资试点共同构成"耐心资本"三支柱
    interview_answer: >-
      AIC 就是金融资产投资公司，最早是 2017 年五大行为做市场化债转股设立的
      子公司。2024 年 9 月金融监管总局把它的股权投资试点扩围，试点城市扩大
      到 18 个，同时把表内资金投资比例从 4% 提到 10%、单只私募基金的投资
      比例从 20% 提到 30%，2025 年又进一步扩容。这件事的意义在于，银行
      过去只能给科技企业放贷款，但科技企业轻资产、高失败率，债权工具承担
      不了股权风险；AIC 让银行体系的资金能以股权形式进去，配合信贷形成
      投贷联动。挑战也很现实：股权投资资本占用高，退出依赖 IPO 和并购，
      而且银行的风控文化是"零容忍坏账"，跟股权投资"十个项目亏七个"的
      逻辑天然冲突，所以考核机制和尽职免责怎么设计是关键。
    related: [科创债, 五篇大文章, 耐心资本]

  - id: insurance_longterm
    term: 保险资金长期投资改革试点
    aliases: [险资入市, 偿二代二期]
    category: 银行与保险
    era: 2025
    plan: 十四五末—十五五
    heat: 4
    institutions: [银行, 券商, 公募]
    source: >-
      2023年10月调整保险公司偿付能力监管标准、下调部分权益资产风险因子；
      2025年金融监管总局扩大保险资金长期投资改革试点规模，
      支持保险机构设立私募证券投资基金投向二级市场
    definition: >-
      通过设立由保险机构发起的私募证券投资基金，以长周期考核方式投资
      A 股，缓解险资"负债长、考核短"的错配，并在会计上更多使用
      FVOCI 计量以平滑利润波动。
    exam_points:
      - 三重松绑：偿付能力（下调权益风险因子）、会计（放宽 FVOCI 选择、
        减少 FVTPL 对利润的冲击）、考核（三年以上长周期考核）
      - 典型载体：中国人寿与新华保险发起的私募基金（"鸿鹄基金"系列）
      - 险资配置痛点：利率下行导致再投资收益率下降、"利差损"风险，
        必须提高权益与另类资产占比
      - 相关概念：预定利率动态调整机制（与市场利率挂钩，下调预定利率
        以防范利差损）、报行合一（规范渠道费用）
    interview_answer: >-
      险资入市这几年推进的抓手是"三重松绑"。第一是偿付能力，2023 年下调了
      部分权益资产的风险因子，降低资本占用；第二是会计，新准则下大量权益
      资产计入 FVTPL 会让利润剧烈波动，所以放宽了 FVOCI 的选择，让长期
      持有的高股息资产波动不冲击当期利润，这也是这两年险资偏爱高股息的
      直接原因；第三是考核，改成三年以上长周期考核。落地形式是保险资金
      长期投资改革试点，由险企发起私募证券基金投二级市场，比如鸿鹄基金。
      根本驱动其实是负债端：利率下行让固收再投资收益率下降，如果预定利率
      不跟着降、权益占比不提上去，就会出现利差损，所以还配套了预定利率
      动态调整机制和报行合一。
    followups:
      - q: 什么是利差损？
        a: >-
          保险公司销售的长期保单承诺了预定利率（负债成本），如果投资端的
          实际收益率长期低于预定利率，就形成利差损。上世纪 90 年代高预定
          利率保单在利率下行后造成的巨额亏损是典型教训，所以现在建立了
          预定利率与市场利率挂钩的动态调整机制。
    related: [中长期资金入市, 高股息, 净息差]

  - id: personal_pension
    term: 个人养老金制度
    category: 银行与保险
    era: 2022
    plan: 十四五试点，十五五全国铺开
    heat: 4
    institutions: [银行, 公募, 券商]
    source: >-
      2022年11月36城试点；2024年12月15日起在全国范围全面实施，
      同时将国债、特定养老储蓄、指数基金纳入产品范围
    definition: >-
      我国养老第三支柱的账户制安排：个人自愿参加，每年缴费上限 12000 元，
      享受税收递延（EET 模式），资金封闭运行至退休。
    exam_points:
      - 三支柱：第一支柱基本养老保险（政府）、第二支柱企业年金/职业年金
        （单位）、第三支柱个人养老金（个人）
      - 缴费上限 12000 元/年；领取时按 3% 单独计税
      - 2024 年 12 月全面实施同时扩容产品：新增国债、特定养老储蓄、
        指数基金（此前为储蓄、理财、保险、基金四类）
      - 痛点："开户热、缴存冷、投资更冷"——税收激励对中低收入人群吸引力
        有限、产品同质化、投资者教育不足
      - 对机构的意义：银行拿账户（唯一开户入口在商业银行）、公募拿产品、
        保险拿长期年金，是财富管理最重要的长期入口
    interview_answer: >-
      个人养老金是第三支柱，2022 年 11 月在 36 个城市试点，2024 年 12 月 15 日
      起全国全面实施。规则是账户制、自愿参加、每年最高缴 12000 元，
      缴费时税前扣除、领取时按 3% 单独计税，属于 EET 模式。全面实施
      的同时还扩了产品范围，把国债、特定养老储蓄和指数基金纳进来。
      现在最大的问题是"开户热、缴存冷、投资更冷"，因为税收优惠对中低
      收入人群吸引力有限，而且产品同质化。对机构来讲这是必争之地：
      账户开在银行，所以银行掌握入口；公募提供指数基金和养老目标基金；
      保险提供长期年金。谁能把账户转化成长期配置，谁就拿到了财富管理
      最稳定的一块长钱。
    related: [中长期资金入市, 养老金融, 公募基金改革]

  - id: real_estate_finance
    term: 房地产金融新模式（白名单 / 保交房 / 收储）
    category: 银行与保险
    era: 2022
    plan: 十四五末—十五五
    heat: 4
    institutions: [银行, 券商]
    source: >-
      2022年"金融十六条"；2024年1月城市房地产融资协调机制（"白名单"）；
      2024年5月保障性住房再贷款（3000亿元）与降首付、取消利率下限；
      2024年9月存量房贷利率批量下调
    definition: >-
      从"三条红线"式的总量收缩，转向以项目为单位的融资协调机制
      （白名单）、以"保交房"为底线、以政府收储存量商品房用作保障房为
      去库存手段的一整套安排。
    exam_points:
      - “白名单”逻辑：从“救企业”转为“救项目”，以项目封闭运作、资金
        专款专用为前提，切断风险传染
      - 保障性住房再贷款：央行提供低成本资金，支持地方国企收购已建成
        存量商品房用作配售型或配租型保障房
      - 需求端：取消房贷利率下限、下调首付比例、存量房贷利率批量调整
        （减少提前还贷与"跳槽式"置换）
      - 银行影响：按揭规模与收益率下降（拖累息差）、开发贷风险缓释、
        涉房资产质量分化
      - 新提法："构建房地产发展新模式"——租购并举、"好房子"标准、
        现房销售试点、房地产税制改革
    interview_answer: >-
      房地产金融的思路在 2024 年之后有个明显转折：从救主体转向救项目。
      具体就是城市房地产融资协调机制，也就是"白名单"，以项目为单位、
      资金封闭运作、专款专用，底线目标是保交房，避免风险从个别房企传染
      到整个信用体系。去库存这边是保障性住房再贷款，央行给低成本资金，
      支持地方国企收购已建成的存量商品房转作保障房。需求端则是取消房贷
      利率下限、降首付，还有 2024 年 9 月的存量房贷利率批量下调，主要是
      为了抑制提前还贷。对银行来说这是双重压力：按揭规模和收益率都在降，
      直接拖累息差；但开发贷的尾部风险确实在缓释。更长期的方向是"房地产
      发展新模式"，租购并举、"好房子"标准和现房销售试点。
    related: [净息差, 保交楼, 结构性货币政策工具]

  - id: wealth_management
    term: 银行理财与净值化转型
    category: 银行与保险
    era: 2018
    plan: 十四五完成整改，十五五提质
    heat: 4
    institutions: [银行, 公募]
    source: 2018年资管新规；2021年底过渡期结束；2023—2026年理财规模波动与"存款搬家"
    definition: >-
      资管新规后银行理财全面打破刚兑、实行净值化管理，由理财公司
      （银行理财子）独立运作，产品以固收类为主。
    exam_points:
      - 资管新规四大要求：打破刚兑、净值化、去嵌套去通道、消除多层嵌套与期限错配
      - “存款搬家”：存款利率下调 → 居民资金流向理财与债基 → 理财规模上升，
        但也带来“债市波动 → 理财赎回 → 抛售 → 净值再跌”的负反馈
      - 2022 年底与 2023 年的两次"赎回潮"是必考案例
      - 整改重点：估值方法（收盘价估值、限制平滑机制与信托通道"调节净值"）、
        流动性管理、销售适当性
      - 与公募的竞争：理财偏低波固收，公募偏权益与指数；销售费用新规后
        两者在渠道端正面竞争
    interview_answer: >-
      银行理财在资管新规之后完成了净值化转型，核心是打破刚兑、独立估值、
      去嵌套。但净值化带来一个新的系统性问题：客户的风险偏好并没有跟着
      转变，他们买理财时的心理预期还是"类存款"，所以一旦债市调整、净值
      回撤，就会集中赎回，理财被迫抛售债券，导致净值进一步下跌，形成负
      反馈。2022 年底和 2023 年都发生过这样的赎回潮。监管这两年的整改
      重点就是估值真实性，限制用信托平滑机制或收盘价估值人为压低波动，
      同时强化流动性管理和销售适当性。往前看，理财和公募在渠道端会正面
      竞争，理财的优势是低波固收和客户基础，公募的优势是权益和指数工具。
    related: [资管新规, 净息差, 公募基金改革]
