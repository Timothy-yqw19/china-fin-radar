# 金融热词库 · 科技金融与数字金融
category: 科技金融与数字金融
terms:

  - id: digital_rmb
    term: 数字人民币（e-CNY）与国际运营中心
    category: 科技金融与数字金融
    era: 2020
    plan: 十四五试点，十五五拓展离岸场景
    heat: 5
    institutions: [银行, 券商]
    source: >-
      2019年末试点启动；2023年扩围至 26 地区；
      2025年数字人民币国际运营中心在上海设立；
      2026年6月国际运营中心与首批 26 家金融机构签署直接参与协议
    definition: >-
      由中国人民银行发行的法定数字货币，属于 M0 范畴，采用"央行—商业银行"
      双层运营体系，具备可控匿名、可编程（智能合约）、支持双离线支付等特征。
    why_hot: >-
      在稳定币全球热议的背景下，数字人民币是中国给出的"主权路径"答案；
      2026 年国际运营中心落地后，考点从"零售支付"转向"跨境与离岸应用"。
    exam_points:
      - 定位是 M0（现金替代），不计付利息，不构成对商业银行存款的直接竞争
        （但存在"存款搬家"的理论担忧）
      - 双层运营：央行→指定运营机构（商业银行）→公众，央行不直接对公众开户
      - 技术特征：可控匿名（小额匿名、大额可溯）、可编程性（定向补贴、
        专款专用、供应链账款自动清分）、双离线支付
      - 跨境方向：多边央行数字货币桥（mBridge）、数字人民币国际运营中心
        （上海，2026年6月首批 26 家直接参与者），推进离岸应用与场景拓展
      - 与稳定币的区别：数字人民币是央行负债、法偿性；稳定币是私人机构
        负债、靠储备资产维持锚定，存在挤兑与储备透明度风险
    interview_answer: >-
      数字人民币是央行发行的法定数字货币，定位在 M0，也就是替代现金，
      采用央行到商业银行再到公众的双层运营，央行不直接对公众开户。
      技术上有三个特点：可控匿名，小额匿名、大额可溯；可编程，能做定向
      补贴和资金专款专用；还支持双离线支付。2025 年到 2026 年最大的进展
      是从零售场景转向跨境和离岸——数字人民币国际运营中心在上海设立，
      2026 年 6 月和首批 26 家金融机构签了直接参与协议，配合多边央行数字
      货币桥推进跨境结算。跟稳定币比，最本质的区别是负债主体：数字人民币
      是央行负债、有法偿性，稳定币是私人机构负债，靠储备资产维持锚定，
      所以有挤兑和储备透明度的风险，这也是为什么各国监管的重心都在储备
      要求和赎回权上。
    followups:
      - q: 数字人民币会让商业银行存款流失吗？
        a: >-
          理论上有"金融脱媒"担忧，所以设计上做了限制：数字人民币不计息、
          钱包分级设限额、且通过商业银行兑换发行。正常时期替代的是现金和
          第三方支付余额；真正的风险场景是危机时期居民把存款集中换成
          央行负债，这也是各国 CBDC 设计中普遍设置持有上限的原因。
    related: [稳定币, CIPS, 人民币国际化]

  - id: stablecoin
    term: 稳定币与代币化（Tokenization）
    aliases: [Stablecoin, RWA, 现实世界资产代币化]
    category: 科技金融与数字金融
    era: 2025
    plan: 十五五新变量
    heat: 5
    institutions: [券商, 银行]
    source: >-
      美国 2025 年通过稳定币立法（GENIUS Act）；
      香港《稳定币条例》2025年8月1日生效，实行发牌制度；
      内地监管多次提示 RWA 代币化相关非法金融活动风险
    definition: >-
      稳定币是以法币或其他资产为储备、维持价格锚定的加密资产；
      RWA 指把债券、基金份额、应收账款、不动产等现实资产上链形成代币，
      以提高清算效率与可分割性。
    why_hot: >-
      2025—2026 年最热的"新名词"，但也是最容易踩雷的：要能同时讲清
      "技术价值"和"监管红线"，尤其内地对虚拟货币交易的禁止性规定没有改变。
    exam_points:
      - 三分法：法币抵押型（USDT/USDC）、加密资产抵押型（超额抵押）、
        算法稳定币（已被证伪，UST 崩盘）
      - 香港《稳定币条例》要点：法币稳定币发行人须持牌、储备资产 100%
        足额且高质量流动性、储备隔离与独立托管、按面值赎回权、
        反洗钱与信息披露要求
      - 内地立场：虚拟货币相关业务活动属非法金融活动（2021年十部委通知），
        居民炒币不受法律保护；监管多次警示以"RWA 代币化"为名的非法集资
      - 真正有价值的方向：受监管机构主导的代币化存款、代币化基金份额、
        债券的 DLT 发行与清算（如香港数码绿色债券）
      - 风险：储备透明度、挤兑、跨境监管套利、与传统金融的风险传染
    interview_answer: >-
      稳定币和 RWA 是这两年最热的新词，我会分两层讲。技术层面，代币化
      解决的是清算效率和资产可分割性问题，原子结算能把 T+2 压到接近实时，
      对跨境支付和债券清算确实有价值，香港已经发行过数码绿色债券。
      监管层面则完全不同：香港《稳定币条例》2025 年 8 月生效，实行发牌制，
      要求储备 100% 足额、高质量流动、独立托管，并保障按面值赎回；
      而内地的立场没有变，虚拟货币相关业务活动属于非法金融活动，
      监管还多次提示以"RWA 代币化"为名的非法集资风险。所以我的判断是，
      中国的路径是"内地以数字人民币为主、香港作为离岸试验场"，
      真正合规的方向是受监管机构主导的代币化存款和代币化基金份额，
      而不是零售端的稳定币炒作。
    followups:
      - q: 稳定币会不会冲击美债市场？
        a: >-
          主流法币稳定币的储备大量配置短期美国国债和回购，规模扩张时是
          短债的增量买家，赎回潮时则是集中卖家，理论上会放大短端波动。
          这也是各国立法要求储备资产限定为高流动性资产、并做期限限制的
          原因之一。
    related: [数字人民币, 人民币国际化, RWA]

  - id: data_element
    term: 数据要素与数据资产入表
    aliases: [数据二十条, 数据要素×]
    category: 科技金融与数字金融
    era: 2022
    plan: 十四五提出，十五五深化
    heat: 4
    institutions: [券商, 银行]
    source: >-
      2022年12月《关于构建数据基础制度更好发挥数据要素作用的意见》
      （"数据二十条"）；2023年8月财政部《企业数据资源相关会计处理暂行规定》，
      2024年1月1日起施行；2023年国家数据局成立
    definition: >-
      将数据确立为继土地、劳动力、资本、技术之后的第五大生产要素，
      建立数据产权、流通交易、收益分配、安全治理四项基础制度；
      符合条件的数据资源可确认为无形资产或存货计入资产负债表（"入表"）。
    exam_points:
      - “数据二十条”的“三权分置”：数据资源持有权、数据加工使用权、
        数据产品经营权，绕开了所有权难题
      - 数据资产入表：不是所有数据都能入表，需满足会计准则的资产定义
        （预期带来经济利益、成本可靠计量），主要计入无形资产或存货
      - 金融应用：数据资产质押融资、数据资产增信、征信与风控模型
      - 与个人信息保护法、数据安全法的边界；跨境数据流动的合规要求
    interview_answer: >-
      数据要素是 2022 年"数据二十条"确立的，把数据列为第五大生产要素。
      它最聪明的设计是"三权分置"——不去纠缠所有权归谁，而是拆成数据
      资源持有权、加工使用权和产品经营权，这样流通交易就能落地。
      2024 年 1 月起财政部的暂行规定施行，符合会计准则资产定义的数据
      资源可以确认为无形资产或存货，也就是"数据资产入表"。对金融的
      意义有两块：一是资产端，数据资产可以用于质押融资和增信，给
      轻资产的科技企业多一条路；二是能力端，数据是数字金融的底座，
      风控、定价、获客都依赖它。约束在于个人信息保护法和数据安全法
      划定的边界，以及跨境数据流动的合规要求。
    related: [数字金融, 新质生产力, 数字人民币]

  - id: ai_finance
    term: 人工智能+金融（大模型在金融的应用）
    aliases: ["人工智能+", AI Agent, 智能投研]
    category: 科技金融与数字金融
    era: 2024
    plan: 十五五主线
    heat: 5
    institutions: [券商, 公募, 银行]
    source: >-
      2024年、2025年、2026年政府工作报告持续部署"人工智能+"行动；
      金融监管部门对生成式 AI 在金融领域应用的合规指引
    definition: >-
      以大模型为核心的人工智能技术在投研、投顾、风控、合规、客服、
      运营等金融场景的落地，2025 年后从"辅助工具"走向"智能体（Agent）"。
    exam_points:
      - 落地成熟度排序：客服与运营（最成熟）→ 研报摘要与信息处理 →
        代码与量化因子挖掘 → 智能投顾与合规审查（受监管约束最强）
      - 监管约束：算法可解释性、投资建议的适当性责任、生成内容的准确性
        与幻觉风险、数据出境与客户信息保护
      - AI 不能替代的：投资决策的最终责任主体、尽职调查的实地核查、
        与监管沟通
      - 面试常见追问："你用 AI 做过什么"——要能说出具体流程与验证方法，
        而不是"我会用 ChatGPT"
    interview_answer: >-
      "人工智能+"从 2024 年起连续写进政府工作报告，金融是落地最快的行业
      之一。我会按成熟度排序看：最成熟的是客服和运营自动化，其次是研报
      摘要、公告解析这类信息处理，再往上是代码生成和量化因子挖掘，
      最难落地的是智能投顾和合规审查，因为涉及适当性责任和可解释性。
      监管的关注点很集中：算法能不能解释、生成内容的准确性和幻觉风险、
      投资建议的责任主体是谁、以及客户数据的保护和出境合规。我自己的
      理解是 AI 现在能大幅压缩信息处理成本，但不能替代责任主体——
      最终的投资决策、尽职调查的实地核查和与监管的沟通，还是人的工作。
      我做过的实践是用它做公告和政策文件的结构化抽取，再人工复核关键
      数字，效率提升明显，但一定要有校验环节。
    related: [数字金融, 数据要素, 新质生产力]

  - id: green_transition_finance
    term: 绿色金融与转型金融
    aliases: [碳减排支持工具, 转型金融目录, 碳市场]
    category: 科技金融与数字金融
    era: 2021
    plan: 十四五起步，十五五中期目标
    heat: 4
    institutions: [银行, 券商, 公募]
    source: >-
      2021年碳减排支持工具创设、全国碳排放权交易市场上线；
      2024年《绿色金融支持项目目录》更新；2025年全国碳市场扩容至钢铁、
      水泥、电解铝行业；转型金融标准分行业陆续出台
    definition: >-
      绿色金融支持"已经绿"的项目（清洁能源、节能环保）；
      转型金融支持"正在变绿"的高碳行业（钢铁、水泥、化工）低碳改造，
      解决绿色金融覆盖不到高排放存量的问题。
    exam_points:
      - 绿色 vs 转型：绿色金融的对象是纯绿项目，转型金融的对象是高碳
        行业的减排改造，后者更难标准化、更需要防"洗绿"
      - 工具：碳减排支持工具（央行按贷款本金一定比例提供低成本资金）、
        绿色债券、可持续发展挂钩债券（SLB）、绿色 ABS、转型债券
      - 碳市场：全国碳排放权交易市场（CEA）2021 年上线，2025 年扩容到
        钢铁、水泥、电解铝；CCER（国家核证自愿减排量）2024 年重启
      - 披露：ISSB 准则、我国《企业可持续披露准则——基本准则》
        （2024年发布，分步实施）
    interview_answer: >-
      绿色金融和转型金融要分开讲。绿色金融支持的是已经绿的项目，比如
      光伏、风电、节能环保，标准清晰、工具成熟，有绿色债券、绿色信贷和
      央行的碳减排支持工具。但纯绿项目只占经济的一小部分，排放主要来自
      钢铁、水泥、化工这些高碳存量行业，它们要减排就需要转型金融，
      对应可持续发展挂钩债券和转型债券。转型金融最大的难点是标准——
      怎么界定"真转型"而不是洗绿，所以现在是分行业出目录和标准。
      碳市场这边，全国碳排放权交易市场 2021 年上线，2025 年扩容到钢铁、
      水泥和电解铝，CCER 也在 2024 年重启，加上可持续披露准则的推进，
      整个体系正在从"有工具"走向"有价格、有披露"。
    related: [五篇大文章, ESG, 碳市场]
