category: 资本市场与证券行业
terms:

  - id: new_nine_measures
    term: 新"国九条"（2024）
    aliases: [《关于加强监管防范风险推动资本市场高质量发展的若干意见》]
    category: 资本市场与证券行业
    era: 2024
    plan: 十四五末，十五五执行
    heat: 5
    institutions: [券商, 公募]
    source: 2024年4月12日国务院印发（国发〔2024〕10号），资本市场第三个"国九条"
    definition: >-
      以"强监管、防风险、促高质量发展"为主线的资本市场纲领性文件，
      提出未来 5 年、2035 年、本世纪中叶三阶段目标，配套形成"1+N"政策体系。
    why_hot: 2024 年以来所有 A 股制度变化的母文件，券商投行/公募面试的框架题。
    exam_points:
      - 三个"国九条"时间线：2004（第一个）、2014（第二个）、2024（第三个）
      - “1+N”体系：1 = 新国九条；N = 发行上市、退市、分红、减持、程序化交易、
        市值管理、并购重组等一系列配套规则
      - 关键抓手：严把发行上市准入关、加大退市力度、强化上市公司现金分红监管、
        规范大股东减持、加强程序化交易监管、推动中长期资金入市
      - 强本强基、严监严管“：把投资者保护放在首位，从”重融资“转向”投融资平衡
    interview_answer: >-
      新"国九条"是 2024 年 4 月国务院印发的资本市场纲领性文件，也是历史上
      第三个国九条，前两个是 2004 年和 2014 年。它的主线是"强监管、防风险、
      推动高质量发展"，形成了"1+N"的政策体系——1 是国九条本身，N 是发行上市、
      退市、分红、减持、程序化交易、市值管理、并购重组这些配套规则。我理解
      它最本质的转变是从"重融资"转向"投融资平衡"：一端严把入口、加大退市，
      另一端强制分红、规范减持、引入中长期资金，本质是在修复市场的回报机制。
    followups:
      - q: 严退市会不会伤害中小投资者？
        a: >-
          所以配套了先行赔付、代表人诉讼（中国特色集体诉讼）、支持诉讼机制和
          "追首恶"的责任认定，把损失从"投资者自担"转向"违法者赔偿"。退市
          本身不该等于免责，这是回答的关键。
    related: [退市, 中长期资金入市, 市值管理, 并购六条]

  - id: long_term_capital
    term: 中长期资金入市
    aliases: [耐心资本, 长钱长投]
    category: 资本市场与证券行业
    era: 2024
    plan: 十四五末—十五五
    heat: 5
    institutions: [券商, 公募, 银行]
    source: >-
      2024年9月中央金融办、证监会《关于推动中长期资金入市的指导意见》；
      2025年1月六部委《关于推动中长期资金入市工作的实施方案》
    definition: >-
      推动商业保险资金、全国社保基金、基本养老保险基金、企业（职业）年金、
      公募基金等长期资金加大权益投资比例，并通过考核机制改革解决"长钱短考"问题。
    why_hot: 这是 A 股资金面最重要的中期变量，公募与券商研究岗必问。
    exam_points:
      - 核心痛点是"长钱短考"：资金期限长，但考核周期短（年度甚至季度），
        导致行为短期化
      - 关键机制改革：对国有保险公司经营绩效实施三年以上长周期考核，
        大幅降低当年度指标权重；全国社保基金、基本养老保险基金拉长考核周期
      - 量化要求（实施方案）：力争大型国有保险公司从 2025 年起每年新增保费的
        30% 用于投资 A 股；公募基金持有 A 股流通市值未来三年每年至少增长 10%
      - 配套：保险资金长期投资改革试点（设立私募证券基金投向二级市场）、
        个人养老金全面实施、第二支柱年金扩面
      - 常见错误：把"中长期资金"等同于"外资"或"国家队"，实际主要指
        险资、社保、年金、公募
    interview_answer: >-
      中长期资金入市有两份关键文件，2024 年 9 月的指导意见和 2025 年 1 月
      六部委的实施方案。它要解决的核心矛盾不是"钱不够"，而是"长钱短考"——
      保险和养老金的负债久期很长，但考核是按年甚至按季，逼得机构行为短期化。
      所以最关键的改革其实是考核端：对国有保险公司实行三年以上长周期考核，
      大幅降低当年度指标权重，社保和基本养老也拉长考核周期。量化目标上，
      实施方案提出大型国有险企从 2025 年起每年新增保费的 30% 投 A 股，
      公募持有 A 股流通市值未来三年每年至少增长 10%。再配上保险资金长期
      投资改革试点和个人养老金全面实施，形成"资金端 + 考核端 + 产品端"
      三管齐下。
    followups:
      - q: 险资为什么之前不愿意加仓权益？
        a: >-
          三重约束：新会计准则（IFRS9）下大量权益资产以 FVTPL 计量，波动
          直接冲击当期利润；偿付能力监管（偿二代二期）对权益资产的风险因子
          较高，占用资本；再叠加年度考核。所以政策同时在会计（放宽 OCI 选择）、
          偿付能力（下调部分权益风险因子）和考核（长周期）三端松绑。
    related: [个人养老金, 保险资金长期投资试点, 公募基金改革]

  - id: fund_reform_2025
    term: 公募基金高质量发展改革（浮动费率 / 投资者为本）
    aliases: [公募费率改革, 《推动公募基金高质量发展行动方案》]
    category: 资本市场与证券行业
    era: 2023
    plan: 十四五末—十五五
    heat: 5
    institutions: [公募, 券商, 银行]
    source: >-
      2023年7月费率改革启动（管理费/托管费下调）；2024年交易佣金改革；
      2025年5月证监会《推动公募基金高质量发展行动方案》；
      2026年1月1日《公开募集证券投资基金销售费用管理规定》施行
    definition: >-
      分三阶段推进的公募行业改革：先降管理费与托管费，再降交易佣金，
      最后降销售费用，并配套推行与业绩挂钩的浮动管理费率、强化基金经理
      长周期考核与利益绑定。
    why_hot: 公募岗必问；银行/券商代销岗也会问，因为销售费用新规直接改变渠道收入结构。
    exam_points:
      - 三阶段："降管理费（2023）→ 降交易佣金（2024）→ 降销售费用（2025-2026）"
      - 浮动费率：业绩比较基准跑赢/跑输决定管理费档位，把"规模导向"改为
        "回报导向"；首批浮动费率基金 2025 年发行
      - 考核改革：基金经理考核中三年以上中长期业绩权重不低于 80%；
        高管与基金经理跟投要求
      - 行业影响：管理费收入下降 → 头部集中、被动化（ETF）加速、渠道
        向买方投顾转型
      - 行动方案“的核心提法：建立以投资者最终回报为核心的行业文化，
        扭转”重规模、轻回报
    interview_answer: >-
      公募改革是三步走：2023 年降管理费和托管费，2024 年降交易佣金，
      2025 年到 2026 年降销售费用，《公开募集证券投资基金销售费用管理规定》
      2026 年 1 月 1 日起施行。但我觉得费率只是表象，内核是 2025 年 5 月
      《推动公募基金高质量发展行动方案》要解决的"规模导向"问题：推行
      与业绩基准挂钩的浮动管理费率，跑输基准就少收费；基金经理考核里
      三年以上中长期业绩权重不低于 80%；再加上跟投要求，把管理人和持有人
      的利益绑在一起。行业后果也很清楚——主动管理费率承压，资金加速流向
      ETF，渠道从"卖产品赚佣金"被迫转向买方投顾按保有量收费。
    followups:
      - q: 浮动费率会不会让基金经理更激进？
        a: >-
          有这个担心，所以设计上通常是"对称浮动"而不是"只上不下"，并且
          挂钩的是业绩比较基准而非绝对收益，再配合三年以上考核和跟投，
          目的是抑制为了短期超额而过度偏离基准的行为。真正的风险点在于
          基准选择是否合理，如果基准过于宽松，浮动费率就失去约束意义。
      - q: 销售费用新规对银行代销有什么冲击？
        a: >-
          认申购费与尾随佣金受限、上限收紧，渠道从"首发冲量"模式转向
          "保有量 + 投顾服务费"模式，倒逼银行财富管理做真正的资产配置和
          陪伴服务，短期收入承压，长期利好客户留存。
    related: [ETF, 买方投顾, 中长期资金入市]

  - id: etf_passive
    term: ETF 与被动化浪潮
    aliases: [指数基金, 中证A500, 宽基ETF]
    category: 资本市场与证券行业
    era: 2023
    plan: 十四五末爆发，十五五主流化
    heat: 5
    institutions: [公募, 券商]
    source: 2024年中央汇金增持宽基ETF；2024年9月中证A500指数发布；证监会多次表态大力发展指数化投资
    definition: >-
      交易型开放式指数基金。2023 年以来 A 股被动指数基金规模快速扩张，
      2024 年首次出现被动指数基金持股规模超过主动权益基金的转折。
    why_hot: 公募最重要的产品趋势；也是"平准基金"讨论的载体。
    exam_points:
      - 驱动因素：主动超额难做（市场有效性提升 + 全面注册制后个股分化）、
        费率优势、汇金等中长期资金偏好宽基工具、渠道降费后配置化销售
      - 标志性事件：2024 年中央汇金明确增持并扩大 ETF 增持范围，市场称
        "类平准基金"操作；中证 A500 指数成为新一代核心宽基
      - 结构：宽基 ETF（沪深300、中证500、中证A500、科创50）、行业主题 ETF、
        Smart Beta（红利、自由现金流）、跨境 ETF（受 QDII 额度约束）
      - 对券商的影响：ETF 做市、券结模式、融券券源、财富管理配置工具
      - 风险讨论：指数集中度、成分股定价效率下降、赎回踩踏与流动性错配
    interview_answer: >-
      ETF 这两年是公募最确定的趋势，2024 年被动指数基金的持股规模第一次
      超过主动权益。原因有三条：一是全面注册制之后个股分化加剧、主动超额
      越来越难做；二是费率改革之后被动的成本优势被放大；三是中央汇金这类
      中长期资金增持时首选宽基 ETF，直接带来了增量。产品线上，宽基有沪深300、
      中证500、科创50，还有 2024 年 9 月发布的中证 A500 成为新一代核心宽基；
      另外红利和自由现金流这类 Smart Beta 也很火。对券商来说，机会在做市、
      券结、融券券源和财富管理配置。风险是要注意被动化过头会削弱个股的
      定价效率，以及极端行情下的赎回流动性问题。
    related: [公募基金改革, 中长期资金入市, QDII]

  - id: ma_six
    term: “并购六条”与并购重组新周期
    aliases: [《关于深化上市公司并购重组市场改革的意见》]
    category: 资本市场与证券行业
    era: 2024
    plan: 十四五末—十五五
    heat: 5
    institutions: [券商]
    source: 2024年9月24日证监会发布"并购六条"；配套修订《上市公司重大资产重组管理办法》（2025年）
    definition: >-
      支持上市公司围绕新质生产力方向开展并购重组，提高对未盈利资产、
      跨行业并购的包容度，简化审核程序（简易审核、分期支付），
      推动产业整合与"两创板块"并购。
    why_hot: IPO 阶段性收紧后，并购成为投行最主要的业务增量，投行岗必问。
    exam_points:
      - 六条要点：助力新质生产力、加大产业整合支持、提升监管包容度、
        提高支付灵活性和审核效率、提升中介机构服务水平、依法加强监管
      - 支付工具：定向可转债、分期支付、股份对价；"重组小额快速审核"、
        "简易审核程序"
      - 与"跨界并购"的边界：支持产业逻辑清晰的转型，严打"忽悠式重组"
        和炒壳
      - 2025—2026 年方向：产业并购市场活跃、S 基金与并购基金退出、
        "注销式回购"常态化
    interview_answer: >-
      并购六条是 2024 年 9 月证监会发布的，背景是 IPO 阶段性收紧后，
      一级市场的退出通道需要新的出口。它的六条里我认为最实质的是三点：
      提高对未盈利资产和跨行业并购的包容度，让硬科技资产有机会证券化；
      丰富支付工具，定向可转债、分期支付降低了现金压力；简化审核，
      推出简易审核和小额快速通道。配套还修订了重大资产重组管理办法。
      对投行来说，业务重心从承做 IPO 转向产业并购的方案设计、估值与
      对赌安排，能力要求其实更高了。同时监管的红线也很清楚，支持有产业
      逻辑的整合，严打忽悠式重组和炒壳。
    related: [新国九条, 科创板改革, 新质生产力]

  - id: star_market_reform
    term: 科创板改革（"1+6"、科创成长层）
    category: 资本市场与证券行业
    era: 2024
    plan: 十四五末—十五五
    heat: 5
    institutions: [券商, 公募]
    source: >-
      2024年6月"科创板八条"；2025年6月陆家嘴论坛宣布科创板改革"1+6"政策，
      设置科创成长层、重启未盈利企业第五套标准适用等
    definition: >-
      围绕提高科创板对硬科技企业包容度的一揽子改革，包括设立"科创成长层"
      集中管理未盈利科技型企业，试点 IPO 预先审阅机制、资深专业机构投资者
      制度、扩大第五套上市标准适用范围等。
    exam_points:
      - 科创板八条（2024.06）：强化“硬科技”定位、更大力度支持并购重组、
        完善股权激励、丰富做市与融券
      - 1+6（2025.06）：1 = 设置科创成长层；6 = 对优质科技企业试点 IPO
        预先审阅机制、扩大第五套标准适用行业、引入资深专业机构投资者制度、
        面向未盈利企业推出预先审阅、完善再融资与并购安排等
      - 第五套上市标准：允许未盈利但技术领先、市场空间大的企业上市，
        原以生物医药为主，改革后扩大到人工智能、商业航天、低空经济等
      - 投资者适当性：科创成长层企业设置特别标识（"U"标）与风险揭示
    interview_answer: >-
      科创板这轮改革分两步：2024 年 6 月的"科创板八条"，强化硬科技定位、
      支持并购重组和股权激励；2025 年 6 月陆家嘴论坛推出"1+6"，"1"是
      设置科创成长层，把未盈利的科技型企业集中管理、加特别标识和风险揭示，
      "6"里面我觉得最重要的是重启并扩大第五套上市标准的适用范围，从
      过去主要是生物医药，扩展到人工智能、商业航天、低空经济这些方向，
      同时试点 IPO 预先审阅机制和资深专业机构投资者制度。逻辑很清楚：
      硬科技企业在盈利之前最需要资本，如果非要等到盈利才让上市，资本市场
      就没有起到支持新质生产力的作用。
    related: [新质生产力, 并购六条, 注册制]

  - id: market_value_mgmt
    term: 市值管理与"注销式回购"
    category: 资本市场与证券行业
    era: 2024
    plan: 十四五末—十五五
    heat: 4
    institutions: [券商, 公募]
    source: >-
      2024年11月证监会《上市公司监管指引第10号——市值管理》；
      2024年10月股票回购增持再贷款创设
    definition: >-
      要求上市公司以提升公司质量为基础，通过并购重组、股权激励、现金分红、
      投资者关系管理、信息披露、股份回购等方式提升投资价值；
      对长期破净公司要求制定估值提升计划。
    exam_points:
      - 市值管理 ≠ 股价操纵：指引明确禁止以市值管理名义操纵股价、内幕交易
      - 主要指数成分股公司应制定市值管理制度；长期破净公司应披露估值提升计划
      - “注销式回购”：回购后注销股份，直接减少总股本、提升 EPS，比
        “回购用于股权激励”对股东回报更实在
      - 股票回购增持再贷款：央行 2024 年 10 月创设，向银行提供低成本资金，
        银行再贷款给上市公司及主要股东用于回购增持
    interview_answer: >-
      市值管理在 2024 年 11 月有了正式规则，就是证监会的监管指引第 10 号。
      它把市值管理定义为通过提升公司质量来提升投资价值，明确列举了并购重组、
      股权激励、现金分红、回购这些合法方式，同时划红线禁止以市值管理为名
      操纵股价。两个抓手值得注意：一是要求主要指数成分股公司建立市值管理
      制度，长期破净的公司要披露估值提升计划，这直接对应银行、地产这些
      破净板块的估值修复逻辑；二是回购形式上鼓励"注销式回购"，因为回购后
      注销才真正减少股本、提升每股收益，而回购留作股权激励其实是把利益
      转移给了员工。资金上还有央行的股票回购增持再贷款配套。
    related: [新国九条, 结构性货币政策工具, 破净]

  - id: sci_tech_bond
    term: 科创债与债券市场"科技板"
    aliases: [科技创新债券, 科技创新公司债]
    category: 资本市场与证券行业
    era: 2022
    plan: 十四五试点，十五五制度化
    heat: 5
    institutions: [券商, 银行]
    source: >-
      2022年科创票据/科技创新公司债推出；2025年5月人民银行、证监会推出
      科技创新债券，支持金融机构、科技型企业、股权投资机构三类主体发行；
      央行"十五五"规划提出建设债券市场"科技板"
    definition: >-
      面向科技创新领域的专项债券品种，允许股权投资机构（VC/PE）发债募资
      投向科创企业，并配套风险分担工具（如央行提供低成本资金支持、
      信用增进机构提供担保）。
    why_hot: >-
      它把"债权工具支持股权投资"这个长期难题打开了，是科技金融最核心的
      制度创新，固收与投行岗高频。
    exam_points:
      - 三类发行主体：金融机构、科技型企业、股权投资机构（这是最大突破）
      - 风险分担：人民银行提供低成本再贷款资金支持、地方政府与担保机构
        参与增信，缓解"高风险资产、低票息定价"的矛盾
      - “科技板”：在债券市场设立专门板块，配套差异化的发行、信息披露、
        投资者适当性与做市安排
      - 难点：科技企业信用资质与债券投资者风险偏好错配，需要分层与增信
    interview_answer: >-
      科创债最大的突破是 2025 年 5 月人民银行和证监会推出的科技创新债券，
      它第一次把股权投资机构，也就是 VC 和 PE，纳入了发行主体，加上金融
      机构和科技型企业，形成三类主体。为什么这是突破？因为科技创新的资金
      需求本质上是股权属性——高失败率、长周期、看期权价值，而债券是固定
      收益、要求还本付息，两者天然错配。解决办法就是风险分担：央行提供
      低成本资金，地方政府和担保机构增信，把票息压下来、把尾部风险兜住。
      央行"十五五"规划进一步提出建设债券市场"科技板"，配套差异化的发行、
      披露和做市安排。这块对投行是新的项目来源，对固收是新的资产类别。
    related: [五篇大文章, 银行AIC, 新质生产力]

  - id: reits
    term: 公募REITs
    category: 资本市场与证券行业
    era: 2020
    plan: 十四五试点，十五五常态化
    heat: 4
    institutions: [券商, 公募]
    source: 2020年4月试点启动；2021年6月首批上市；2023年扩至消费基础设施；2024年起常态化发行
    definition: >-
      以基础设施项目未来现金流为支撑、公开募集并上市交易的封闭式基金，
      采用"公募基金 + ABS + 项目公司"的结构。
    exam_points:
      - 底层资产范围：产业园区、仓储物流、高速公路、生态环保、清洁能源、
        保障性租赁住房、消费基础设施（购物中心）、水利、文旅
      - 收益结构：强制分红（可供分配金额的 90% 以上），兼具债性（分派率）
        与股性（资产增值）
      - 意义：盘活存量资产、降低地方政府与企业杠杆、为长期资金提供
        类固收资产
      - 定价核心：可供分配现金流、分派率（Distribution Yield）、
        底层资产运营能力、扩募能力
      - 常见混淆：公募 REITs ≠ 房地产投资信托（住宅），我国不含商品住宅
    interview_answer: >-
      公募 REITs 是 2020 年试点、2021 年首批上市，现在已经常态化发行。
      结构上是"公募基金 + ABS + 项目公司"三层，因为我国基金法不允许公募
      基金直接持有股权，所以要通过 ABS 穿透。底层资产从最初的产业园、
      仓储物流、高速公路，扩展到清洁能源、保障性租赁住房和消费基础设施。
      它的价值在两端：发起人这边盘活存量资产、回收资金降杠杆；投资者这边
      得到一个强制分红、兼具债性和股性的资产类别，正好补上长期资金的
      配置缺口。定价上核心看可供分配现金流和分派率，以及运营方的管理能力
      和后续扩募空间。要注意我国的 REITs 不含商品住宅，和美国的 REITs
      不完全一样。
    related: [中长期资金入市, 基础设施]

  - id: registration_system
    term: 全面注册制
    category: 资本市场与证券行业
    era: 2023
    plan: 十四五完成，十五五深化
    heat: 4
    institutions: [券商]
    source: 2019年科创板试点；2023年2月17日全面实行股票发行注册制
    definition: >-
      以信息披露为核心的发行制度，交易所负责审核、证监会负责注册，
      把"能不能上"的判断权交给市场，把监管重心从事前审批转向事中事后。
    exam_points:
      - 注册制 ≠ 不审：交易所仍要问询审核，只是审核重心从"实质判断投资价值"
        转为"信息披露充分、真实、准确、完整"
      - 配套三件套：严格退市、严厉打击欺诈发行、投资者保护（代表人诉讼、
        先行赔付）
      - 2024 年后的调整：阶段性收紧 IPO 节奏、提高上市门槛（主板与创业板
        财务指标上调），体现"逆周期调节"
      - 与并购重组的联动：IPO 收紧 → 并购退出承接
    interview_answer: >-
      全面注册制是 2023 年 2 月落地的，核心是以信息披露为中心，交易所审核、
      证监会注册。它经常被误解为"不审了"，其实交易所的问询审核依然很严，
      只是审核的重心从判断企业有没有投资价值，转为判断披露是否充分真实。
      注册制能跑得起来，靠的是三个配套：严格退市、严打欺诈发行、投资者
      保护机制。2024 年之后又出现了新变化，就是阶段性收紧 IPO 节奏、
      上调主板和创业板的财务门槛，这是逆周期调节，把一级市场的融资压力
      转移到并购重组这条路径上，也解释了为什么并购六条在同一时期出台。
    related: [新国九条, 并购六条, 退市]
