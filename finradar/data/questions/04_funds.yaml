# 题目 schema 见 docs/GLOSSARY_SCHEMA.md（字段含义 / 必备项 / 校验规则）
board: 公募基金与资产管理
questions:

  - id: fund-001
    qtype: short
    difficulty: 1
    institutions: [公募, 券商, 银行]
    tags: [公募改革, 费率]
    question: 请梳理公募基金费率改革的三个阶段，以及2025年《推动公募基金高质量发展行动方案》的核心。
    exam_point: 三阶段时间线 + 浮动费率 + 考核改革，不能只答"降费"
    answer: >-
      三阶段：（1）2023年7月起降管理费与托管费（主动权益管理费率
      上限降至1.2%、托管费0.2%）；（2）2024年起交易佣金改革，
      降低佣金费率、规范佣金分配与转移支付；（3）2025—2026年降销售
      费用，《公开募集证券投资基金销售费用管理规定》自2026年1月1日起
      施行。
      2025年5月证监会《推动公募基金高质量发展行动方案》的核心不是
      降费，而是改变激励导向：推行与业绩比较基准挂钩的浮动管理费率
      （跑输基准少收费）；要求基金经理考核中三年以上中长期业绩权重
      不低于80%；强化高管与基金经理跟投；建立以投资者最终回报为核心的
      行业文化，扭转"重规模、轻回报"。
      行业后果：主动管理费收入承压，加速被动化（ETF）与头部集中，
      渠道从"首发冲量赚佣金"转向"保有量 + 买方投顾服务费"。
    spoken: >-
      三步走：2023年降管理费和托管费，2024年降交易佣金，2025到2026年
      降销售费用，销售费用新规2026年1月1日施行。但费率只是表象，
      内核是2025年5月的行动方案要改激励导向：推行跟业绩基准挂钩的
      浮动费率，跑输就少收；基金经理考核里三年以上业绩权重不低于80%；
      再加上跟投要求，把管理人和持有人绑在一起。结果是主动管理费收入
      承压，钱加速流向ETF，渠道也被迫从首发冲量转向按保有量和投顾
      服务收费。
    followups:
      - q: 浮动费率的关键设计难点是什么？
        a: 业绩比较基准的选择。基准过松，浮动费率就失去约束意义；基准过严或与策略不匹配，会逼基金经理为了不跑输而过度贴近基准、丧失主动性。同时要设计成对称浮动而非"只上不下"。

  - id: fund-002
    qtype: short
    difficulty: 2
    institutions: [公募, 银行]
    tags: [QDII, 额度, 溢价]
    question: QDII 基金为什么会出现场内高溢价？这属于什么风险？
    exam_point: 额度是机构额度不是产品额度；套利通道被堵导致溢价持续
    answer: >-
      QDII 额度由国家外汇管理局按机构逐笔核准（以美元计），是机构
      总额度而非单只产品额度。当机构总额度用满，旗下 QDII 基金只能
      限购或暂停申购；场内 LOF 份额无法通过申购新增，供不应求，
      二级市场价格高于净值形成溢价。
      这属于制度性风险而非单纯的情绪风险：正常情况下"场外申购—场内
      卖出"的套利可以消除溢价，但溢价恰恰发生在申购受限时，套利通道
      被堵，因此溢价可以长期存在。投资者若高溢价买入，一旦额度放开、
      溢价回归，会在净值之外承受额外损失。
      数据参考：截至2026年6月末，QDII 累计批准额度1761.69亿美元，
      较2025年末增加约53亿美元，其中证券基金类972.80亿美元；
      2026年7月外汇局表态"稳妥有序、常态化发放"并向公募产品倾斜。
    spoken: >-
      因为QDII额度是外汇局按机构核准的总额度，不是给单只产品的。
      机构总额度用满，旗下的QDII基金就得限购甚至暂停申购，场内LOF
      份额没法通过申购新增，供不应求就出现溢价。这是制度性风险
      不是情绪：正常情况下场外申购、场内卖出可以套利抹平溢价，
      但溢价恰恰发生在申购被限的时候，套利通道是堵死的，所以溢价
      能长期存在。客户高溢价买进去，一旦额度放开、溢价回归，会在
      净值之外多亏一块。所以销售端一定要做风险提示。
    followups:
      - q: 额度发放节奏由什么决定？
        a: 除机构自身的管理能力和产品认可度外，还带有外汇管理的逆周期属性——人民币汇率与国际收支承压时发放趋缓，压力缓解时扩容。这是理解额度节奏的隐藏线索。

  - id: fund-003
    qtype: multi
    difficulty: 2
    institutions: [公募, 银行, 券商]
    tags: [个人养老金, 三支柱]
    question: 关于我国个人养老金制度，下列表述正确的有？
    options:
      - A. 属于养老第三支柱，实行个人账户制、自愿参加
      - B. 每年缴费上限为12000元，领取时按3%单独计税
      - C. 2024年12月15日起在全国范围全面实施
      - D. 可投产品仅限储蓄存款、理财产品、商业养老保险和公募基金四类
    correct: [A, B, C]
    exam_point: 三支柱结构 + 全面实施时点 + 产品扩容（新增国债、特定养老储蓄、指数基金）
    answer: >-
      A、B、C正确。D错误：2024年12月全面实施的同时扩大了产品范围，
      在原有储蓄存款、理财产品、商业养老保险、公募基金四类基础上，
      新增国债、特定养老储蓄和指数基金。
      三支柱：第一支柱基本养老保险（政府主导）、第二支柱企业年金与
      职业年金（单位主导）、第三支柱个人养老金（个人主导）。
      当前痛点是"开户热、缴存冷、投资更冷"：税收激励对中低收入群体
      吸引力有限，产品同质化，投资者教育不足。
    spoken: >-
      前三项对。D是错的，2024年12月全面实施的同时把产品范围扩了，
      在储蓄、理财、保险、基金四类之外新增了国债、特定养老储蓄和
      指数基金。规则是账户制、自愿参加、每年最多缴12000元，缴费时
      税前扣除、领取时按3%单独计税，属于EET。现在最大的问题是
      "开户热、缴存冷、投资更冷"，税优对中低收入吸引力有限。
      对机构来说这是必争之地：账户开在银行，公募提供指数和养老目标
      基金，保险提供长期年金。

  - id: fund-004
    qtype: short
    difficulty: 2
    institutions: [公募, 银行]
    tags: [FOF, 目标日期]
    question: 养老目标基金分哪两类？目标日期基金的"下滑轨道"是什么？
    exam_point: 目标日期 vs 目标风险；glide path 的原理
    answer: >-
      两类：目标日期基金（TDF）与目标风险基金（TRF）。
      目标日期基金以投资者预计退休年份命名（如"2045"），随着目标
      日期临近，权益仓位按预设路径逐步下降、固收仓位上升，这条
      路径即"下滑轨道"（glide path）。原理是人力资本理论：年轻时
      未来劳动收入（类债券资产）占总财富比重高，可承受更高权益
      暴露；临近退休时人力资本耗尽、且没有时间修复回撤，因此
      降低权益。
      目标风险基金则固定风险等级（保守/稳健/平衡/积极），
      权益中枢不随年龄变化，由投资者自行选择并在需要时切换。
      两者都以 FOF 形式运作，且我国养老目标基金要求采用 FOF 形式、
      设置最短持有期（1年/3年/5年）。
    spoken: >-
      分目标日期和目标风险两类。目标日期基金按预计退休年份命名，
      比如2045，随着日期临近，权益仓位沿着预设的下滑轨道逐步降低。
      背后的原理是人力资本理论：年轻的时候未来劳动收入占总财富的
      比重高，它类似债券，所以可以承受更高的权益暴露；临近退休
      人力资本耗尽，而且没有时间修复回撤，所以要降权益。目标风险
      基金是固定风险等级，权益中枢不随年龄变，由客户自己选。
      两类在我国都要求采用FOF形式，并设置一年、三年或五年的最短
      持有期。
    followups:
      - q: 为什么要设最短持有期？
        a: 一是匹配养老资金的长期属性、抑制追涨杀跌；二是给管理人稳定的负债端，从而能配置流动性较低但预期回报更好的资产。代价是牺牲流动性，所以适当性要求更高。

  - id: fund-005
    qtype: short
    difficulty: 3
    institutions: [公募, 券商]
    tags: [业绩归因, 基金评价]
    question: 你怎么评价一只主动权益基金？只看收益率有什么问题？
    exam_point: 风险调整后收益、归因、持仓一致性、规模效应、经理稳定性
    answer: >-
      单看收益率的问题：无法区分运气与能力、无法区分beta与alpha、
      忽略承担的风险、且受起止时点影响极大（幸存者偏差与区间选择偏差）。
      评价框架：
      （1）风险调整后收益——夏普比率、索提诺比率、卡玛比率
      （年化收益/最大回撤）、信息比率（相对基准的超额/跟踪误差）。
      （2）归因——Brinson 拆解配置与选股贡献；多因子归因看超额来自
      规模、价值、动量等风格暴露还是真alpha。
      （3）持仓一致性——季报持仓与宣称策略是否一致，是否存在风格漂移；
      换手率是否与策略自洽。
      （4）规模效应——规模快速增长后策略容量是否被突破（小盘策略尤其明显）。
      （5）人的因素——基金经理任职年限、是否变更、投研团队稳定性、
      跟投情况。
      （6）业绩比较基准的合理性——费率改革后基准直接影响费用，
      基准是否与实际策略匹配变得更重要。
    spoken: >-
      只看收益率有三个问题：分不清运气和能力、分不清beta和alpha、
      而且区间一换结论就变。我的框架是六层：先看风险调整后收益，
      夏普、卡玛、信息比率；再做归因，用Brinson拆配置和选股，
      用多因子看超额是风格暴露还是真alpha；然后看持仓一致性，
      季报持仓和宣称策略是不是一回事、有没有风格漂移；接着看规模，
      规模暴增之后策略容量有没有被突破，小盘策略尤其敏感；再看人，
      经理任职年限、有没有变更、有没有跟投；最后看业绩比较基准合不
      合理，因为费率改革后基准直接决定费用，基准的匹配度比以前重要
      得多。

  - id: fund-006
    qtype: short
    difficulty: 2
    institutions: [公募, 银行]
    tags: [资管新规, 净值化]
    question: 资管新规的核心要求是什么？银行理财净值化之后带来了什么新问题？
    exam_point: 四大要求；净值化与客户预期错配导致的赎回负反馈
    answer: >-
      资管新规（2018年《关于规范金融机构资产管理业务的指导意见》）
      四大核心：打破刚性兑付、实行净值化管理、消除多层嵌套与通道业务、
      规范资金池与期限错配。过渡期于2021年底结束。
      新问题：产品波动真实化了，但客户风险认知仍停留在"类存款"。
      债市调整时净值回撤 → 集中赎回 → 理财抛售债券 → 收益率上行、
      净值再跌 → 更多赎回，形成负反馈螺旋（2022年11—12月是典型）。
      监管应对：整改估值方法（限制信托平滑机制、收盘价估值等人为
      压低波动的做法）、强化流动性管理与开放频率匹配、压实销售
      适当性、推动产品体系分层。
      对行业的深层影响：理财与公募在渠道端正面竞争，理财优势在低波
      固收与客户基础，公募优势在权益与指数工具。
    spoken: >-
      资管新规四条：打破刚兑、净值化、去嵌套去通道、规范资金池和
      期限错配，过渡期2021年底结束。净值化之后出现的新问题是客户
      预期没跟上：产品波动是真实的了，但客户还当类存款买，所以
      债市一调整就集中赎回，理财被迫抛债，收益率上行、净值再跌，
      形成螺旋，2022年底那轮最典型。监管的应对是整改估值方法，
      不许用信托平滑或收盘价估值人为压波动，同时强化流动性管理和
      销售适当性。

  - id: fund-007
    qtype: short
    difficulty: 2
    institutions: [公募, 券商, 银行]
    tags: [买方投顾, 财富管理]
    question: 什么是买方投顾？它和传统基金销售的根本区别在哪？为什么现在被反复提起？
    exam_point: 收费模式决定利益方向；销售费用新规的倒逼
    answer: >-
      买方投顾（基金投顾）是持牌机构接受客户委托，代客户做账户配置
      与调仓，按客户资产保有规模收取服务费。
      根本区别在收费模式决定利益方向：传统代销按申购费与尾随佣金
      收费，收入与交易频次、首发规模挂钩，天然激励"赎旧买新"和
      追热点；买方投顾按保有规模收费，收入与客户资产的长期增值
      挂钩，激励方向与客户一致。
      为什么现在热：（1）费率改革压缩了代销的传统收入，销售费用
      新规限制认申购费与尾随佣金，渠道被迫转型；（2）产品数量已
      超过一万只，选择成本极高，客户真正需要的是配置而非产品；
      （3）监管明确"以投资者最终回报为核心"的行业导向。
      难点：客户付费意愿、投顾人员的专业与合规能力、以及"基金赚钱
      基民不赚钱"背后的行为偏差矫正。
    spoken: >-
      买方投顾是持牌机构受客户委托做账户配置和调仓，按保有规模收费。
      和传统代销最根本的区别是收费模式决定利益方向：代销按申购费和
      尾随佣金收，收入跟交易频次和首发规模挂钩，天然激励赎旧买新、
      追热点；买方投顾按保有规模收，只有客户资产长期增长自己才赚
      得多，利益方向和客户一致。现在被反复提，一是费率改革把代销的
      老收入压没了，销售费用新规限制申购费和尾佣，渠道不转型不行；
      二是产品已经上万只，客户真正缺的是配置不是产品。难点在于客户
      的付费意愿和投顾人员的专业能力。

  - id: fund-008
    qtype: case
    difficulty: 3
    institutions: [公募, 银行]
    tags: [客户沟通, 适当性]
    question: >-
      一位客户去年买的债券型理财今年出现3%回撤，情绪激动地要求赎回
      并投诉。作为客户经理，你怎么处理？
    exam_point: 考察合规意识与沟通能力，不是考话术；先合规、再共情、后专业
    answer: >-
      处理顺序：
      （1）先确认合规底线——不承诺保本保收益、不做误导性陈述、
      不阻挠客户行使赎回权。客户有权赎回，我不能用话术阻止。
      （2）共情与信息澄清——先听完诉求，确认客户对产品的理解：
      购买时的风险等级评估、产品说明书中的风险揭示与历史波动区间
      是否被充分告知。如果销售环节存在适当性瑕疵（风险等级不匹配、
      未做双录、未充分揭示），应主动上报合规而不是掩盖。
      （3）专业解释——说明净值化产品的波动来源（债市收益率上行导致
      持仓估值下跌），区分"净值波动"与"实质损失"，说明持有期与
      回撤修复的历史规律，但明确不作收益承诺。
      （4）给出选项而非结论——赎回、部分赎回、转换为更低波动产品
      （现金管理类），由客户决定，并做好记录。
      （5）事后复盘——回看这位客户的风险测评是否真实反映其承受能力，
      调整后续配置建议。
      核心原则：合规是底线，共情是入口，专业是价值，选择权在客户。
    spoken: >-
      我会分四步。第一，先守住合规底线：不承诺保本保收益、不做
      误导性陈述、更不能用话术阻止客户赎回，客户有权赎回。第二，
      先听再说，确认他当初买的时候风险测评和风险揭示是不是做到位了，
      如果销售环节确实有适当性瑕疵，我会主动上报合规而不是掩盖。
      第三，做专业解释，说明净值下跌来自债市收益率上行导致的持仓
      估值变化，区分净值波动和实质损失，讲清历史上的回撤修复规律，
      但明确不承诺收益。第四，给选项不给结论：全部赎回、部分赎回、
      还是转成现金管理类降低波动，由客户自己决定，并且做好记录。
      事后我会复盘他的风险测评是不是真实反映了承受能力，调整后续
      的配置建议。我的原则是合规是底线、共情是入口、专业是价值，
      但选择权永远在客户手里。
    followups:
      - q: 如果客户说"当时你没告诉我会亏"，怎么办？
        a: 立即调取销售留痕（风险测评、双录、签署的风险揭示书）核实事实。如果留痕完备，向客户复述当时的揭示内容并致歉于沟通不足；如果确有瑕疵，按流程上报合规与消保部门处理，不自行承诺赔付。

  - id: fund-009
    qtype: short
    difficulty: 2
    institutions: [公募, 券商]
    tags: [REITs, 不动产]
    question: 公募 REITs 是什么？它和股票、债券有什么不同？机构投资者主要看什么指标？
    exam_point: 强制分红与现金流分配机制；底层资产类型与估值方法；与股债的收益风险特征差异
    answer: >-
      公募 REITs 是把成熟、能产生稳定现金流的资产（产业园区、仓储物流、
      收费公路、能源、保障性租赁住房、消费基础设施等）打包上市，
      投资者持有的是基金份额，收益来自两部分：强制分配的现金流
      （规则上不低于可供分配金额的 90%）和资产增值/价格波动。
      和股票的区别：底层是具体资产而非公司的剩余索取权，现金流可预测性
      更高、没有经营杠杆与管理层"讲故事"的空间，但成长性有限，
      扩募（收购新资产）是主要的增长方式。
      和债券的区别：没有固定票息和到期日，本金不保证，价格随资产经营
      与利率环境波动，风险高于同等级信用债，但分红收益率通常高于利率债。
      机构看四个指标：一是分派率（现金分派/市值）与经营现金流覆盖倍数；
      二是底层资产的出租率、租金单价、剩余年限、租户集中度（如仓储物流
      看租户信誉与租约到期结构）；三是运营管理机构的主动管理能力
      （"资产管理人＋运营管理人"双层结构）；四是估值与杠杆——
      用资产评估值与资本化率（cap rate）交叉验证，关注借款比例与
      利率成本（很多项目是浮动利率，利率上行直接压降可分派现金）。
      还有一个中国特色：原始权益人持有的战略配售份额有锁定安排，
      解禁节奏会影响流动性与价格。
    spoken: >-
      公募 REITs 是把成熟、有稳定现金流的资产打包上市，比如产业园、
      仓储物流、收费公路、能源和消费基础设施。收益来自两块：不低于
      可供分配金额90%的强制分红，加上资产增值带来的价格波动。和股票比，
      它底层是具体资产，现金流更可预测，但成长性有限，扩募是主要增长
      途径；和债券比，它没有固定票息和到期日，本金不保证，风险高于
      同等级信用债，但分红收益率一般比利率债高。机构主要看四个东西：
      分派率和现金流覆盖、底层资产的出租率和租户结构、运营管理人的
      主动管理能力，还有估值与杠杆，尤其是浮动利率负债对可分派现金的
      挤压。另外要留意原始权益人战略配售份额的解禁节奏，它会影响流动性。
    followups:
      - q: 利率上行对 REITs 是什么影响？
        a: 双杀。一方面是估值端，REITs 用现金流折现定价，折现率上升直接压低资产估值；另一方面是负债端，项目公司普遍有浮动利率借款，利息支出上升会减少可供分配现金。因此 REITs 对长端利率的敏感度接近长久期资产，这也解释了为什么利率下行周期里 REITs 表现通常更好。

  - id: fund-010
    qtype: short
    difficulty: 2
    institutions: [公募]
    tags: [浮动费率, 费率改革, 业绩比较基准]
    question: 浮动费率基金是怎么收费的？它对基民真的更公平吗？有什么容易被忽略的地方？
    exam_point: 三种挂钩模式（持有期 / 规模 / 业绩）；"业绩比较基准"的作用；费率改革与买方投顾的关系
    answer: >-
      三种主流模式：
      （1）与持有期挂钩——持有时间越长费率越低，鼓励长期持有，
      对赎回行为定价。
      （2）与规模挂钩——规模越大、超过阈值部分费率越低，
      解决"规模冲动"（管理费随规模线性膨胀但业绩不一定）。
      （3）与业绩挂钩——以业绩比较基准为锚，跑输则降费、跑赢则
      适当加收（有上限），本质是把管理人和持有人的利益对齐。
      对基民是否更公平，取决于三点：
      一是"锚"选得对不对——如果业绩比较基准定得很低（比如债券指数
      或宽基指数打了大折扣），跑赢基准很容易，收费加成就变成"保底"
      而非激励；所以看这类产品一定要先看业绩比较基准和超额收益的
      计提方式。
      二是投资者的实际回报——费率只是成本的 10%–20%，真正的
      决定因素是持仓与行为；浮动费率不能替代资产配置。
      三是披露与可比性——新模式让不同产品的费率口径不可直接比较，
      需要看完整费率结构与历史。
      落到行业层面：费率改革（管理费、托管费、交易佣金三阶段）
      压缩了主动权益的收入空间，倒逼管理人从"卖产品"转向"做回报"，
      也加速了被动化和买方投顾的兴起——这才是这轮改革的主线。
    spoken: >-
      浮动费率主要有三种：和持有期挂钩，持有越久费率越低；和规模挂钩，
      规模超过阈值后费率下调；和业绩挂钩，以业绩比较基准为锚，跑输降费、
      跑赢适当加收，且有上限。它对基民是否公平，关键看锚定得对不对，
      如果业绩比较基准定得很低，跑赢很容易，加收管理费就变成保底而不是
      激励，所以看这类产品要先看比较基准和超额收益的计提方式。第二，
      费率只占整体成本的一小部分，投资者的真实回报主要由持仓和行为决定，
      浮动费率替代不了资产配置。第三，新模式的费率口径不容易横向比较，
      要看完整结构。行业层面，费率改革压降了主动权益的收入空间，倒逼
      管理人从卖产品转向做回报，也加速了被动化和买方投顾，这是主线。
    followups:
      - q: 如果让你给一只浮动费率产品做路演，你会怎么讲？
        a: 三句话：先讲锚（业绩比较基准是什么、为什么合理），再讲不对称性（跑输时降费的幅度与跑赢时加收的上限，说明管理人承担了更多下行），最后讲持有期与行为引导（长期持有费率更低，避免追涨杀跌）。同时要主动提示费率不是收益来源，产品定位是长期配置工具。
