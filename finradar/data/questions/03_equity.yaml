board: 权益投资与估值
questions:

  - id: eq-001
    qtype: short
    difficulty: 1
    institutions: [券商, 公募]
    tags: [估值, DCF]
    question: 请说明 DCF、PE、PB、EV/EBITDA 各自适用什么场景，以及各自的致命缺陷。
    exam_point: 估值方法与商业模式的匹配；不要背公式要讲适用条件
    answer: >-
      DCF：适用于自由现金流可预测、经营稳定的成熟企业（公用事业、
      消费）。缺陷是对永续增长率 g 和折现率 WACC 极度敏感——终值
      往往占估值的 60%–80%，参数微调结果天差地别，容易沦为"先有
      结论再倒推假设"。
      PE：适用盈利稳定、可比公司充分的行业。缺陷是盈利可被会计政策
      调节，周期股在盈利顶部 PE 最低（此时最危险），亏损企业不适用。
      PB：适用于资产驱动、以公允价值计量为主的行业（银行、保险、
      券商、地产）。缺陷是账面价值与真实价值可能严重背离（无形资产、
      减值不足、隐性不良）。银行股常配合 PB-ROE 框架使用。
      EV/EBITDA：适用于资本结构差异大、折旧摊销重的行业（制造、
      电信、有线电视）。优点是剔除资本结构与折旧政策影响，缺陷是
      忽略了资本开支——EBITDA 不是自由现金流，重资产企业用它会系统性
      高估。
      核心原则：估值方法是商业模式的映射，先想清楚这家公司靠什么赚钱、
      价值创造在哪一环，再选方法。
    spoken: >-
      我的原则是估值方法要匹配商业模式。DCF适合现金流可预测的成熟
      企业，但它的致命伤是终值占比经常六到八成，g和WACC稍微一动结果
      就完全不同，很容易变成先有结论再倒推假设。PE适合盈利稳定、
      可比公司多的行业，但周期股在盈利顶部PE最低，这时候恰恰最危险。
      PB适合资产驱动的金融地产，一般配合PB-ROE框架用，缺陷是账面
      价值可能失真，比如隐性不良。EV/EBITDA适合资本结构差异大、
      折旧重的行业，好处是剔除了资本结构和折旧政策的影响，但它忽略
      资本开支，对重资产公司会系统性高估。
    followups:
      - q: 银行股为什么长期破净？
        a: 市场对账面资产质量存疑（隐性不良、涉房与城投敞口）、对ROE可持续性存疑（息差下行）、以及对增长空间的定价。PB<1本质是市场认为账面净资产的真实价值和未来回报低于账面值。

  - id: eq-002
    qtype: short
    difficulty: 2
    institutions: [券商, 公募]
    tags: [ROE, 杜邦分析]
    question: 请用杜邦分析拆解 ROE，并说明如何用它比较两家公司的商业模式差异。
    exam_point: 三因子/五因子拆解；ROE相同但结构不同的含义
    answer: >-
      三因子：ROE = 净利率 × 总资产周转率 × 权益乘数
      （盈利能力 × 运营效率 × 财务杠杆）。
      五因子进一步拆为：税负率 × 利息负担 × 经营利润率 × 资产周转率
      × 权益乘数。
      比较用法：两家 ROE 同为 15% 的公司，一家靠高净利率（品牌溢价、
      定价权，如高端白酒），一家靠高周转（规模效率、供应链，如零售
      连锁），第三家靠高杠杆（金融、地产）。三者的风险属性完全不同：
      高净利率看护城河是否被侵蚀，高周转看规模效应与需求稳定性，
      高杠杆看融资成本与再融资风险，且在利率上行或信用收缩期最脆弱。
      因此判断 ROE 可持续性，要看它由哪一项驱动、这一项的驱动因素
      是否可持续。
    spoken: >-
      ROE等于净利率乘资产周转率乘权益乘数，也就是盈利能力、运营效率、
      财务杠杆。我用它做横向比较时最看重的是"同样的ROE来自哪里"：
      靠高净利率的通常有品牌或定价权，要看护城河会不会被侵蚀；
      靠高周转的是规模和供应链效率，要看需求稳定性；靠高杠杆的
      在利率上行和信用收缩期最脆弱。所以判断ROE能不能持续，关键
      是看它由哪一项驱动、那一项的底层逻辑还在不在。
    followups:
      - q: ROE 和 ROIC 有什么区别，什么时候该用 ROIC？
        a: ROE含杠杆，ROIC剔除资本结构、衡量投入资本的回报效率。比较不同杠杆水平的公司、或评估管理层的资本配置能力时应该用ROIC，并与WACC比较判断是否创造价值。

  - id: eq-003
    qtype: short
    difficulty: 2
    institutions: [券商, 公募]
    tags: [中长期资金, 资金面]
    question: “中长期资金入市”包括哪些资金？为什么说核心问题是“长钱短考”？
    exam_point: 险资/社保/年金/公募四类；考核周期改革是关键抓手
    answer: >-
      主要指商业保险资金、全国社保基金、基本养老保险基金、企业年金与
      职业年金、公募基金（不等同于外资或"国家队"）。
      政策依据：2024年9月中央金融办、证监会《关于推动中长期资金入市的
      指导意见》；2025年1月六部委《关于推动中长期资金入市工作的实施方案》。
      核心矛盾是"长钱短考"：负债久期很长（保险10年以上、养老金数十年），
      但绩效考核按年甚至按季，导致机构行为短期化、无法承受阶段性回撤，
      于是被迫低配权益。
      关键抓手因此在考核端：对国有保险公司实施三年以上长周期考核，
      大幅降低当年度指标权重；全国社保基金、基本养老保险基金拉长考核
      周期。量化目标上，实施方案提出大型国有保险公司自2025年起每年
      新增保费的30%用于投资A股；公募基金持有A股流通市值未来三年
      每年至少增长10%。配套还有保险资金长期投资改革试点、
      个人养老金全面实施、偿付能力与会计计量的松绑。
    spoken: >-
      中长期资金主要是四类：保险资金、社保基金、基本养老和年金、
      还有公募基金，不是很多人以为的外资或国家队。核心矛盾不是没钱，
      是"长钱短考"——负债久期十年二十年，考核却是按年甚至按季，
      机构承受不了阶段性回撤，只能低配权益。所以最关键的改革其实在
      考核端：国有险企改成三年以上长周期考核，大幅降低当年度权重，
      社保和基本养老也拉长周期。量化上，实施方案要求大型国有险企
      从2025年起每年新增保费的30%投A股，公募持有A股流通市值未来
      三年每年至少增10%。再配上偿付能力和会计计量的松绑，形成
      资金端、考核端、产品端三管齐下。
    followups:
      - q: 险资为什么偏爱高股息？
        a: 一是新会计准则下把长期股权或FVOCI资产的公允价值波动计入其他综合收益，不冲击当期利润，而股息可计入投资收益；二是高股息现金流特征匹配长久期负债；三是偿付能力下权益风险因子对长期持有有优惠。

  - id: eq-004
    qtype: short
    difficulty: 2
    institutions: [券商, 公募]
    tags: [ETF, 被动化]
    question: 为什么这两年被动指数基金规模快速超过主动权益？被动化对市场定价效率有什么影响？
    exam_point: 三大驱动因素；被动化的负外部性讨论
    answer: >-
      驱动因素：（1）超额难度上升——全面注册制后个股数量大增、分化
      加剧，主动管理战胜基准的难度提高；（2）成本优势——2023年起的
      费率改革放大了被动产品的低费率优势；（3）增量资金结构——中央
      汇金等中长期资金增持时首选宽基ETF，2024年被动指数基金持股规模
      首次超过主动权益基金；中证A500等新一代核心宽基推出提供了工具。
      对定价效率的影响：适度被动化提升市场流动性、降低交易成本；
      但被动占比过高会带来负外部性——资金按市值权重无差别买入，
      削弱个股基本面定价、放大龙头集中度、在赎回期同向抛售加剧波动。
      理论上被动与主动存在均衡：被动占比越高，主动管理的alpha机会
      反而增加，从而吸引主动资金回流。
    spoken: >-
      三个原因：一是全面注册制后个股分化加剧，主动战胜基准越来越难；
      二是费率改革放大了被动的成本优势；三是增量资金的结构变了，
      中央汇金这类中长期资金增持首选宽基ETF，2024年被动指数基金持股
      规模第一次超过主动权益，中证A500这些新宽基也提供了工具。
      对市场的影响要两面看：适度被动化提升流动性、降低成本，但占比
      过高会削弱个股的基本面定价、放大龙头集中度，赎回期还会同向
      抛售放大波动。不过长期看两者有均衡关系——被动越多，主动的
      alpha机会反而越大。

  - id: eq-005
    qtype: case
    difficulty: 3
    institutions: [券商, 公募]
    tags: [行业研究, 反内卷]
    question: >-
      请以"反内卷"为线索，说明你会怎么筛选可能出现盈利拐点的行业，
      需要跟踪哪些指标。
    exam_point: 供给侧变量的量化跟踪；与2016年供给侧改革的差异
    answer: >-
      筛选框架四步：
      （1）识别症状——收入增长但毛利率与净利率持续下滑、行业整体
      "增收不增利"、产品价格长期低于行业平均成本线。
      （2）判断供给刚性——是否存在大规模在建产能、退出壁垒是否高
      （专用设备、地方就业与税收考量），退出壁垒越高、出清越慢。
      （3）识别政策抓手——是否被纳入价格法执法、行业自律公约、
      能耗与产能置换标准、地方招商补贴清理的范围。有明确抓手的
      行业出清更快。
      （4）验证拐点——跟踪产能利用率、行业开工率、库存周期位置、
      产品价格与价差、CR5 集中度、单位盈利（单吨/单瓦净利）、
      以及龙头资本开支是否转负。
      与2016年的关键差异：那轮以行政去产能为主、对象是上游国企，
      信号清晰见效快；本轮对象多为民企与新兴产业（光伏、锂电、
      汽车、电商、外卖），主要靠标准与法治，节奏更慢、更依赖需求
      端配合，因此不能简单套用上一轮的时间表和弹性。
    spoken: >-
      我会分四步。第一步识别症状，看是不是"增收不增利"，毛利率和
      净利率持续下滑、价格长期低于平均成本。第二步判断供给刚性，
      看在建产能规模和退出壁垒，涉及地方就业税收的退出会很慢。
      第三步看有没有明确的政策抓手，比如是不是纳入了价格法执法、
      行业自律公约、能耗和产能置换标准，有抓手的行业出清快。
      第四步验证拐点，跟踪产能利用率、开工率、库存位置、产品价差、
      CR5和单位盈利，最关键的信号是龙头的资本开支转负。
      要提醒的是，这轮不能照搬2016年的时间表，那轮是行政去产能、
      上游国企为主，这轮对象是民企和新兴行业，靠标准和法治，节奏
      会慢很多。

  - id: eq-006
    qtype: multi
    difficulty: 2
    institutions: [券商, 公募]
    tags: [资本市场制度]
    question: 关于新"国九条"（2024）及配套制度，下列表述正确的有？
    options:
      - A. 它是继2004年、2014年之后的第三个‘国九条’
      - B. 形成‘1+N’政策体系，N包括发行上市、退市、分红、减持等配套规则
      - C. 证监会2024年11月发布了《上市公司监管指引第10号——市值管理》
      - D. 市值管理鼓励上市公司通过维护股价稳定的方式提升市值
    correct: [A, B, C]
    exam_point: 国九条时间线与1+N体系；市值管理明确禁止操纵股价
    answer: >-
      A、B、C正确。D错误：市值管理指引明确要求以提升上市公司质量为
      基础，列举并购重组、股权激励、现金分红、投资者关系管理、
      信息披露、股份回购等合法方式，同时明令禁止以市值管理名义
      操纵股价、进行内幕交易或误导性陈述。指引还要求主要指数成分股
      公司制定市值管理制度，长期破净公司披露估值提升计划。
    spoken: >-
      前三个对。新国九条是2024年4月国务院印发的，是第三个国九条，
      前两个是2004和2014年，形成1+N体系。市值管理指引是2024年11月
      的第10号监管指引。D是错的，指引恰恰划了红线，禁止以市值管理
      名义操纵股价和内幕交易，同时要求主要指数成分股公司建立市值
      管理制度、长期破净公司披露估值提升计划。

  - id: eq-007
    qtype: short
    difficulty: 3
    institutions: [券商, 公募]
    tags: [组合管理, 风险]
    question: 你怎么给一个股票组合做风险管理？请说明你会看哪些维度。
    exam_point: 事前风险预算 vs 事后归因；集中度、因子暴露、流动性
    answer: >-
      事前：（1）风险预算——设定组合波动率、跟踪误差（相对基准）、
      单一个股与行业上限；（2）因子暴露——用Barra类模型监控规模、
      价值、成长、动量、波动率、流动性、以及行业暴露，避免"看起来
      分散、实际上押注单一因子"；（3）流动性——按日均成交额估算
      清仓天数，控制持仓占流通盘比例；（4）相关性——极端行情下
      相关性趋于1，要做压力测试而非只看历史协方差。
      事中：设定回撤阈值与再平衡纪律，区分"逻辑没变的回撤"和
      "逻辑被证伪的回撤"，后者必须止损。
      事后：业绩归因（Brinson做配置/选股拆分，或多因子归因看alpha
      来源），检验超额收益是真alpha还是因子beta。
      我认为最容易被忽略的是流动性风险和"隐性集中度"——名义上持有
      30只股票，但因子暴露高度重合，实质是一个赌注。
    spoken: >-
      我分事前、事中、事后三段。事前是风险预算，设组合波动率、跟踪
      误差和个股行业上限；然后看因子暴露，用Barra类模型看规模、
      价值、成长、动量这些暴露，避免"看起来分散实际押注单一因子"；
      再看流动性，用日均成交额估清仓天数。事中是回撤纪律，关键是
      区分逻辑没变的回撤和逻辑被证伪的回撤，后者必须止损。事后是
      归因，用Brinson拆配置和选股，或者多因子归因看超额到底是alpha
      还是因子beta。我觉得最容易被忽略的是隐性集中度——名义持30只
      股票，但因子暴露高度重合，本质还是一个赌注。

  - id: eq-008
    qtype: short
    difficulty: 2
    institutions: [券商]
    tags: [投行, 并购]
    question: IPO 阶段性收紧后，投行业务重心怎么转移？做并购和做IPO对能力的要求有什么不同？
    exam_point: 并购六条的背景与内容；投行能力结构的变化
    answer: >-
      背景：2024年以来IPO节奏阶段性收紧、主板与创业板财务门槛上调，
      一级市场退出通道收窄；2024年9月证监会发布"并购六条"，
      支持围绕新质生产力开展并购重组、提高对未盈利资产与跨行业并购的
      包容度、丰富支付工具（定向可转债、分期支付）、简化审核
      （简易审核程序、小额快速通道），2025年配套修订重大资产重组
      管理办法。
      能力差异：IPO 更偏"合规与流程"——把企业做规范、通过审核；
      并购更偏"交易设计与产业理解"——需要判断产业逻辑与协同、
      给出估值区间与对价结构、设计业绩承诺与对赌、平衡买卖双方
      与中小股东利益、处理税务与反垄断审查、以及交割后的整合安排。
      并购收入更依赖财务顾问费与后续融资，项目周期与不确定性更高，
      对行业研究和谈判能力的要求显著上升。
    spoken: >-
      背景是2024年以来IPO阶段性收紧、门槛上调，一级市场需要新的退出
      出口，所以2024年9月出了并购六条，提高对未盈利资产和跨行业并购
      的包容度，丰富支付工具比如定向可转债和分期支付，还简化了审核。
      能力上差别很大：IPO核心是合规和流程，把企业做规范、过审核；
      并购核心是交易设计和产业理解，要判断协同逻辑、给估值区间和
      对价结构、设计业绩承诺和对赌、平衡买卖双方和中小股东，还要
      处理税务和反垄断。并购的项目周期长、不确定性高，对行业研究和
      谈判能力要求高得多，我个人觉得这对想做产业投行的人反而是机会。
    followups:
      - q: 监管在并购上的红线是什么？
        a: 支持有清晰产业逻辑的整合，严打"忽悠式重组"、炒壳和内幕交易。判断标准包括标的估值合理性、业绩承诺可实现性、交易对方关联关系与资金来源、以及停复牌与信息披露的合规性。

  - id: eq-009
    qtype: short
    difficulty: 2
    institutions: [券商, 公募]
    tags: [市值管理, 回购, 股东回报]
    question: 监管反复强调"注销式回购"，为什么注销和用于股权激励的回购不一样？市值管理要怎么做才不算炒作？
    exam_point: 注销式回购提升每股收益的数学逻辑；市值管理的合规划线；"长期破净公司"的估值提升计划
    answer: >-
      先看数学：回购注销后总股本减少，在公司净利润不变的情况下每股收益
      （EPS）直接增厚，股东权益占公司整体价值的比例上升，是"把价值还给
      股东"；回购后转作股权激励或员工持股，股本总数不减，只是把股份从
      二级市场转移到内部人手里，长期看股份还会因为行权重新回到市场，
      对每股价值的提升效果被稀释，所以监管更鼓励前者。
      制度背景：2023年以来监管把"回购注销、分红"作为提升股东回报的
      主要抓手，2024年11月的《上市公司监管指引第10号——市值管理》
      要求长期破净公司披露估值提升计划，同时对"打着市值管理旗号
      操纵股价、内幕交易、非法荐股"划出红线。
      市值管理的合规做法有六类：现金分红与回购注销、提高信息披露质量
      与投资者沟通、并购重组做优主业、股权激励绑定核心团队、优化
      资本结构、必要时的增持（尤其是大股东和董监高）。判断标准很简单：
      是否与基本面改善同步，是否损害中小股东利益，是否通过公开信息披露
      而不是私下"讲故事"。
    spoken: >-
      核心差别在股本。回购注销以后总股本变少，净利润不变的情况下每股
      收益直接增厚，是真正把价值还给股东；回购用于股权激励的话股本没
      减少，只是股份从市场转到内部人手里，将来行权还会回来，对每股价值
      的增厚是打折的。这也是为什么监管更喜欢"注销式回购"和现金分红。
      背景是2024年11月的市值管理指引，要求长期破净公司拿出估值提升计划，
      同时明确反对借市值管理操纵股价。合规的市值管理我总结成六类：
      分红和注销式回购、提高信息披露质量、并购重组做优主业、股权激励、
      优化资本结构、必要时增持。判断标准就是看是不是跟基本面改善同步、
      有没有损害中小股东、是不是通过公开信息披露做而不是私下讲故事。
    followups:
      - q: 如果一家公司账面现金很多但长期破净，你会怎么建议？
        a: 先判断现金的真实性和用途约束（是否有受限资金、资本开支计划、债务到期），再看主业投入的边际回报。若确实缺乏高回报投资机会，优先建议提高分红率与注销式回购、同时把估值提升计划写进定期报告并落实沟通；但要警惕用回购掩盖经营问题，也不建议举债回购。

  - id: eq-010
    qtype: short
    difficulty: 2
    institutions: [券商, 公募, 银行]
    tags: [红利策略, 高股息, 低利率]
    question: 为什么这两年高股息、红利策略这么火？在什么情况下它会失效？
    exam_point: 红利资产的定价逻辑（股息率与无风险利率的比较）；资管机构的会计与负债约束；拥挤度风险
    answer: >-
      火起来有三条逻辑：
      （1）定价逻辑——红利资产的核心是"股息率 vs 无风险利率"。
      当十年期国债收益率下行到低位、存款利率连续下调时，股息率 4%–6%
      且现金流稳定的资产自然产生比价优势，这就是"类债"属性。
      （2）负债逻辑——保险、年金、银行理财需要匹配长期稳定现金流，
      新会计准则（IFRS9）下高股息资产的波动对利润表冲击更小，
      机构有配置的刚性需求。
      （3）流动性逻辑——在存量资金、宽基指数扩容的背景下，
      红利是少数有"确定性叙事"的方向，容易被资金抱团。
      失效条件也要说清楚：
      一是无风险利率大幅上行（比如政策转向紧缩），比价优势消失；
      二是经济强复苏，资金切换到成长与顺周期，红利性价比下降；
      三是行业基本面恶化，比如煤炭、银行、公用事业出现盈利与分红能力
      下滑，"高股息"变成"股息陷阱"（用股价下跌腾出的高股息率）；
      四是拥挤度过高，交易结构脆弱，出现集中赎回时波动放大。
      所以红利策略不是"低风险"，而是把风险从波动率换成了基本面与
      利率环境，需要看分红的可持续性（自由现金流、分红率、资本开支）。
    spoken: >-
      三条逻辑。第一是定价逻辑，红利资产的核心是股息率和无风险利率的
      比较，国债收益率和存款利率都往下走，股息率五六个点、现金流稳定的
      资产就有比价优势，带"类债"属性。第二是负债逻辑，保险、年金、
      理财需要长期稳定的现金流来匹配负债，新会计准则下高股息资产对
      利润表的波动冲击也更小。第三是流动性逻辑，存量资金环境下红利是
      少数有确定性叙事的方向，容易被抱团。失效条件我会说四个：无风险
      利率大幅上行，比价优势没了；经济强复苏，资金切到成长和顺周期；
      行业基本面恶化，高股息变成股息陷阱；还有拥挤度过高导致波动放大。
      所以我不会把红利等同于低风险，它只是把风险从波动率换成了基本面
      和利率环境，重点要看分红的可持续性，也就是自由现金流和资本开支。
    followups:
      - q: 怎么判断一只红利股是不是"股息陷阱"？
        a: 三个信号：一是分红靠举债、出售资产或消耗存量现金而非经营现金流支撑；二是资本开支或监管政策将显著侵蚀未来盈利（如能源价格下行、银行让利）；三是股息率异常高是股价暴跌的结果而非分红提升。核心是看未来 3 年自由现金流与分红率能否覆盖。
