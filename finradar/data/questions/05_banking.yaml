board: 银行与信贷
questions:

  - id: bk-001
    qtype: short
    difficulty: 1
    institutions: [银行, 券商]
    tags: [净息差]
    question: 净息差为什么持续收窄？银行可以怎么应对？
    exam_point: 资产端四因素 + 负债端刚性 + 政策对冲 + 银行自救路径
    answer: >-
      公式：NIM = 净利息收入 / 生息资产平均余额，可拆为
      （生息资产收益率 − 计息负债成本率）× 结构因子，分析要拆到
      "量、价、结构"三层。
      资产端下行原因：（1）LPR 多次下调；（2）存量房贷利率批量调整；
      （3）化债将高息城投资产置换为低息政府债；（4）有效信贷需求
      不足导致银行内卷式竞价。
      负债端刚性原因：居民风险偏好下降导致存款定期化、长期化；
      存款竞争；此前的手工补息（已被整治）。
      政策对冲：存款利率市场化调整机制（参考10年期国债收益率与
      1年期LPR调整挂牌利率）、多轮下调存款挂牌利率、整治手工补息
      与高息揽储、规范同业存款定价。
      银行自救：负债端压成本与优化结构（提高活期与低成本核心存款
      占比）；资产端优化结构（提高零售、小微、消费贷等高收益资产
      占比，但需权衡风险）；发展非息收入（财富管理、投行、结算、
      托管），从"吃息差"转向"轻资本"。
      深层逻辑：息差 → 利润 → 内源资本补充 → 信贷投放能力，
      监管关注息差本质是关注信贷供给的可持续性。
    spoken: >-
      我会拆成资产端和负债端。资产端下行有四个原因：LPR多次下调、
      存量房贷利率批量调整、化债把高息城投换成低息政府债、还有
      有效信贷需求不足导致的内卷式竞价。负债端是刚性的，居民风险
      偏好下降带来存款定期化长期化，成本降不下来。政策对冲主要在
      负债端，存款利率市场化调整机制让挂牌利率跟随10年期国债和
      1年期LPR下调，同时整治手工补息。银行自身的出路是负债端压成本、
      资产端优化结构，更重要的是提高非息收入占比，从吃息差转向轻资本。
      我认为监管盯息差不是关心银行赚不赚钱，而是因为息差决定利润、
      利润决定内源资本补充、资本决定信贷投放能力，是信贷供给可持续性
      的问题。
    followups:
      - q: 手工补息为什么被整治？对数据有什么影响？
        a: 手工补息是在挂牌利率外通过手工方式额外付息，实质是绕开自律上限的高息揽储，抬高负债成本并诱发"存款空转"（低息贷款套高息存款）。整治后企业活期存款大幅下降，把M1砸出一个坑，读M1数据时必须剔除这个口径扰动。

  - id: bk-002
    qtype: multi
    difficulty: 2
    institutions: [银行, 券商]
    tags: [资本新规]
    question: 关于《商业银行资本管理办法》（2024年1月1日施行），下列表述正确的有？
    options:
      - A. 建立差异化资本监管体系，按规模和业务复杂度将银行分为三档
      - B. 对投资级公司、优质中小企业的风险权重有所下调
      - C. 资管产品若无法穿透，可能适用1250%的风险权重
      - D. 取消了核心一级资本充足率的最低要求
    correct: [A, B, C]
    exam_point: 三档划分 + 风险权重有保有压 + 穿透要求；最低资本要求未取消
    answer: >-
      A、B、C正确。D错误：核心一级资本充足率最低要求仍为5%，
      一级资本6%，总资本8%，此外还有2.5%储备资本、逆周期资本
      以及系统重要性银行附加资本要求。
      风险权重导向是"有保有压"：投资级公司、优质中小企业、
      低LTV个人住房抵押贷款权重下调；次级债、部分同业资产、
      穿透不足的资管产品权重上调，最严格情形按1250%计量。
      政策导向：鼓励服务实体与零售，压制同业空转与不透明嵌套，
      并倒逼资管产品提高底层穿透与信息披露。
    spoken: >-
      前三项对。资本新规最大的变化是差异化监管，按规模和跨境业务
      分三档，第三档小银行大幅简化，避免一刀切增加中小行成本。
      风险权重是有保有压：投资级公司、优质中小企业和低LTV按揭下调，
      次级债、部分同业和穿透不了的资管产品上调，最极端按1250%。
      D是错的，核心一级5%、一级6%、总资本8%的最低要求都还在，
      上面还有储备资本、逆周期资本和系统重要性附加资本。

  - id: bk-003
    qtype: short
    difficulty: 2
    institutions: [银行]
    tags: [不良, 资产质量]
    question: 衡量银行资产质量看哪些指标？为什么不良率低不一定代表资产质量好？
    exam_point: 五级分类、关注类、逾期偏离度、拨备覆盖率、核销与处置
    answer: >-
      主要指标：不良贷款率、关注类贷款占比、逾期90天以上贷款与
      不良的比值（逾期偏离度）、拨备覆盖率、拨贷比、不良生成率
      （加回核销后的净生成）、以及分行业与区域的敞口结构。
      不良率低不一定代表质量好，原因：
      （1）分母效应——贷款规模快速扩张会稀释不良率；
      （2）核销与转让——大量核销、批量转让不良资产会压低账面不良率，
      所以要看"加回核销的不良生成率"；
      （3）分类偏离——若逾期90天以上贷款未全部计入不良，
      偏离度大于1说明分类不审慎；
      （4）展期与重组掩盖——通过借新还旧、展期把风险后移，
      表现为关注类占比上升而不良未升；
      （5）拨备计提不足——不良率低但拨备覆盖率同步下降，
      说明抵御能力并未增强。
      因此判断要看"不良 + 关注 + 逾期偏离度 + 不良生成率 + 拨备"
      的组合，而不是单一指标。
    spoken: >-
      我不会只看不良率，因为它太容易被修饰。我看五个东西：
      第一是不良率加关注类占比，关注类是不良的先行指标；第二是
      逾期90天以上和不良的比值，也就是偏离度，大于1说明分类不审慎；
      第三是加回核销之后的不良生成率，因为大量核销和批量转让会
      直接压低账面不良；第四是拨备覆盖率和拨贷比，看抵御能力；
      第五是分行业和区域的敞口结构。不良率低有可能只是分母做大了、
      或者展期借新还旧把风险后移了，所以一定要看组合而不是单一指标。

  - id: bk-004
    qtype: short
    difficulty: 2
    institutions: [银行, 券商]
    tags: [AIC, 科技金融]
    question: 什么是银行 AIC？为什么说它是银行做科技金融的关键抓手？
    exam_point: AIC 由来 + 2024年试点扩围的三条放宽 + 银行文化与股权投资的冲突
    answer: >-
      AIC 即金融资产投资公司，最初是2017年五大行为开展市场化债转股
      设立的子公司。2024年9月金融监管总局扩大其股权投资试点：
      试点城市扩大至18个；表内资金投资比例由4%提高到10%；
      单只私募基金的投资比例由20%提高到30%。2025年进一步扩容至
      更多城市并允许更多银行设立。
      关键性在于：银行体系原本只能提供债权，而科技企业轻资产、
      高失败率、收益呈幂律分布，债权工具承担不了股权风险。
      AIC 让银行资金能以股权形式进入，与信贷形成"投贷联动"。
      挑战：股权投资资本占用高；退出依赖 IPO 与并购，通道受市场
      周期影响；最根本的是文化冲突——银行风控文化是"零容忍不良"，
      而股权投资本就是"十个项目亏七个、靠一个赚回来"，
      因此考核机制、尽职免责与人才激励的设计是成败关键。
    spoken: >-
      AIC是金融资产投资公司，最早是2017年五大行为做市场化债转股
      设立的。2024年9月股权投资试点扩围，城市扩到18个，表内资金
      投资比例从4%提到10%，单只私募基金投资比例从20%提到30%，
      2025年又进一步扩容。它的关键性在于，银行过去只能放贷款，
      但科技企业轻资产、高失败率、收益是幂律分布，债权扛不了股权
      风险；AIC让银行资金能以股权进去，跟信贷形成投贷联动。
      难点也很实在：资本占用高、退出依赖IPO和并购，最根本的是
      文化冲突——银行风控是零容忍坏账，股权投资本来就是十个亏七个
      靠一个赚回来，所以考核机制和尽职免责怎么设计才是成败关键。

  - id: bk-005
    qtype: short
    difficulty: 2
    institutions: [银行]
    tags: [房地产, 白名单]
    question: 房地产融资协调机制（"白名单"）解决了什么问题？对银行的资产负债表有什么影响？
    exam_point: 从"救主体"到"救项目"的转变；封闭运作；对息差与资产质量的双重影响
    answer: >-
      解决的问题：房企主体信用恶化后，银行不敢向任何关联项目放款，
      导致本身现金流健康的项目也被拖入停工，形成"保交房"危机与
      风险传染。协调机制以城市为单位、以项目为单位建立白名单，
      要求项目资金封闭运作、专款专用，把项目信用与主体信用切割，
      让银行敢于给合规项目放款。
      配套还有：保障性住房再贷款（支持地方国企收购已建成存量商品房
      转作保障房）、取消房贷利率下限、下调首付比例、2024年9月存量
      房贷利率批量下调。
      对银行的影响是双向的：（1）资产质量——开发贷与按揭的尾部风险
      缓释，保交房降低了断供与烂尾引发的连锁风险；
      （2）盈利——按揭规模增长放缓、存量房贷利率下调直接减少利息
      收入，进一步压制净息差；涉房敞口的结构分化加剧，需要分区域、
      分项目做精细化管理。
    spoken: >-
      它解决的是风险传染问题：房企主体信用一恶化，银行对所有关联
      项目都不敢放款，结果现金流本来健康的项目也停工，变成烂尾。
      白名单是以城市和项目为单位，要求资金封闭运作、专款专用，
      把项目信用和主体信用切割开，让银行敢给合规项目放款，底线是
      保交房。配套还有保障性住房再贷款支持收储、需求端取消利率下限、
      降首付，还有2024年9月的存量房贷利率批量下调。对银行是双刃剑：
      资产质量这边尾部风险确实缓释了，但盈利这边按揭规模和收益率
      都在降，直接拖累息差。

  - id: bk-006
    qtype: short
    difficulty: 3
    institutions: [银行]
    tags: [授信, 信贷分析]
    question: 给一家制造业中小企业做授信，你会看哪些方面？如果它是科技型企业，分析框架要怎么调整？
    exam_point: 传统三查与还款来源；科技企业的分析框架差异
    answer: >-
      传统框架（贷前调查—贷时审查—贷后检查）：
      （1）第一还款来源——经营性现金流：收入真实性（发票、纳税、
      银行流水三方交叉验证）、毛利率与同业对比、应收账款账龄与
      集中度、存货周转、上下游议价能力。
      （2）第二还款来源——抵质押物与担保：抵押物权属、变现能力、
      估值折扣（LTV）、担保方代偿能力、是否存在互保联保链条。
      （3）主体与治理——实控人征信与涉诉、对外担保、关联交易、
      多头授信与征信查询次数、是否存在民间借贷。
      （4）行业与区域——所处周期位置、是否被纳入"反内卷"整治范围、
      区域产业链配套。
      科技型企业的调整：轻资产、无抵押、早期无稳定现金流，传统
      三查失灵。需要转向：技术与团队评估（专利质量而非数量、
      核心团队稳定性）、客户与订单验证（大客户认证周期、在手订单）、
      股权融资记录（知名机构背书与估值变化）、知识产权质押与
      政府性融资担保、以及投贷联动（与AIC或外部创投的股权安排联动）。
      同时必须配套尽职免责与差异化不良容忍度，否则客户经理不敢做。
    spoken: >-
      传统制造业我按两个还款来源看。第一还款来源是经营性现金流，
      要用发票、纳税和银行流水三方交叉验证收入真实性，再看毛利率、
      应收账款账龄和集中度、存货周转、上下游议价能力。第二还款
      来源是抵质押和担保，看权属、变现能力、抵押率，特别要排查
      互保联保链条。再叠加实控人征信涉诉、对外担保、多头授信，
      以及行业周期位置。科技型企业这套会失灵，因为轻资产、没抵押、
      早期没有稳定现金流。我会转向看技术和团队，专利要看质量不是
      数量；看客户和在手订单，大客户认证本身就是一种验证；看股权
      融资记录，知名机构背书和估值变化是外部信号；再配合知识产权
      质押、政府性融资担保和投贷联动。但前提是行内要有尽职免责和
      差异化的不良容忍度，否则客户经理不敢碰。

  - id: bk-007
    qtype: single
    difficulty: 1
    institutions: [银行]
    tags: [存款保险]
    question: 关于存款保险制度，下列表述正确的是？
    options:
      - A. 最高偿付限额为人民币50万元，按同一存款人在同一投保机构的本息合并计算
      - B. 银行销售的理财产品也在保障范围内
      - C. 实行统一费率，各家银行费率相同
      - D. 存款保险基金只能用于赔付，不能参与风险处置
    correct: [A]
    exam_point: 50万限额 + 只保存款 + 风险差别费率 + 处置功能
    answer: >-
      A正确。《存款保险条例》2015年5月1日施行，最高偿付限额50万元，
      能够全额保障99%以上存款人的存款。
      B错误：理财、基金、保险等非存款产品不在保障范围，这是销售
      适当性中必须向客户明确的内容。
      C错误：实行风险差别费率，风险越高费率越高，形成市场化约束。
      D错误：存款保险基金管理机构还可参与问题机构的收购承接与
      风险处置，是中小金融机构风险处置的重要工具。
    spoken: >-
      选A。存款保险条例2015年施行，最高赔50万，按同一存款人在同一
      家银行的本息合并算，能覆盖99%以上的存款人。要注意它只保存款，
      理财、基金、保险都不保，这点在销售时必须跟客户讲清楚。
      费率是风险差别费率不是统一费率。而且存款保险基金不只是赔付，
      还能参与问题机构的收购承接，是中小银行风险处置的重要工具。

  - id: bk-008
    qtype: short
    difficulty: 2
    institutions: [银行, 券商]
    tags: [中小金融机构, 风险处置]
    question: 中小金融机构改革化险的主要方式有哪些？为什么农信社改制是重点？
    exam_point: 兼并重组、省联社改革、村改支/村改分；治理结构是根因
    answer: >-
      主要方式：（1）兼并重组与吸收合并——大行或省级农商行吸收
      高风险村镇银行，形式上表现为"村改支"（改为支行）、
      "村改分"（改为分行）；（2）省联社改革——将农信社系统改制为
      省级农商银行、农商联合银行或金融控股形式，统一法人或强化
      统一管理；（3）注资与不良处置——地方专项债补充中小银行资本、
      不良资产批量转让、引入战略投资者；（4）严格早期纠正——
      对高风险机构实施硬约束干预。
      农信社是重点的原因：数量多、单体规模小、股权分散且股东质量
      参差，公司治理薄弱是风险的根因——大股东占款、内部人控制、
      信贷"三查"流于形式；同时它承担县域与涉农金融供给，不能简单
      退出，只能通过改制提升治理与风控能力。
    spoken: >-
      主要有四条路：一是兼并重组，大行或省级农商行吸收高风险村镇
      银行，也就是"村改支""村改分"；二是省联社改革，把农信社改制成
      省级农商银行或农商联合银行，统一法人或强化统一管理；三是
      注资和不良处置，地方专项债补资本、不良批量转让、引战投；
      四是严格早期纠正。农信社之所以是重点，是因为数量多、单体小、
      股权分散、股东质量参差，真正的病根是公司治理——大股东占款、
      内部人控制、三查流于形式。但它又承担县域和涉农金融供给，
      不能简单退出，所以只能通过改制来提升治理和风控。

  - id: bk-009
    qtype: short
    difficulty: 2
    institutions: [银行, 券商, 公募]
    tags: [存款利率, 手工补息, 净息差]
    question: 存款利率自律和"手工补息"整改在管什么？对银行的净息差和理财规模有什么影响？
    exam_point: 存款利率市场化调整机制的运作；手工补息的违规本质；对"存款搬家"与理财的传导
    answer: >-
      制度层面：我国存款利率由"市场利率定价自律机制"引导——大行先调、
      中小行跟随，参考 10 年期国债收益率与 1 年期 LPR 的变化来调整挂牌
      利率，这就是"存款利率市场化调整机制"。目的是防止银行在揽储竞争中
      抬高负债成本，从而守住净息差、为让利实体留空间。
      "手工补息"是指银行在挂牌利率之外，通过补息、贴息、手工记账等方式
      额外给客户利息，本质是变相高息揽储：它绕过自律上限、推高负债成本、
      扭曲存款数据（让存款增长显得更强），也让资金在体系内空转套利。
      2024 年监管明确禁止并清查，直接结果是——部分套利资金从大行存款
      流出，转向理财、货基、债基，出现"存款搬家"。
      对净息差的影响：负债端成本下降是正面缓冲，但存款结构向高成本
      定期化、长期化迁移会部分抵消效果；同时资产端 LPR 下行仍在压制
      收益率，所以净息差短期仍承压，银行的对策是调结构（降低高成本
      主动负债、提高活期与结算性存款占比）、稳资产定价、靠非息收入
      （财富管理、投行、代销保险）补缺口。
      对市场的影响：理财与债基规模受益、短端债券与货基收益率下行、
      银行负债稳定性下降（同业存单发行需求上升），这也是"资产荒"
      叙事的来源之一。
    spoken: >-
      存款利率是自律机制引导的，大行先调、中小行跟随，参考十年期国债
      收益率和一年期 LPR 的变化。手工补息是银行在挂牌利率之外通过补息
      贴息额外给利息，实质是变相高息揽储，它绕过自律上限、推高负债成本、
      还让存款数据显得更好看。2024年监管清查之后，一部分套利资金从大行
      存款流出，去了理财、货基和债基，就是所谓的存款搬家。对净息差来说，
      负债成本下降是正向的，但存款定期化长期化会抵消一部分，加上资产端
      LPR 还在下行，所以息差短期还是承压，银行的对策是调负债结构、
      稳住资产定价、用财富管理和投行这些非息收入补缺口。对市场的影响是
      理财和债基受益、货币基金和短债收益率下行、银行负债稳定性下降，
      这也是资产荒叙事的一个来源。
    followups:
      - q: 存款利率还会继续下调吗？怎么判断节奏？
        a: 看三个约束：一是存款利率与国债收益率、LPR 的比价关系（机制本身就是按这个锚调整）；二是银行净息差水平与监管对息差稳定的容忍度；三是存款与理财、货基的相对收益差——如果存款利率下调过快导致大规模搬家、银行负债不稳，节奏就会被放慢。方向上"低位缓降"的概率高于大幅下调。
