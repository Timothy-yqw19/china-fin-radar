# 投行与金融市场线（面试专项）
# schema 见 docs/GLOSSARY_SCHEMA.md
# 这条线覆盖：投资银行部（债券承销/并购/结构化融资/ABS）、金融市场部（债券/外汇/贵金属/衍生品/同业）、
# 资产管理、资产托管、金融机构部。题目按「宏观资金面 → 债券承销 → 银行经营风险 → 合规红线」排列，
# 面试时按岗位挑：承做岗重 008/009/018，交易岗重 001/002/006/015，中后台重 012/013/014。

board: 投行与金融市场线
questions:

  - id: ibfm-001
    qtype: short
    difficulty: 1
    institutions: [银行, 券商]
    tags: [货币政策, 传导, 资金面]
    question: 央行降准，对债券市场和银行分别有什么影响？
    exam_point: 量（流动性）→ 价（短端→长端）的传导链，加上两个反向力量：宽信用预期、对冲性降准
    answer: >-
      传导链分三步：第一步是量，降准释放长期低成本资金，银行超额准备金增加，
      资金面转松，DR007、R007 等短端利率下行；第二步是价，短端下行后通过
      期限溢价、配置盘需求传导到长端，收益率曲线整体下移；第三步是预期，
      降准释放稳增长信号，风险偏好可能回升。
      对银行：负债端成本下降、可用资金增加，但资产端收益率同步下行，
      息差未必改善，还要看他行竞争与信贷投放节奏。
      两个反向力量必须说：一是宽信用预期升温时，长端可能不涨反跌；
      二是对冲性降准（对冲 MLF 到期、政府债集中发行）只是补水，不必然更松。
      最后区分降准与降息：降准动的是量（基础货币与货币乘数），
      降息动的是价（资金价格），降息对银行要经过 LPR 与存款利率两段传导。
    spoken: >-
      我会分市场和银行两头讲。对债市是三步传导：降准释放长期资金、超储增加，
      资金面先松，短端利率下来；短端下来以后通过配置需求和期限溢价传到长端，
      曲线整体下移。对银行是负债成本下降、可用资金变多，但资产端收益率也在下，
      息差不一定改善。有两个反向力量必须提：一是降准往往带宽信用预期，
      风险偏好一回升长端反而不涨；二是如果是对冲性降准，只是补水，不意味着更松。
      另外降准和降息不是一回事，降准动量、降息动价，问的是哪个要分清楚。
    followups:
      - q: 为什么降准之后长端国债收益率有时反而上行？
        a: 因为降准同时释放了宽信用信号，市场预期信贷和社融回升、经济企稳，风险偏好抬升，资金从债券流向风险资产；加上前期长端已抢跑、止盈盘涌出，就会出现"降准落地即利空"的走势。判断关键看降准是"对冲型"还是"宽松型"。
      - q: 降准和降息对银行息差的影响哪个更直接？
        a: 降准更直接改善负债成本，且不直接压资产端定价；降息要先压贷款收益率（LPR），存款成本下行有粘性，所以息差通常先收窄再慢慢修复。这也是央行近年在"降息"上更谨慎的原因之一。

  - id: ibfm-002
    qtype: short
    difficulty: 3
    institutions: [银行, 券商, 公募]
    tags: [收益率曲线, 货币政策, 综合分析]
    question: 让你判断未来半年 10 年期国债收益率的走势，你会怎么分析？
    exam_point: 五因素框架（基本面/资金面/供需/外部/情绪）+ 给观点 + 给证伪条件，考的是有没有框架而不是猜对方向
    answer: >-
      用一个五因素框架，不要一上来就给方向。
      ①基本面：增长与通胀，看社融、PMI、CPI/PPI、地产与出口；
      ②资金面：货币政策取向与 DR007 中枢，看央行操作、降准降息空间；
      ③供需：利率债供给节奏（政府债发行）、配置盘力量（银行、保险、理财）；
      ④外部：中美利差与汇率约束，汇率压力会限制国内降息空间；
      ⑤情绪与机构行为：久期水平、止盈压力、理财赎回负反馈。
      给结论的句式是"我倾向 X，主要因为 A 和 B；但 C 是最大变量，
      如果 C 反转我会调整"，并给出对冲手段（国债期货、IRS、缩短久期）。
      加分点：说清自己观点的证伪条件——什么数据出来就说明我错了。
    spoken: >-
      我不会直接猜点位，我会先搭框架。第一看基本面，社融、PMI、通胀和地产出口
      决定中期方向；第二看资金面，DR007 中枢和央行操作决定短端锚；第三看供需，
      政府债供给节奏和银行保险理财的配置力量；第四看外部，中美利差和汇率会约束
      国内降息空间；第五看情绪，机构久期和止盈压力往往决定短期波动。
      然后我会给一个有条件的结论：我倾向什么方向，因为哪两条逻辑，最大的变量是哪个，
      什么信号出现我就改判断。最后说策略上怎么落地——拉久期、做曲线还是用期货对冲。
      我觉得面试官想听的不是我猜对，而是我有没有一套可以被检验的框架。
    followups:
      - q: 如果让你现在就给一个方向，你选什么？为什么？
        a: 先说清时间维度（半年）和前提，再给方向；理由必须落回框架里的两三个因素，并主动说出反方逻辑。切忌只给结论不给条件，也不要为了显得有观点而忽略估值与拥挤度。

  - id: ibfm-003
    qtype: short
    difficulty: 2
    institutions: [银行]
    tags: [净息差, 利率走廊, 存款利率]
    question: LPR 下调对银行有什么影响？银行怎么应对？
    exam_point: 资产端先下行、负债端有粘性 → 息差收窄；应对是负债降本 + 结构调整 + 非息收入
    answer: >-
      LPR 是在政策利率（7 天期逆回购利率）基础上由报价行加点形成，
      改革后成为贷款定价基准。下调的影响链条是：贷款收益率下行 → 资产端收益率
      下降快于负债端 → 净息差收窄。
      负债端刚性的原因：存款定期化、长期化，居民风险偏好下降，存款竞争，
      以及此前的"手工补息"（已被整治）。
      银行应对分三层：负债端压成本（下调存款挂牌利率、压降高息负债、提高活期占比）；
      资产端调结构（提高零售、小微、消费贷占比，但要权衡风险）；
      收入端提非息（财富管理、投行、托管、结算），从"吃息差"转向"轻资本"。
      深层逻辑：息差决定利润，利润决定内源资本补充，资本决定信贷投放能力——
      监管盯息差，本质是盯信贷供给的可持续性。
    spoken: >-
      LPR 下调对银行最直接的影响是息差收窄。资产端贷款利率先跟着 LPR 下，
      负债端存款成本是有粘性的，居民存款定期化长期化，竞争又激烈，所以成本降得慢。
      银行的应对我看三层：负债端降本，调挂牌利率、压高息负债；资产端调结构，
      多做零售小微，但要控风险；更重要的是提高非息收入占比，从吃息差转向轻资本。
      我觉得监管关注息差不是关心银行赚不赚钱，而是息差决定利润、利润决定内源资本补充、
      资本决定信贷投放能力，本质是信贷供给可持续性的问题。
    followups:
      - q: 手工补息为什么被整治？对数据有什么影响？
        a: 手工补息是挂牌利率之外通过手工方式额外付息，实质是绕开自律上限的高息揽储，抬高负债成本并诱发"存款空转"（低息贷款套高息存款）。整治后企业活期存款明显下降，把 M1 砸出一个坑，读 M1 数据时要剔除这个口径扰动。

  - id: ibfm-004
    qtype: short
    difficulty: 2
    institutions: [银行, 券商]
    tags: [汇率, 货币政策, 资金面]
    question: 中美利差和人民币汇率，对银行经营和金融市场业务有什么影响？
    exam_point: 利差 → 套息与资本流动 → 汇率压力 → 政策约束（不可能三角），再落到银行的外汇与跨境业务
    answer: >-
      链条是：中美利差（中国 10Y − 美国 10Y）走阔为负 → 套息资金外流压力上升 →
      人民币贬值压力 → 央行用中间价管理、逆周期因子、外汇风险准备金、
      离岸央票等工具稳汇率。
      对银行的影响有四块：一是外汇敞口与外币资产负债的估值波动；
      二是代客结售汇、跨境结算与企业套保需求的变化；
      三是外币融资成本与跨境融资额度管理；
      四是汇率作为货币政策的约束——"不可能三角"下，稳汇率会限制国内降息空间。
      对金融市场业务：外汇交易、债券通/互换通等跨境业务的活跃度与利差交易机会同步变化。
    spoken: >-
      中美利差走阔的直接后果是套息资金有外流压力，人民币面临贬值压力，
      央行就会用中间价、逆周期因子、外汇风险准备金这些工具稳汇率。
      对银行的影响我分四块：外汇敞口和外币资产负债的估值波动；
      代客结售汇和跨境结算、套保需求的变化；外币融资成本和跨境额度管理；
      还有一层更宏观的，汇率是货币政策的约束，稳汇率会限制国内降息空间。
      对金市业务来说，利差直接决定套息和跨境交易的活跃度，也决定债券通、互换通
      这些通道的使用强度。
    followups:
      - q: 稳汇率为什么会限制降息？
        a: 因为降息会进一步压低国内利率、扩大中美负利差，加大资本外流和汇率贬值压力。在"不可能三角"下，货币政策独立性、汇率稳定、资本自由流动三者不能兼得，所以汇率承压时央行会更依赖降准、结构性工具等"量"的手段，而不是幅度较大的"价"的手段。

  - id: ibfm-005
    qtype: short
    difficulty: 2
    institutions: [银行, 券商, 公募]
    tags: [资金面, 公开市场操作, DR007]
    question: DR007 是什么？为什么季末资金面会紧？
    exam_point: 指标定义 + 流动性分层的观察方法 + 季末紧张的四个来源
    answer: >-
      DR007 是存款类机构之间 7 天期质押式回购的加权平均利率，
      是观察银行间资金面最核心的指标，也是短期政策利率（7 天期逆回购利率）的市场锚。
      R007 则是全市场口径，R007 与 DR007 的利差反映流动性分层——
      非银机构融资相对银行更贵的程度。
      季末紧张有四个来源：①监管考核（MPA、流动性指标、LCR 等时点考核）；
      ②缴税缴准；③政府债集中发行，资金从银行体系抽走；④信贷冲量。
      这些都会消耗超储、推高资金需求。央行通过 OMO、降准、买断式逆回购、
      MLF 等工具平滑波动，所以季末利率通常"先上后下"。
    spoken: >-
      DR007 是存款类机构之间 7 天质押式回购的加权平均利率，是看银行间资金面
      最核心的指标。R007 是全市场口径，两者之差反映流动性分层，也就是非银借钱
      比银行贵多少。季末紧主要有四个原因：监管考核的时点效应、缴税缴准、
      政府债集中发行把资金从银行体系抽走、还有信贷冲量。这些都在消耗超储。
      所以通常看到季末资金先紧后松，央行会用公开市场操作、降准、买断式逆回购
      去平滑。做交易的人看资金面，其实看的就是这四个日历因素加上央行态度。
    followups:
      - q: 怎么看流动性分层？
        a: 看 R007 与 DR007 的利差：利差走阔说明非银融资难度上升、分层加剧，常见于季末、缴税期、信用风险事件后。分层加剧时，杠杆策略（尤其非银加杠杆）性价比下降，资金面稍紧就容易出现"小钱荒"式的调整。

  - id: ibfm-006
    qtype: short
    difficulty: 2
    institutions: [银行, 券商, 公募]
    tags: [久期, 凸性, 组合管理]
    question: 久期和凸性是什么？如果判断利率下行，组合怎么调？
    exam_point: 一阶与二阶敏感度 + 用 DV01 管理组合 + 牛陡/牛平的取舍
    answer: >-
      久期是债券价格对利率的一阶敏感度（修正久期），凸性是对利率的二阶敏感度。
      利率下行时拉长久期受益更大，且正凸性使大幅下行时收益更陡；
      利率上行时缩短久期，或用国债期货、IRS 对冲。
      实操上不靠"感觉拉长"，而用 DV01 管理：先算组合 DV01（利率每变动 1bp 的损益），
      再设 DV01 限额与止损线，按"对市场的判断 × 可承受回撤"决定久期暴露。
      曲线层面还要区分牛陡与牛平：如果判断短端下行更多，就加短端；
      判断长端下行更多，才拉长久期。
    spoken: >-
      久期是一阶敏感度，凸性是二阶。利率下行时拉长久期赚得更多，而且正凸性
      让大幅下行时收益更陡；反过来利率上行就要缩久期或者用国债期货、IRS 对冲。
      但我不会用"感觉"来管，我会用 DV01：先算清楚组合每变动 1bp 是多少钱，
      设好限额和止损，再根据判断决定暴露多大。还有一层是曲线，
      牛陡和牛平的做法不一样，如果判断短端下得多就加短端，只有判断长端下得多
      才真正拉长久期。我觉得面试官问这个，其实是想看你会不会把观点翻译成可度量的头寸。
    followups:
      - q: 久期和剩余期限有什么区别？
        a: 剩余期限是时间概念（本金到期还剩多久），久期是现金流加权的平均回收时间，衡量价格敏感度。零息债的久期等于剩余期限；付息债久期小于剩余期限；含权债（可赎回）要用有效久期，且可能出现负凸性。

  - id: ibfm-007
    qtype: short
    difficulty: 2
    institutions: [银行, 券商, 公募]
    tags: [信用利差, 地方债务, 化债]
    question: 信用利差是什么？给你一只城投债，你会怎么看？
    exam_point: 利差的三个补偿来源 + 城投的六层分析框架（区域/层级/化债/现金流/担保/估值）
    answer: >-
      信用利差 = 信用债收益率 − 同期限无风险利率，补偿的是三件事：
      违约风险、流动性风险、税收与资本占用（还有市场情绪）。
      城投债按六层看：①区域财力（一般公共预算收入、政府性基金收入、
      债务率、土地依赖度）；②平台层级与重要性（省级/市级/区县，
      是不是主平台、有没有被放弃的可能）；③化债政策支持
      （隐债置换、特殊再融资债、一揽子化债安排）；
      ④自身现金流与资产（有无经营性收入、应收政府款项占比）；
      ⑤担保与增信结构（担保方层级与代偿能力）；⑥估值与流动性
      （成交活跃度、机构持仓集中度）。
      核心判断是区分"政策 beta"和"个体 alpha"：同样的化债红利，
      不同区域的分配差异才是超额收益的来源。
    spoken: >-
      信用利差补偿三件事：违约风险、流动性风险、还有税收和资本占用，
      市场情绪差的时候还会额外走阔。看城投我会按六层：第一看区域，
      一般预算收入、政府性基金收入、债务率和土地依赖度；第二看平台层级和重要性，
      是省级市级还是区县，是不是主平台；第三看化债政策支持，隐债置换走到哪一步；
      第四看自身现金流和应收政府款占比；第五看担保增信；第六看估值和流动性。
      我特别看重一个区分：政策 beta 和个体 alpha。化债是普遍红利，
      但不同区域的分配不一样，超额收益来自这里。
    followups:
      - q: 信用下沉和拉久期，你选哪个？
        a: 取决于负债的稳定性。负债端不稳（理财、开放式产品）就做短久期下沉，保证流动性；负债端稳定（保险、封闭式）才考虑拉久期。两者本质是拿不同的风险溢价：下沉拿的是违约风险溢价，拉久期拿的是利率与期限溢价，不能混为一谈。

  - id: ibfm-008
    qtype: short
    difficulty: 2
    institutions: [银行, 券商]
    tags: [投行, 交易所市场, 银行间市场]
    question: 一只债券从承销到上市，完整流程是什么？
    exam_point: 银行间债务融资工具的全流程 + 各角色分工 + 两个市场的区别
    answer: >-
      以银行间市场债务融资工具为例，流程是：
      ①承揽（客户需求、额度、募集资金用途）；
      ②尽职调查（发行人资质、财务、募资用途、合规与历史处罚）；
      ③内部立项与内核（券商/银行的内核会）；
      ④报交易商协会注册（注册制，注册通知书有效期两年、可分期发行）；
      ⑤路演与询价；⑥簿记建档、定价配售（簿记管理人是核心角色）；
      ⑦登记托管（上清所/中债登）；⑧存续期信息披露与受托管理（含付息兑付）。
      角色分工：主承销商/联席主承销商、簿记管理人、存续期管理机构。
      两个市场的区别要能说清：银行间由交易商协会注册、品种是债务融资工具
      （MTN/SCP/CP/PPN/ABN）、投资者以机构为主；
      交易所由证监会/交易所审核、品种是公司债、还有个人投资者参与。
    spoken: >-
      我按银行间债务融资工具说。先承揽，确定客户、额度和募资用途；然后尽调，
      财务、法律、合规和历史处罚都要查；接着内部立项和内核；再报交易商协会注册；
      注册下来之后路演询价，然后簿记建档、定价配售，簿记管理人是最核心的角色；
      发行完登记托管在上清所或中债登；最后是存续期的信息披露和受托管理。
      角色上主承销商、联席主承销商、簿记管理人、存续期管理机构要分清。
      银行间和交易所两个市场也要能区分：注册审核机构不同、品种不同、投资者结构不同。
    followups:
      - q: 注册制下，承销商的审核重点有什么变化？
        a: 从"替监管审"转向"对自己出具的核查结论负责"：更强调尽调底稿的可追溯、信息披露的真实准确完整、募集资金用途的合规性，以及中介机构的责任边界。注册效率提高，但事后追责更重。

  - id: ibfm-009
    qtype: short
    difficulty: 2
    institutions: [银行, 券商]
    tags: [投行, 风险, 合规]
    question: 承销业务有哪些风险？怎么控制？
    exam_point: 四类风险（包销/合规/声誉/操作）+ 控制手段，考的是风险意识而不是流程背诵
    answer: >-
      四类风险：①包销风险——余额包销下未售出部分要自己持有，占用资本、
      承担市场风险与流动性风险；②合规风险——尽调不充分、信息披露违规、
      结构化发债/自融、承销尽调失职；③声誉风险——债券违约后主承销商被追责、
      影响后续业务；④操作风险——簿记、配售、文件用印等环节出错。
      控制手段：尽调底稿与内核前置、合规独立审查、分销能力与定价能力建设、
      存续期跟踪与风险预警、簿记与配售的复核机制。
      一句话总结：承销赚的是服务费，但承担的是"信用背书"的责任。
    spoken: >-
      我分四类。第一是包销风险，余额包销没卖完的部分要自己吃下来，占资本、
      担市场风险；第二是合规风险，尽调不充分、信息披露违规、结构化发债；
      第三是声誉风险，债违约了主承销商会被追责；第四是操作风险，
      簿记配售这些环节会出错。控制上，底稿和内核要前置，合规要独立审查，
      分销和定价能力是根本，存续期要持续跟踪。我理解承销赚的是服务费，
      但承担的是信用背书，所以"卖得出去"和"看得清楚"缺一不可。
    followups:
      - q: 如果一只你主承的债发行后价格大跌，你怎么处理？
        a: 先核查是否触发信息披露义务（重大事项、评级调整、发行人经营变化），按规定督促发行人披露；同时内部排查尽调是否有遗漏；对投资者做好沟通与解释，避免声誉风险扩大；必要时启动存续期风险预案（持有人会议、增信措施落实）。

  - id: ibfm-010
    qtype: short
    difficulty: 2
    institutions: [银行, 券商]
    tags: [REITs, 资产荒, 投行]
    question: 什么是 ABS？银行在 ABS 里扮演什么角色？
    exam_point: 真实出售/破产隔离 + 分层增信 + 银行的四种角色
    answer: >-
      ABS 是把缺乏流动性但有稳定现金流的资产打包，通过 SPV（信托计划/
      资产支持专项计划）实现真实出售与破产隔离，再分层（优先/次级）后发行。
      核心机制有三个：资产池的现金流重组、优先劣后的风险分层、
      以及内外部增信（差额补足、担保、超额抵押、超额利差）。
      分层不是为了消除风险，而是把风险重新分配——优先级拿稳定性，次级拿剩余收益。
      银行的角色有四种：①发起机构（信贷 ABS 的资产提供方）；
      ②主承销商/安排人（企业 ABS、ABN）；③投资人（自营与理财配置）；
      ④托管行/贷款服务机构。
      能否出表，要看是否满足终止确认条件（真实出售、风险与报酬转移）。
    spoken: >-
      ABS 本质是把有稳定现金流但不好卖的资产打包，通过 SPV 做真实出售和
      破产隔离，再分层发行。三个核心机制：资产池现金流重组、优先劣后分层、
      内外部增信。分层不是消灭风险，是把风险重新分配，优先级拿稳定、次级拿剩余。
      银行在里面有四个角色：信贷 ABS 里是发起机构；企业 ABS 和 ABN 里是主承销
      或安排人；自营和理财是投资人；还能做托管行和贷款服务机构。能不能出表
      看是否真实出售、风险和报酬是否转移。我理解 ABS 和做因子分层是一个思路：
      先分层，再定价，最后验证分层有没有真的把风险分开。
    followups:
      - q: 为什么优先级能拿到高评级？
        a: 因为现金流超额覆盖（超额抵押）、劣后级先吸收损失、以及外部增信（担保/差额补足）共同提供了缓冲。评级看的是压力情景下优先级仍能足额受偿的概率，不是资产本身资质好。

  - id: ibfm-011
    qtype: short
    difficulty: 2
    institutions: [银行]
    tags: [同业存单, 流动性, 资金面]
    question: 同业存单是什么？银行为什么要发？
    exam_point: 主动负债管理工具 + 与同业存款/大额存单的区别 + 作为货币市场定价锚
    answer: >-
      同业存单（NCD）是由存款类金融机构在银行间市场发行的、记账式、
      可转让的定期存款凭证，期限以 1M/3M/6M/9M/1Y 为主。
      银行发的动机有三：①主动负债管理——补充流动性、稳定负债来源；
      ②调节监管指标——优化 LCR/NSFR 等流动性指标的结构；
      ③定价与客户维护——给同业客户提供可交易的高流动性资产。
      与同业存款的区别：存单可转让、标准化、可质押；与大额存单的区别：
      发行主体是银行而非个人/企业客户，投资者是金融机构。
      NCD 利率反映银行同业融资成本，是货币市场的重要定价锚之一。
    spoken: >-
      同业存单是存款类银行在银行间市场发的、可转让的记账式定期存款凭证。
      银行发它主要是三个目的：主动负债，补充流动性、稳定负债来源；
      调节流动性监管指标的结构；还有就是给同业客户提供可交易的资产。
      它和同业存款比，最大区别是可转让、标准化、能质押；和大额存单比，
      发行主体和投资者都不一样，存单是金融机构之间。NCD 利率是货币市场
      很重要的定价锚，我看资金面的时候会同时看 DR007、R007 和 NCD 利率。
    followups:
      - q: NCD 利率上升说明什么？
        a: 说明银行同业融资成本上升、负债端压力加大，通常对应资金面收紧、季末考核、或银行主动扩表抢负债。若 NCD 与 DR007 利差走阔，往往意味着银行对中长期稳定负债的需求更强。

  - id: ibfm-012
    qtype: short
    difficulty: 2
    institutions: [银行]
    tags: [资本新规, 风险, 利率走廊]
    question: 交易账簿和银行账簿的利率风险有什么区别？分别怎么管？
    exam_point: 会计计量与目的不同 → 管理工具不同（DV01/止损 vs 缺口/久期/EVFTA）
    answer: >-
      区别在目的和计量：交易账簿以交易获利为目的，按公允价值计量、每日估值，
      损益直接进当期报表；银行账簿以持有收息为目的，多为摊余成本，
      损益实现时才体现。
      管理工具也不同：交易账簿用 DV01、久期、止损限额、限额授权管理；
      银行账簿用缺口分析、久期缺口、净利息收入（NII）敏感性、
      经济价值变动（EVFTA/EVE）来管理，监管依据是《银行账簿利率风险管理指引》
      与巴塞尔 IRRBB 标准。
      两块会互相传染：交易账簿亏损失控会侵蚀资本，进而压缩银行账簿的配置能力。
    spoken: >-
      核心区别是目的和计量。交易账簿是为了交易获利，公允价值计量、每天估值，
      盈亏直接进当期报表；银行账簿是为了持有收息，多数是摊余成本，
      实现了才体现。所以管理工具也不一样：交易账簿用 DV01、久期和止损限额；
      银行账簿用缺口、久期缺口、净利息收入敏感性和经济价值变动，
      监管上是 IRRBB 那一套。两块不是隔离的，交易账簿亏大了会侵蚀资本，
      资本少了银行账簿的配置能力就下降。我做过保险的 RBC，
      和银行的 IRRBB 其实是同一套利率敏感性数学。
    followups:
      - q: 为什么监管要求银行账簿也要做压力测试？
        a: 因为银行账簿占比大、期限长，利率大幅变动会显著改变经济价值与未来净利息收入，且不像交易账簿有每日市值提醒。压力测试是为了提前识别"利率冲击下资本充足率是否仍达标"，属于 IRRBB 监管的定性+定量要求。

  - id: ibfm-013
    qtype: short
    difficulty: 2
    institutions: [银行]
    tags: [流动性, 风险, 监管架构]
    question: LCR 和 NSFR 分别是什么？为什么监管看重？
    exam_point: 短期/中长期流动性指标的定义、分母构成与对业务结构的约束
    answer: >-
      LCR（流动性覆盖率）= 合格优质流动性资产（HQLA）÷ 未来 30 天净现金流出，
      要求 ≥100%，管的是短期流动性风险；
      NSFR（净稳定资金比率）= 可用稳定资金（ASF）÷ 所需稳定资金（RSF），
      要求 ≥100%，管的是中长期期限错配。
      监管看重的原因：银行的核心风险之一是期限错配（短存长贷），
      这两个指标把"压力情景下能不能扛住"量化了。
      对业务的约束很具体：LCR 要求持有足够 HQLA（利率债等高流动性资产），
      会压低资产收益率；NSFR 要求负债稳定，会抑制过度依赖同业短期融资扩表，
      推动银行吸收核心存款、发行长期债券。
    spoken: >-
      LCR 是短期指标，分子是合格优质流动性资产，分母是未来 30 天净现金流出，
      要求 100% 以上；NSFR 是中长期指标，可用稳定资金比所需稳定资金，也是 100%。
      监管看重的本质是期限错配——短存长贷是银行的商业模式，也是最大的脆弱点，
      这两个指标就是把压力情景下能不能扛住给量化了。对业务的影响很直接：
      LCR 逼你持有国债这类 HQLA，会拉低资产收益率；NSFR 逼你要稳定负债，
      不能靠同业短期资金无限扩表。所以这两个指标其实是资产负债管理的硬约束。
    followups:
      - q: 这两个指标会怎么影响银行的债券投资行为？
        a: LCR 要求持有 HQLA，利好利率债和高等级信用债的配置需求，尤其是 30 天内的流动性；同时会抑制低流动性资产（私募债、ABS 次级）的配置。NSFR 则影响负债端，长期限债券发行更有吸引力。

  - id: ibfm-014
    qtype: short
    difficulty: 2
    institutions: [银行]
    tags: [净息差, 传导, 银行间市场]
    question: FTP 是什么？它解决了什么问题？
    exam_point: 内部资金转移定价的三重作用：剥离利率风险、衡量条线利润、引导定价与资源配置
    answer: >-
      FTP（内部资金转移定价）是银行资金中心与业务部门之间转移资金的价格，
      相当于内部的"批发价"。
      它解决三个问题：①把利率风险集中到资金中心统一管理，
      业务部门只赚信用与客户的钱；②准确衡量每条业务线、每个产品、
      每个客户经理的真实利润（存贷利差要扣除 FTP 成本）；
      ③引导定价和资源配置——总行通过调整 FTP 曲线影响分行的业务倾向。
      FTP 曲线一般由无风险收益率曲线 + 流动性溢价 + 战略调整项构成，
      所以同一笔贷款在不同分行、不同产品的 FTP 可能不同。
      一句话：FTP 是总行调节业务结构的"价格杠杆"。
    spoken: >-
      FTP 是银行内部资金转移的价格，相当于内部的批发价。它解决三个问题：
      第一，把利率风险集中到资金中心，业务部门只赚信用和客户的钱；
      第二，能算清每条业务线、每个产品的真实利润，存贷利差要扣掉 FTP 成本；
      第三是引导定价和资源配置，总行调 FTP 曲线，就能影响分行愿意做什么业务。
      FTP 曲线一般是无风险曲线加流动性溢价再加战略调整项，所以同一笔贷款
      在不同分行、不同产品的价格可能不一样。我理解这就是总行定价权的体现——
      分行的动作是被 FTP 引导出来的。
    followups:
      - q: 为什么说 FTP 能防止"分行拼命放贷但不赚钱"？
        a: 因为放贷的资金要按 FTP 价格从资金中心"买入"，如果贷款利率低于 FTP + 风险成本 + 费用，这笔业务在账面上就是亏损的。FTP 把资金成本显性化，避免分行只看规模不看真实利润。

  - id: ibfm-015
    qtype: short
    difficulty: 3
    institutions: [银行, 券商]
    tags: [银行间市场, 风险, 对冲]
    question: 做市商怎么赚钱？库存风险怎么控制？
    exam_point: 价差收入+客户流量+库存损益的三段拆解，以及限额与对冲工具
    answer: >-
      做市商的收入可以拆成三块：①买卖价差收入（双边报价赚的点差）；
      ②客户流量收入（覆盖客户越多，被动成交越多，价差越稳定）；
      ③库存管理损益（持有的头寸随市场波动）。
      前两块是"能力"，库存损益是"风险敞口"。
      风险控制靠限额 + 对冲：限额包括头寸限额、DV01 限额、久期限额、
      单券集中度与止损线；对冲工具包括国债期货、利率互换（IRS）、
      债券借贷、买断式回购。
      做市的核心竞争力是报价能力和客户覆盖，不是赌方向；
      压力时期做市商还有维持流动性的义务，这是牌照的对价。
    spoken: >-
      做市商的收入我会拆三块：买卖价差、客户流量带来的被动成交、还有库存头寸的损益。
      前两块是能力，第三块是风险敞口。所以风控就是限额加对冲：头寸限额、DV01、
      久期、单券集中度、止损线，对冲用国债期货、IRS、债券借贷、买断式回购。
      我一直觉得做市的核心不是赌方向，是报价能力和客户覆盖——覆盖的客户越多，
      被动成交越多，价差越稳。另外压力时期做市商有维持流动性的义务，
      这是拿牌照的对价，不能只在好做的时候做市。
    followups:
      - q: 怎么判断一个做市团队赚的是能力还是运气？
        a: 看三点：价差收入的稳定性（不同市场环境下是否都能赚）、客户结构的分散度（是否依赖少数大客户）、以及库存损益的波动（是否靠单边押注方向）。如果利润主要来自库存方向性收益，本质是自营而不是做市。

  - id: ibfm-016
    qtype: short
    difficulty: 1
    institutions: [银行]
    tags: [合规, 投资者适当性, 职业操守]
    question: 客户要求你承诺保本保收益，或者绕开风险测评买高风险产品，你怎么办？
    exam_point: 合规红线题，考的是底线意识与替代方案能力，答错直接出局
    answer: >-
      这是红线，不能有任何模糊。三步回答：
      第一，明确告知客户这违反监管规定和行内制度，我个人没有权限、也不能操作；
      第二，理解客户的真实诉求，在合规框架内找替代方案——重新做风险测评、
      推荐适配其风险等级的产品、用分批建仓或组合配置降低波动；
      第三，如果客户坚持，上报主管和合规部门，由机构出面沟通，并保留沟通记录。
      底层逻辑：资管新规后产品不得承诺保本保收益，销售必须执行适当性管理
      （风险测评 + 双录 + 风险揭示）；短期业绩抵不上一次合规事件的代价，
      而且一旦出事，客户经理个人也要承担责任。
    spoken: >-
      这题我会直接给底线。第一，明确告诉客户这违反监管规定和行内制度，
      我没有权限也不能做；第二，理解他真正想要的是什么，在合规范围内给替代方案，
      比如重新做风险测评、换适配他风险等级的产品、或者用分批建仓降低波动；
      第三，如果他坚持，我上报主管和合规部门，由机构出面沟通，并且留痕。
      资管新规之后不能承诺保本保收益，销售必须做适当性管理，风险测评、双录、
      风险揭示一个都不能少。短期业绩抵不上一次合规事件的代价，而且出了事
      客户经理个人是要担责的。
    followups:
      - q: 如果客户说"别的银行都能做"，你怎么回应？
        a: 不做同业比较式的争论，回到规则本身：说明这是监管统一要求而非我行自设门槛，并提示违规销售的后果（合同可能被认定无效、投诉与处罚风险）。同时给出我行合规范围内能提供的替代方案，把话题引回解决问题。

  - id: ibfm-017
    qtype: single
    difficulty: 2
    institutions: [银行, 券商]
    tags: [银行间市场, 交易所市场, 债券品种]
    question: 关于我国债券市场的两个交易场所，下列说法正确的是？
    options:
      - A. 银行间市场的非金融企业债务融资工具在交易商协会注册
      - B. 公司债由交易商协会负责注册
      - C. 同业存单属于信用债，按发行人信用定价
      - D. 国债期货在银行间市场交易
    correct: [A]
    exam_point: 两个市场的注册机构、品种归属与国债期货场所，是最容易被追问的基础常识
    answer: >-
      A 正确。银行间市场的非金融企业债务融资工具（MTN/SCP/CP/PPN/ABN）
      由交易商协会注册；公司债由证监会/交易所审核，B 错；
      同业存单是存款类金融机构发行的货币市场工具，通常按银行信用与流动性定价，
      归入货币市场工具而不是信用债，C 错；国债期货在中金所交易，D 错。
      补充：银行间市场以机构投资者为主，交易所市场还有个人投资者参与；
      两个市场通过转托管、跨市场品种逐步联通。
    spoken: >-
      选 A。银行间的非金融企业债务融资工具是交易商协会注册的；公司债是证监会
      和交易所那条线，不是交易商协会；同业存单是货币市场工具，不是信用债；
      国债期货在中金所，不在银行间。这三个错误选项正好是面试最常考的混淆点，
      两个市场的注册机构、品种归属和交易场所要能一口说清。
    followups:
      - q: 两个市场是怎么联通的？
        a: 通过转托管机制、跨市场发行的品种（如部分企业债、金融债）、以及债券通等通道实现；投资者可以在符合条件的情况下跨市场交易，但托管账户和结算体系仍是两套（中债登/上清所 vs 中登）。

  - id: ibfm-018
    qtype: short
    difficulty: 3
    institutions: [银行, 券商]
    tags: [信贷分析, 授信, 投行]
    question: 给你一家企业，让你判断能不能承销它的债（或给授信），你怎么看？
    exam_point: 六层信用分析框架 + 说清"能承销"与"能投资"的区别
    answer: >-
      六层框架：①行业——周期位置、政策方向、竞争格局；
      ②经营——市场地位、客户与供应商集中度、区域分布、订单与产能；
      ③财务——收入与利润质量、经营性现金流、杠杆率、短期偿债能力、
      到期结构、或有负债与对外担保；④治理——股权结构、实控人、
      关联交易、历史违规；⑤增信——担保方层级与代偿能力、抵押物；
      ⑥区域（城投类）——财力、债务率、化债支持。
      还要区分两个问题："能不能承销"看的是信息披露与合规可行性、
      以及市场能否卖出去；"能不能投资"看的是信用风险与定价是否匹配。
      承销不等于背书，但承销商要为尽调结论负责。
    spoken: >-
      我会按六层看。第一行业，周期、政策、竞争格局；第二经营，市场地位、
      客户集中度、区域和订单；第三财务，利润质量、经营现金流、杠杆、短期偿债、
      到期结构和或有负债；第四治理，股权、实控人、关联交易、有没有历史违规；
      第五增信，担保方层级和抵押物；城投还要加一层区域财力与化债支持。
      另外我会把两个问题分开：能不能承销，看的是合规可行性和市场能不能卖出去；
      能不能投资，看的是信用风险和定价匹配不匹配。承销不等于背书，
      但承销商要对自己出的尽调结论负责。
    followups:
      - q: 如果企业财务数据很好看，但你直觉不对，怎么办？
        a: 回到现金流与报表勾稽：经营性现金流与净利润是否匹配、应收账款与收入增速是否背离、其他应收/预付是否异常、关联方资金往来是否频繁、审计意见是否标准。数据越"完美"越要做穿透核查，必要时看银行流水、纳税与用电数据交叉验证。

  - id: ibfm-019
    qtype: short
    difficulty: 2
    institutions: [银行]
    tags: [投行, 职业素养, 自我介绍]
    question: 你了解银行的「投行与金融市场」条线吗？为什么想来做这块？
    exam_point: 条线边界（投行部/金市部/资管/托管/金融机构部）+ 个人能力与业务语言的对应关系
    answer: >-
      这条线大致包含：投资银行部（债券承销、并购、结构化融资、ABS）、
      金融市场部（债券投资与交易、外汇、贵金属、衍生品、同业与流动性）、
      资产管理/理财、资产托管、金融机构部（同业客户经营）。
      它和券商投行的区别：银行是"商行 + 投行"，既有承销牌照，
      又有资产负债表和客户基础，能提供"承销 + 投资 + 托管 + 结算"的一揽子方案。
      我为什么来：三句话——
      ①我的能力是统计建模与利率、信用分析，这条线是银行里"模型离钱最近"的地方；
      ②我做过负债端与监管报表（保险 RBC/IFRS17），懂久期和利率敏感性，
      对金市和资产负债管理是直接可用的；
      ③我想做的是"既懂定价、又懂客户与产品"的人，这条线能给完整的业务链条。
    spoken: >-
      这条线我理解包括五块：投资银行部做债券承销、并购、结构化融资和 ABS；
      金融市场部做债券、外汇、贵金属、衍生品和同业流动性；
      再加上资产管理、资产托管和金融机构部。它和券商投行最大的区别是
      "商行加投行"，银行有自己的资产负债表和客户基础，能做承销加投资加托管
      加结算的一揽子方案。我为什么来，三句话：我的能力是统计建模和利率信用分析，
      这里模型离钱最近；我做过负债端和监管报表，懂久期和利率敏感性；
      我想成为既懂定价又懂客户和产品的人，这条线的业务链条最完整。
    followups:
      - q: 如果只能去一个部门，你选哪个？
        a: 先表达偏好（按自己的经历选，通常承做选投行部、交易选金市部），再补一句"轮岗去哪个部门我都接受，前两年在分行把客户和资产质量摸清楚，对做承做和交易都是加分"——既给判断，也不给条件。

  - id: ibfm-020
    qtype: short
    difficulty: 2
    institutions: [银行, 券商]
    tags: [低利率, 净息差, 组合管理]
    question: 低利率环境下，银行的资产负债管理面临什么挑战？怎么应对？
    exam_point: 资产端收益率下行 + 负债端刚性的"两头挤"，以及四条应对路径
    answer: >-
      挑战是"两头挤"：资产端，贷款利率与债券收益率下行，重定价快；
      负债端，存款成本下行慢、定期化长期化，息差持续收窄；
      同时低利率环境下长久期资产估值波动加大，银行账簿利率风险上升。
      应对四条路：①负债端——压降高息负债、提高核心存款占比、
      用好存款利率市场化调整机制；②资产端——优化结构（零售、小微、
      高等级信用债与久期管理），并用衍生品对冲利率风险；
      ③收入端——提高非息收入占比（财富管理、托管、投行、结算），
      从"吃息差"转向"轻资本"；④资本端——精细化资本管理，
      发展资本占用低的业务。
      一句话：低利率不是周期问题而是长期环境，银行必须换盈利模式。
    spoken: >-
      低利率下银行是两头挤。资产端贷款利率和债券收益率都在下，而且重定价快；
      负债端存款成本下得慢，还定期化长期化，息差就一直收窄。同时长久期资产
      估值波动变大，银行账簿利率风险上升。应对我看四条：负债端压高息负债、
      提高核心存款；资产端调结构，做零售小微，同时用衍生品对冲利率风险；
      收入端提高非息占比，财富管理、托管、投行这些轻资本业务；
      资本端做精细化，少占用资本。我的判断是低利率不是短期周期，
      是长期环境，所以银行必须换盈利模式，不是等利率回去。
    followups:
      - q: 低利率对保险和银行的影响有什么不同？
        a: 银行是短久期负债、重定价快，息差先受压但可调整结构；保险是长久期负债、刚性成本，低利率会造成"利差损"和准备金上升，压力更持久。所以保险更依赖长久期资产与权益配置，银行更依赖负债成本管理与轻资本转型。
