# 面试方法与群面（无领导 / 辩论 / 压力题）
# schema 见 docs/GLOSSARY_SCHEMA.md
# 这一组不是知识题，是「怎么答」的方法题：题干是真实考场情境，answer 给框架，
# spoken 是可以直接背下来说出口的话术。银行群面（无领导/对抗辩论）近年在股份行、
# 建行、交行、中信、浦发、民生、城商行普遍加码，这组题和 07 的条线知识题配套用。

board: 面试方法与群面
questions:

  - id: iv-001
    qtype: case
    difficulty: 2
    institutions: [银行, 券商, 公募]
    tags: [无领导, 面试方法, 情景题]
    question: 【无领导·排序题】给 7 条措施按重要性排序，只有 20 分钟，你会怎么切入？
    exam_point: 先定判准、再分类、再排序、最后说清"不选的理由"——评委听的是取舍逻辑
    answer: >-
      第一步，30 秒内判断题型并抢"定判准"这句话。排序题的判准通常是
      "对目标的边际贡献 × 紧迫性 ÷ 实施成本"，一句话说清，让全组用同一把尺子。
      第二步，先分类再排序：把 7 项按"底层基础 / 核心能力 / 制度保障"
      或"短期 / 中期 / 长期"分成 2–3 组，先排类间顺序，再排类内顺序。
      第三步，每项给一句固定句式的理由："这一项解决的是 ×× 问题，
      如果不做会导致 ×× 后果"。
      第四步，必须给出"不选/靠后"的理由——这是评委区分"有判断"和"报菜名"的关键。
      收口时复述一致意见，主动推举总结人并把手里的要点交给他。
    spoken: >-
      我建议我们先花两分钟定评判标准，再讨论排序，最后五分钟收口。
      这个题问的是"最重要"，我理解判准是对目标的边际贡献乘以紧迫性、再除以实施成本，
      大家看用这个标准可不可以。定完标准我建议先分类：哪些是底层基础，
      哪些是核心能力，哪些是制度保障；先排类与类的先后，再排类内。
      每一项我用一句话说理由——它解决什么问题、不做会怎样。
      另外我会明确说哪些项我放在后面，以及为什么，这样我们的排序才是有逻辑的，
      不是拍脑袋的。最后我们留三分钟复述结论，推一位同学总结，我把要点整理给他。
    followups:
      - q: 如果组里已经有人抢了 Leader，你怎么办？
        a: 不硬抢位置，改抢"判准"和"时间"这两件更具体的事：提出比较标准、提醒剩余时间、在分歧时做归纳。评委记分看的是行为，不是头衔；抢框架和时间的人拿分往往比挂名 Leader 稳。

  - id: iv-002
    qtype: case
    difficulty: 2
    institutions: [银行, 券商, 公募]
    tags: [无领导, 面试方法, 情景题]
    question: 【无领导·方案题】让你设计一套方案（如养老金融、适老化 App、绿色金融产品），怎么搭框架？
    exam_point: 目标—人群—痛点—四层方案—成本与 KPI—风险，六段式；再加一个有记忆点的产品名
    answer: >-
      六段式框架：
      ①目标：一句话说清要解决什么、成功标准是什么；
      ②人群与场景：服务谁、在什么场景下用；
      ③痛点：现有方案为什么不够（这是方案的价值来源）；
      ④方案四层：产品（提供什么）、渠道（怎么触达）、权益（凭什么留下）、
      风控合规（哪里会出事）；
      ⑤成本与 KPI：获客成本、投入产出、用哪两个指标衡量成功；
      ⑥风险与退出：什么情况下收缩、什么信号说明做错了。
      加分动作：给方案起一个一句话的产品名（如"碳挂钩贷款""长辈模式"），
      有记忆点，评委容易记住你们组。
    spoken: >-
      我建议按六段来搭：第一目标，一句话说清解决什么问题、怎么算成功；
      第二人群和场景，服务谁、在什么场景用；第三痛点，现有方案为什么不够；
      第四方案本身，我建议分四层——产品、渠道、权益、风控合规，
      这样既有内容也不漏掉风险；第五成本和 KPI，获客成本多少、用哪两个指标衡量；
      第六风险和退出机制，什么情况收缩。最后我们可以给方案起一个名字，
      一句话能说清，评委记得住。时间上我建议十分钟把四层填满，五分钟补成本和风险，
      最后五分钟收口。
    followups:
      - q: 方案题最容易丢分的地方是什么？
        a: 只堆想法、不给成本和风险。银行面试官天然看风险和合规，方案里没有"哪里会出事、怎么兜底"，会被认为不懂业务；另外没有 KPI 就无法判断方案是否值得做。

  - id: iv-003
    qtype: case
    difficulty: 3
    institutions: [银行, 券商]
    tags: [辩论, 无领导, 面试方法]
    question: 【对抗式辩论】4v4，辩题是"是否应该取消无卡取款"，你怎么立论和打自由辩论？
    exam_point: 定义 → 判准 → 论点（观点+机制+例子）；自由辩论三招：要定义、要成本、极端化反例；组内先分工
    answer: >-
      立论三步：①定义边界——先框住关键词（"取消"指停止该功能，不等于停止现金服务）；
      ②给判准——"判断该不该，我们看三条：安全性、普惠性、成本收益"；
      ③给论点——2–3 个，每个都是"观点 + 机制 + 例子"。
      自由辩论三招：①要定义（"对方把 X 定义成 Y，那 Z 算不算 X？"）；
      ②要成本（"对方只说好处，没说成本由谁承担、由谁买单"）；
      ③极端化反例（"按对方逻辑推下去，A 也成立，但 A 显然不合理"）。
      结辩四段：承认对方一个合理点 → 指出其前提不成立（2 点）→ 回到我方判准（2 点）
      → 一句价值升华。
      组内纪律：开场两分钟分工（1 辩立论 / 2 辩质询 / 3 辩数据 / 4 辩结辩），
      绝不内讧，队友说错用"我补充一下"接，给队友递话。
    spoken: >-
      我会先立定义和判准。今天讨论"取消无卡取款"，取消的是这个功能，不是取消现金服务；
      判断该不该，我们看三条：安全性、普惠性、成本收益。然后我方三个论点：
      第一，无卡取款是电诈资金转移的高频通道，链条长、追损难；
      第二，这个功能的设备改造和运维成本高、使用频次低；
      第三，手机银行转账和扫码支付已经覆盖绝大多数场景。
      自由辩论时我会抓两点：对方说安全，我就问成本由谁承担、由谁买单；
      对方举老人和境外人士，我就问限额加人脸加延时到账能不能把风险压到可接受。
      结辩我先承认对方对普惠的关切是合理的，再指出他们的前提是把风险和功能绑定，
      而风险是可以用制度和技术管理的，最后回到我们的判准。
    followups:
      - q: 如果队友的观点明显有问题，你会当场纠正吗？
        a: 不会当场纠正人格或逻辑硬伤，会用"我补充一下"把话题往有利方向带，或者在递话时给他一个更好用的论据。对抗式群面里内讧比观点错更致命，评委看的是团队协作。

  - id: iv-004
    qtype: case
    difficulty: 3
    institutions: [银行, 券商]
    tags: [无领导, 面试方法, 情景题]
    question: 【无领导·游戏题】每人拿到信息不完全的牌/资源，全组总和要接近目标分，怎么打？
    exam_point: 目标是集体最优而非个人最优；核心动作是公开私有信息、建立统一计算口径、有人记账
    answer: >-
      这类题考的不是"赢"，是"信息整合与协作"，所以不要抢着出大牌。
      三步：①先把各自"确定知道的信息"公开，建立共同的计算口径；
      ②有一个人做记录与累加（这是最容易拿分的角色，也是数字能力的主场）；
      ③每轮结束前公布"现在总和是多少、还差多少、建议下一轮怎么出"。
      关键判断：目标函数是什么、有没有上下限、别人的信息牌可能是什么，
      以及"为了集体最优，我这一手要出大还是出小"。
      最后主动把结论讲清楚：我们是怎么算到这个总和的，剩下几轮怎么保证不爆掉。
    spoken: >-
      这个题的关键不是谁出得多，是我们能不能把各自知道的信息拼起来，
      算出一个共同的目标区间。我建议先花两分钟让每个人把"确定知道的信息"说出来，
      我来做记录和累加，然后我们再决定出牌顺序。目标不是个人出得漂亮，
      是总和最接近目标分。每一轮结束前我会报一次账：现在总和多少、离目标还差多少、
      建议下一轮怎么出。最后收口的时候我把计算过程讲清楚，
      说明我们是怎么保证既有机会接近目标又不会爆掉的。
    followups:
      - q: 如果组里有人一直抢着出牌、导致总和偏离怎么办？
        a: 不指责人，用数据说话："现在总和已经到 X，再出大牌会超过目标，建议这轮出小"。把争论从"谁对"转成"账怎么算"，通常对方会接受，因为他也不想集体失败。

  - id: iv-005
    qtype: case
    difficulty: 3
    institutions: [银行, 券商, 公募]
    tags: [无领导, 面试方法, 行为面试]
    question: 【群面后追问】"刚才谁表现最好、谁最差？""你为什么妥协？""你发言不多？"怎么答？
    exam_point: 送命题三连：给结论但不伤人、承认事实但不认输、把"弱"落到可改进的行为上
    answer: >-
      第一题"谁最好/谁最差"：最好的要选一个"推动进程"的人，说具体行为
      （搭框架、控时间、拉回跑题、给沉默的人递话）；最差的绝不评价人格，
      说"某位同学观点不错，但表达时机稍晚、没展开"，再补一句
      "小组里角色不同，分工本来互补"。
      第二题"为什么妥协"：不要答"为了团队"，那等于没判断。答"我听完发现他的角度
      更贴合题目场景，继续僵持会消耗讨论时间；但如果是原则性分歧，我会拿论据坚持"。
      第三题"为什么发言少"：先承认事实，再补充价值——"我把注意力放在听和记录分歧上，
      我在某个节点提的框架被小组采纳了；如果再来一次，我会更快把记录的信息说出来"。
    spoken: >-
      表现最好我会选那位搭框架、控时间的同学，因为他在第几分钟把大家的观点归了类，
      还把我们拉回过主线。表现相对弱的那位，我觉得他观点其实有内容，
      只是表达时机稍晚、没有展开，小组里角色本来就互补，我不觉得是能力问题。
      至于我为什么妥协，不是单纯为了团队——我听完发现他的角度更贴合题目的业务场景，
      再僵持会消耗时间，所以我接受了他的合理部分；但如果是原则性分歧，
      我会拿论据坚持。发言少这点我承认，我把注意力放在听和记录分歧上了，
      我提的"先定标准再排序"被采纳了，如果再来一次我会更快把信息说出来。
    followups:
      - q: 为什么面试官爱问"谁最差"？
        a: 在看三件事：你会不会为了拿分踩别人、你的评价有没有依据（说的是行为还是人格）、以及你有没有团队意识。所以答案的结构永远是"具体行为 + 可改进的表达方式 + 角色互补"，而不是排名。

  - id: iv-006
    qtype: short
    difficulty: 2
    institutions: [银行, 券商, 公募]
    tags: [行为面试, 面试方法, 职业素养]
    question: 【压力题】"你为什么之前没有相关实习？""你为什么不做本专业？"怎么答？
    exam_point: 不辩解、不甩锅：承认短板 → 说明可迁移能力 → 给出已经做过的补课动作
    answer: >-
      Q1"为什么没有相关实习"：先承认（"这是我的短板，我不回避"），
      再说已做的补课（自学业务知识、做过的项目、请教学长学姐了解真实工作内容），
      最后说"入职后要补的是业务链条和客户感，这只能在岗上学，我愿意从轮岗开始补"。
      Q2"为什么不做本专业"：不要说本专业不好、也不要说"考不上"，
      讲"方向差异"——本专业训练给了我什么能力（逻辑、建模、风险意识），
      而我更想让这套能力落在真实的定价与客户决策上，所以选择这条线。
      通用原则：压力题的评分点是"情绪稳定 + 有判断 + 有行动"，不是"理由多完美"。
    spoken: >-
      第一题我会直接承认，这是我的短板，我不回避。但我做了三件事补：
      一是系统看业务和监管指标，二是用项目把能力练出来，三是请教学长学姐把日常工作问清楚，
      不是靠想象。我知道入职后要补的是业务链条和客户感，这个只能在岗上学，
      我愿意从轮岗开始补。
      第二题我不会说本专业不好。本专业给我的训练是逻辑、建模和风险意识，
      这套能力我很珍惜；但我更想让它落在真实的定价和客户决策上，
      所以选择这条线，这是方向差异，不是退而求其次。
    followups:
      - q: 如果面试官继续追问"那你前几年是不是白学了"？
        a: 不要被激怒，也别顺着否定自己。用"能力迁移"回答：具体说清本专业训练出的哪两项能力在目标岗位的哪个环节能直接用（例如建模用于定价、风险意识用于合规），并给一个已发生的例子。

  - id: iv-007
    qtype: short
    difficulty: 2
    institutions: [银行]
    tags: [行为面试, 职业素养, 面试方法]
    question: 【动机题】"接受调剂吗？""轮岗去不了你想去的部门怎么办？"怎么答？
    exam_point: 三层结构：无条件接受 → 说明轮岗对目标岗位的具体价值 → 给长期路径，绝不在面试里提条件
    answer: >-
      第一层，无条件接受（不要加"但是"）："可以接受，报考时就做好了从基层做起的准备。"
      第二层，说明轮岗的具体价值：分行轮岗能接触真实客户与资产质量，
      对以后做承做、做交易都是加分——"不懂客户和资产的人做交易，只会做模型"。
      第三层，给长期路径：不承诺"两年后我要回总行"，而是说
      "我希望成为既懂定价又懂客户与产品的人，轮岗是这条路径的第一步"。
      如果被问"去不了最想去的部门怎么办"：先做出成果，再通过内部竞聘或转岗争取，
      不用"没去成"当成不投入的理由。
    spoken: >-
      可以接受，我报考的时候就做好了从基层做起的准备。我理解轮岗不是想去哪去哪，
      是从分行的业务链条开始打底，能接触真实客户和真实资产质量，
      这对以后做承做或者做交易只有好处——不懂客户和资产的人做交易，只会做模型。
      如果最后没去成我最想去的部门，我会先在现有岗位上做出成果，
      再通过内部竞聘或者转岗去争取，不会用没去成当成不投入的理由。
      我关心的不是头两年在哪个部门，而是五年后我是不是既懂定价又懂客户。
    followups:
      - q: 如果面试官说"我们这儿可能要坐柜两年"，你怎麼接？
        a: 先接住（"可以，我理解柜面是理解业务和客户的必经阶段"），再说价值（"柜面能直接看到客户需求和风险点"），最后给方向（"业务熟练后根据行里需要和自己的特长往客户经营或专业条线走"）。不要说"只做一年就想转岗"，也不要说"能做一辈子"。

  - id: iv-008
    qtype: short
    difficulty: 1
    institutions: [银行, 券商, 公募]
    tags: [自我介绍, 面试方法, 行为面试]
    question: 【一面】1 分钟自我介绍 + 2 分钟时事热点陈述，怎么搭结构？
    exam_point: 自我介绍四段式（基本信息→能力标签→匹配经历→动机）；热点四步（定性→机制→影响→落到岗位）
    answer: >-
      1 分钟自我介绍四段：①基本信息 10 秒（姓名、学校、专业、毕业时间）；
      ②能力标签 20 秒（2–3 个关键词，每个配一句经历佐证）；
      ③匹配经历 25 秒（挑一段最相关的，STAR 讲到结果）；
      ④动机 15 秒（为什么这个行业、这家机构、这个岗位）。
      要点：不要念简历、不要堆奖状、超时会被打断，掐到 50 秒。
      2 分钟热点陈述四步：①一句话定性（10 秒）；②机制/原因（40 秒，2 点）；
      ③影响与风险（30 秒，分主体：个人/机构/监管）；④落到本行业 + 一句自己的判断（30 秒）。
    spoken: >-
      自我介绍我会控制在五十秒：先一句话讲清我是谁、什么时候毕业；
      然后用两到三个关键词概括自己，每个配一句经历；接着挑一段最相关的经历，
      用情境、任务、动作、结果讲完；最后一句落到我为什么来这个岗位。
      热点陈述我用四步：先用一句话给判断，再讲两点原因和机制，
      然后说影响和风险、分个人机构监管三层，最后落回银行业和我自己的判断。
      我的原则是——热点题不是考我知道多少新闻，是考我能不能两分钟讲出一个有结构的观点。
    followups:
      - q: 英文自我介绍要注意什么？
        a: 不求难词、求听得懂：短句为主，结构同中文版，控制在 45 秒；提前练到不卡壳。面试官对英文的要求通常是"能沟通"，不是"母语级"，卡顿比词汇简单更减分。

  - id: iv-009
    qtype: case
    difficulty: 3
    institutions: [银行, 券商]
    tags: [面试方法, 情景题, 投行]
    question: 【终面】晚上 8 点发课题、次日早 6 点前交，7 分钟 PPT 展示，12 小时怎么安排？
    exam_point: 结构 > 深度、完成度 > 完美；先定结论再找证据；留 1 小时 buffer
    answer: >-
      时间切分：20:00–20:30 读题定"一句话结论"；20:30–21:00 搭 10 页目录
      （空着内容先定结构）；21:00–01:00 找数据、做测算、出 4–5 张图；
      01:00–03:00 填内容、写结论页；03:00–04:30 打磨图表、砍掉一半文字；
      04:30–05:30 出声演练 3 遍、掐 7 分钟；05:30–06:00 导出、检查、发送（留 buffer）。
      10 页骨架：封面（含一句话结论）、结论摘要、问题定义与框架、
      背景数据、核心分析①、核心分析②（含敏感性/情景）、方案或判断、
      风险与情景、落地路径、附录（数据来源与假设）。
      评分点：面试官往往不问内容，重点看 PPT 框架、内容充实度、演讲自信。
    spoken: >-
      我会把十二小时切成五段，关键是先定结论再找证据，不能边找资料边想观点。
      前半小时读题、定一句话结论；接着半小时搭十页目录，先结构后内容；
      然后用四小时找数据做测算；再用两小时填内容；剩下时间打磨、演练、留一小时 buffer。
      十页里我认为最加分的是"风险与情景"那一页——如果变量反过来会怎样，
      以及附录里写清数据来源和假设。展示的时候七分钟讲三件事：
      结论是什么、为什么、怎么落地，不要念 PPT。
    followups:
      - q: 数据找不到怎么办？
        a: 用公开可得的替代指标并明确标注假设，比编数据安全得多；把"数据缺口"写进附录并说明它会如何影响结论。面试官看的是分析框架和诚实度，不是数据完备度。

  - id: iv-010
    qtype: case
    difficulty: 2
    institutions: [银行, 券商, 公募]
    tags: [面试方法, 自我介绍, 情景题]
    question: 【即兴演讲】抽题后 1 分钟准备、1 分 30 秒作答，怎么破题？
    exam_point: 观点—解释—举例—总结四步；先判立场（正面/负面/中立），再套母题素材
    answer: >-
      四步法：①观点（10 秒，先给一句明确判断）；
      ②解释（40 秒，两点机制或原因）；
      ③举例（20 秒，一个具体例子或数据）；
      ④总结（20 秒，回扣到行业/岗位/自己）。
      准备阶段做两件事：判断题目立场（正面/负面/中立/辩证），
      然后从 5–8 个"母题素材"里找最接近的一个（服务、创新、坚持、客户至上、
      风险与效率、长期主义）。
      高频题源：AI 与银行、5G/数字化、互联网金融、绿色金融、养老金融、
      文化传承与金融服务。技巧：陌生题不要硬讲深度，先保证"有结构、能自圆其说"。
    spoken: >-
      我会用四步：先给一句明确判断，再用两点讲原因和机制，然后给一个具体例子或者数据，
      最后回扣到行业、岗位和我自己。准备的一分钟里我只做两件事：
      判断这个题目要我站正面、负面还是辩证，然后从准备好的几个母题里找最接近的——
      服务、创新、坚持、客户至上、风险与效率。我的原则是陌生题不硬讲深度，
      先把结构讲完整、能自圆其说，比讲得深但讲散了得分高。
    followups:
      - q: 抽到一个完全没听过的题怎么办？
        a: 用"定义—判断—展开"兜底：先用一句话把这个概念翻译成自己熟悉的说法，再给判断，再从"对个人/对机构/对监管"三层展开。不要沉默超过 5 秒，也不要一上来就说"我没准备过"。
