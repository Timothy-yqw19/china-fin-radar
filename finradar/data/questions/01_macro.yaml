board: 宏观与货币政策
questions:

  - id: macro-001
    qtype: short
    difficulty: 1
    institutions: [券商, 公募, 银行]
    tags: [货币政策, 基调]
    question: 我国货币政策的基调有哪几档？当前是哪一档？什么时候变的？
    exam_point: 五档基调排序 + 2024年12月转向时点 + 上一次"适度宽松"的历史背景
    answer: >-
      五档：宽松、适度宽松、稳健、适度从紧、从紧。当前为"适度宽松"，
      由2024年12月中央政治局会议和中央经济工作会议确定，是自2011年以来
      首次离开"稳健"。上一次使用"适度宽松"是2008年11月至2010年，
      为应对国际金融危机。2026年延续该基调，并新增"灵活高效运用降准降息
      等工具""促进物价合理回升"的表述，社会综合融资成本表述由"稳中有降"
      调整为"低位运行"。
    spoken: >-
      基调一共五档，从松到紧是宽松、适度宽松、稳健、适度从紧、从紧。
      现在是第二档"适度宽松"，2024年12月中央经济工作会议定的，这是
      2011年以来第一次离开"稳健"，上一次用这个提法还是2008年应对金融危机。
      2026年继续沿用，但表述更精细了：融资成本从"稳中有降"改成"低位运行"，
      而且第一次把"促进物价合理回升"写成货币政策的重要考量。
    followups:
      - q: 为什么把物价写进货币政策考量？
        a: 名义利率减通胀才是实际利率。GDP平减指数长期为负时，实际融资成本偏高，货币政策需要一个反通缩的锚。
      - q: 基调变了，操作上有什么具体体现？
        a: 降准降息的频次与幅度、结构性工具的创设与扩容、政府债券发行期间的流动性配合、以及对存款利率下调的引导。

  - id: macro-002
    qtype: short
    difficulty: 2
    institutions: [券商, 银行]
    tags: [政策利率, 利率走廊, 传导]
    question: 现在说"央行降息"，降的是哪个利率？完整的传导链是什么？
    exam_point: 7天期逆回购是主要政策利率（2024年确立），MLF已淡化政策利率属性
    answer: >-
      降的是公开市场7天期逆回购操作利率。2024年做了两项改革确立该体系：
      7月起OMO由利率招标改为固定利率、数量招标，使政策利率信号更明确；
      MLF改为多重价位中标，淡化其政策利率属性、回归中期流动性工具。
      利率走廊上限为SLF利率、下限为超额存款准备金利率。
      传导链：7天逆回购利率 → DR007 → 同业存单与短端国债 →
      LPR（20家报价行在7天逆回购利率基础上加点，每月20日9:00公布）→
      贷款利率；存款端通过"存款利率市场化调整机制"参考10年期国债收益率
      和1年期LPR调整。
    spoken: >-
      现在讲降息，指的是下调7天期逆回购利率，它才是主要政策利率。
      2024年做了两件事把这个体系立起来：7月把公开市场操作从利率招标改成
      固定利率、数量招标，让政策利率信号不被投标行为干扰；同时把MLF改成
      多重价位中标，淡化它的政策利率属性。传导上是7天逆回购到DR007，
      再到同业存单和短端国债，然后LPR在7天逆回购基础上加点形成，
      最后到贷款利率；存款端是通过存款利率市场化调整机制，参考10年期
      国债和1年期LPR来调。判断松紧我会同时看政策利率水平和DR007相对
      政策利率的偏离。
    followups:
      - q: DR007 和 R007 的区别？
        a: DR007是存款类机构以利率债质押的7天回购利率，反映银行体系流动性；R007覆盖全市场含非银，包含信用与分层溢价。二者利差扩大说明非银流动性分层。
      - q: 为什么会出现"降息但LPR不动"？
        a: LPR = 政策利率 + 加点，加点反映银行资金成本与风险溢价。净息差压到极限时银行缺乏让利空间，所以要先推动存款利率下行、整治手工补息，才能打开LPR下调空间。

  - id: macro-003
    qtype: multi
    difficulty: 2
    institutions: [券商, 银行]
    tags: [中央银行制度, 十五五]
    question: 关于《中国人民银行"十五五"改革发展规划》（2026年8月印发），下列表述正确的有？
    options:
      - A. 提出加快完善中央银行制度、健全中国特色现代货币政策框架
      - B. 推动调控方式从数量型为主转向价格型为主
      - C. 提出建设债券市场‘科技板’
      - D. 明确取消存款准备金制度
    correct: [A, B, C]
    exam_point: 央行"十五五"规划的核心提法；D为杜撰，存款准备金制度并未取消
    answer: >-
      A、B、C正确。规划主线是加快建设金融强国、加快完善中央银行制度，
      具体包括：健全中国特色现代货币政策框架、完善基础货币投放机制、
      健全市场化利率形成调控和传导机制（从数量调控向价格调控转变）；
      建立货币政策与宏观审慎"双支柱"，拓展宏观审慎管理覆盖范围；
      构建科技金融体制、推进债券市场"科技板"建设；推进人民币国际化与
      离岸人民币市场发展。D项错误，存款准备金仍是基础货币管理工具。
    spoken: >-
      央行"十五五"规划2026年8月印发，核心是"加快完善中央银行制度"。
      我抓三条：第一，货币政策框架从数量调控转向价格调控，淡化M2和社融
      增速目标，把7天逆回购确立为主要政策利率；第二，做实宏观审慎这个
      第二支柱，拓展覆盖范围、丰富工具；第三，服务实体上提出构建科技
      金融体制、建设债券市场"科技板"。此外还有汇率坚持市场决定性作用、
      推进人民币国际化和离岸市场。
    followups:
      - q: 什么是"双支柱"？
        a: 货币政策 + 宏观审慎管理。货币政策管总量与价格（对应通胀与增长），宏观审慎管顺周期性与跨市场传染（对应金融稳定），2008年危机后成为国际共识。

  - id: macro-004
    qtype: short
    difficulty: 2
    institutions: [券商, 银行]
    tags: [结构性工具, 再贷款]
    question: 结构性货币政策工具是什么？举三个例子并说明运作机制。它能替代总量宽松吗？
    exam_point: “先贷后借”报销机制；总量与结构双重功能；局限性
    answer: >-
      结构性工具以再贷款、再贴现为载体，向特定领域提供低成本、有期限的
      定向资金。运作机制是"先贷后借"：金融机构先按政策要求投放贷款，
      再向央行申请等额低成本资金，央行按一定比例报销，资金不直接投给企业。
      例子：长期性的支农支小再贷款与再贴现；阶段性的碳减排支持工具、
      科技创新和技术改造再贷款、保障性住房再贷款；资本市场专用的
      证券基金保险公司互换便利（SFISF）和股票回购增持再贷款（2024年10月创设）。
      它不能替代总量宽松：只能改变资金的价格与投向，改变不了融资需求本身；
      若企业缺乏扩产意愿，再低的资金成本也难以形成有效信贷。
    spoken: >-
      结构性工具本质是再贷款，机制叫"先贷后借"——银行先按要求把贷款投出去，
      再拿凭证向央行申请等额低成本资金，央行按比例报销。分三类：长期的
      支农支小再贷款和再贴现；阶段性的碳减排支持工具、科技创新和技术改造
      再贷款、保障性住房再贷款；还有2024年10月给资本市场创设的互换便利
      和股票回购增持再贷款。它解决的是总量宽松传导不到重点领域的问题，
      但替代不了总量宽松，因为它改变的是资金的价格和方向，改变不了融资
      需求本身。
    followups:
      - q: SFISF 会不会扩大基础货币？
        a: 不会。它是"以券换券"——非银机构用债券、股票ETF、沪深300成分股质押，换入国债或央票，再到市场融资，理论上不直接投放基础货币。

  - id: macro-005
    qtype: short
    difficulty: 3
    institutions: [券商, 银行]
    tags: [社融, M1, M2]
    question: 社融、M2、M1 分别衡量什么？为什么会出现"M1 与 M2 剪刀差"？2024年M1口径做了什么调整？
    exam_point: 三个指标的统计视角差异；剪刀差的经济含义；2024年M1口径修订
    answer: >-
      社融是从"实体经济获得资金"的角度统计，包含表内贷款、表外融资、
      直接融资和政府债券；M2从"金融机构负债端"统计广义货币；
      M1是流通中现金加单位活期存款（口径调整前），反映资金活化程度。
      M1-M2剪刀差为负且走阔，通常意味着资金"趴在定期账户"、企业投资
      与交易意愿弱、经济活跃度下降。2024年12月起M1统计口径修订，
      纳入个人活期存款和非银行支付机构客户备付金，使口径更贴近实际
      支付能力，与国际可比。另外2024年整治"手工补息"导致企业活期存款
      大幅下降，是解读当年M1数据时必须提示的口径扰动。
    spoken: >-
      三个指标视角不同：社融看的是实体从金融体系拿到多少钱，M2看的是
      金融机构负债端的广义货币，M1反映的是资金活化程度。M1和M2的剪刀差
      走阔为负，一般说明钱趴在定期存款里，企业不投资、交易不活跃。
      两个细节要注意：一是2024年12月起M1口径修订，把个人活期存款和
      非银支付机构备付金纳进来，更贴近真实支付能力；二是2024年整治
      手工补息，企业活期存款大幅搬家，把M1砸出一个坑，这是口径扰动
      不是纯粹的经济信号，读数据的时候必须剔除。
    followups:
      - q: 社融和信贷背离说明什么？
        a: 常见于政府债券大量发行的时期——社融被政府债拉高，但企业信贷需求疲弱。这说明加杠杆主体是政府而非企业，是典型的"财政发力、私人部门收缩"格局。

  - id: macro-006
    qtype: short
    difficulty: 2
    institutions: [券商, 公募, 银行]
    tags: [五篇大文章, 科技金融]
    question: 请说出金融"五篇大文章"，并说明它们之间的内在关系，以及科技金融最核心的难点。
    exam_point: 五篇的准确名称与顺序；不是并列口号而是结构；科技金融的风险收益错配
    answer: >-
      科技金融、绿色金融、普惠金融、养老金融、数字金融。
      源自2023年10月中央金融工作会议，2025年3月《国务院办公厅关于做好
      金融"五篇大文章"的指导意见》（国办发〔2025〕8号）做出系统部署。
      内在关系：科技金融培育新动能，绿色金融推动存量转型，普惠金融补
      短板，养老金融应对人口结构变化，数字金融是前四篇共用的基础设施。
      科技金融最核心的难点是风险收益不匹配：科技企业轻资产、高失败率、
      收益呈幂律分布，而信贷是固定收益、需覆盖尾部风险的模式，用债权
      工具承担股权风险必然亏损。解决路径是引入股权工具（银行AIC股权
      投资试点、险资长期投资试点）、债券市场分层（科创债、"科技板"）、
      以及风险分担机制（政府性融资担保、风险补偿基金、央行低成本资金）。
    spoken: >-
      五篇是科技金融、绿色金融、普惠金融、养老金融、数字金融。我不把它
      当五个并列口号，而是一个结构：科技金融负责培育新动能，绿色金融
      负责存量转型，普惠金融补短板，养老金融对接老龄化，数字金融是底座。
      科技金融最难的地方在风险收益不匹配——科技企业轻资产、高失败率，
      收益是幂律分布，而银行信贷是固定收益还要覆盖尾部风险，用债权
      去承担股权风险必然亏。所以配套是三条：让股权工具进来，比如银行AIC
      股权投资试点；让债券市场分层，比如科创债和债券市场"科技板"；
      再加风险分担，政府性担保和央行低成本资金兜住尾部。
    followups:
      - q: 五篇会不会"各写各的"、重复统计？
        a: 有这个风险。五篇共用同一批客户和数据底座，分条线考核容易指标打架。合理做法是以客户为中心统一授信、分类计量，比如一家绿色科技中小企业同时属于三篇。

  - id: macro-007
    qtype: single
    difficulty: 1
    institutions: [券商, 公募, 银行]
    tags: [十五五, 时政]
    question: 关于"十五五"规划，下列表述正确的是？
    options:
      - A. 规划期为2026—2030年，建议由2025年10月二十届四中全会通过
      - B. 规划期为2025—2029年
      - C. 规划纲要由国务院常务会议审议通过
      - D. 十五五不再设置五年规划纲要
    correct: [A]
    exam_point: 五年规划的时间与程序：建议（四中全会）→ 纲要（全国人大）→ 部门专项规划
    answer: >-
      A正确。"十五五"规划期为2026—2030年。程序是：2025年10月二十届
      四中全会通过《中共中央关于制定国民经济和社会发展第十五个五年规划的
      建议》；2026年3月全国人民代表大会审议通过《"十五五"规划纲要》；
      随后各部门印发专项规划，如2026年8月中国人民银行印发《"十五五"
      改革发展规划》。C错在纲要须经全国人大审议通过，不是国务院常务会议。
    spoken: >-
      十五五是2026到2030年。流程要记准：先是2025年10月四中全会通过
      中央的"建议"，再由2026年3月全国人大审议通过"规划纲要"，最后各
      部门出专项规划，比如央行2026年8月印发的"十五五"改革发展规划。
      建议是党中央的，纲要是全国人大的，这个程序区别经常被问。
    followups:
      - q: 十四五和十五五的金融提法有什么差别？
        a: 十四五关键词是"防范化解重大金融风险""全面注册制"，重心在补短板、治乱象；十五五关键词是"金融强国""完善中央银行制度""耐心资本""科技金融体制"，重心从治乱转向建制。

  - id: macro-008
    qtype: short
    difficulty: 3
    institutions: [券商]
    tags: [反内卷, 物价, PPI]
    question: “反内卷”（综合整治内卷式竞争）和“促进物价合理回升”是什么关系？和2016年供给侧改革有何不同？
    exam_point: 供给过剩是PPI负增长的重要成因；两轮去产能的手段差异
    answer: >-
      两者是一体两面。PPI长期负增长的重要成因是部分行业产能重复建设、
      低价无序竞争，压低出厂价格并形成"增收不增利"。反内卷从供给端
      修复价格，物价回升目标从需求端呼应，共同指向降低实际融资成本、
      打破通缩循环。政策抓手包括《价格法》修订规范低价倾销、规范地方
      政府招商引资的过度补贴、行业自律公约、产能置换与能耗标准、
      平台"最低价"规则整改。与2015—2016年供给侧改革的差异：
      那轮以行政化去产能为主、集中于煤炭钢铁等上游国有企业，见效快；
      本轮涉及光伏、锂电、汽车、电商等大量民营和新兴行业，主要依靠标准、
      法治与行业自律，行政手段有限，因而节奏更慢、更结构化。
    spoken: >-
      这两个是一件事的两面。PPI长期为负，很大程度不是需求不行，而是
      产能重复建设、大家在打价格战。所以反内卷从供给端修价格，物价
      回升从需求端呼应，共同目标是把实际利率降下来、打破通缩循环。
      手段上是修订价格法规范低价倾销、规范地方招商补贴、行业自律公约、
      产能和能耗标准。和2016年那轮不一样：那轮是行政化去产能、对象是
      上游国企，一年就见效；这轮对象是光伏、锂电、汽车、电商这些民企
      和新兴行业，主要靠标准和法治，见效慢得多。做投资我会跟踪产能
      利用率、行业CR5和单位盈利有没有触底。
    followups:
      - q: 反内卷会不会导致量缩价平、行业总收入下降？
        a: 有可能。所以政策是三条腿：反内卷压供给、扩内需（以旧换新、服务消费）托需求、适度宽松货币降成本。只压供给不扩需求，结果是收入下降而非盈利修复。

  - id: macro-009
    qtype: short
    difficulty: 2
    institutions: [券商, 银行]
    tags: [化债, 地方债务]
    question: 请拆解"12万亿化债"的构成，并说明它对银行和债市分别意味着什么。
    exam_point: 三段构成必须能拆开；置换≠免除；对息差与资产荒的影响
    answer: >-
      2024年11月全国人大常委会批准的方案由三部分构成：
      （1）一次性提高地方政府债务限额6万亿元，用于置换存量隐性债务，
      分三年安排；（2）自2024年起连续五年每年从新增地方政府专项债中
      安排8000亿元用于化债，合计4万亿元；（3）2029年及以后年度到期的
      棚户区改造隐性债务2万亿元，按原合同偿还、不需在2028年前置换完毕。
      合计约12万亿元。本质是置换与展期而非免除，实现"高息转低息、
      短期转长期"，官方测算五年可节省利息支出约6000亿元。
      对银行：城投类资产信用风险明显缓释、资产质量改善，但高息非标与
      贷款被低息政府债替代，资产端收益率下降，进一步压制净息差。
      对债市：城投债净供给收缩叠加信用风险下降，信用利差压缩至历史
      低位，形成"资产荒"，机构被迫拉长久期或下沉资质。
    spoken: >-
      12万亿由三块组成：一次性提高6万亿债务限额用于置换、连续五年每年
      8000亿新增专项债合计4万亿、以及2029年后到期的2万亿棚改隐性债务
      按原合同偿还不提前置换。本质是置换不是免除，把高息短期换成低息
      长期，官方测算五年省大约6000亿利息。对银行是双刃剑：城投资产的
      信用风险确实缓释了，但收益率从非标高息降到政府债低息，是净息差
      承压的一个结构性原因。对债市就是资产荒的直接来源——高票息资产
      净供给下降，配置需求还在上升，信用利差被压到历史低位。
    followups:
      - q: 化债之后地方政府就没有债务风险了吗？
        a: 不是。化债解决的是存量的流动性风险与利息负担，不解决地方财力与支出责任的结构性缺口。所以配套是遏制新增隐性债务、推动城投市场化转型，以及中长期的财税体制改革。

  - id: macro-010
    qtype: case
    difficulty: 3
    institutions: [券商, 公募]
    tags: [综合分析, 情景题]
    question: >-
      假设明天央行宣布降准0.5个百分点。请在3分钟内说明：这对债市、
      股市、银行股、人民币汇率分别有什么影响？你的分析框架是什么？
    exam_point: 考察结构化的传导分析能力，而不是背结论；要能讲清"预期差"
    answer: >-
      框架分三步：一是判断预期差（是否已被市场price in）；二是判断
      传导路径（数量、价格、信号三个渠道）；三是判断约束条件。
      具体：
      （1）债市——降准释放长期低成本资金，直接利好短端；但若市场已充分
      预期，可能"利好出尽"；长端更取决于对后续基本面与通胀的判断。
      （2）股市——流动性预期改善，风险偏好提升，非银金融、地产链、
      高杠杆行业弹性更大；但若降准被解读为"经济压力大"，也可能利空。
      （3）银行股——降准释放的准备金原本利率极低，置换高成本负债有利于
      降低负债成本、对息差是正面缓冲；同时信贷投放能力提升。但若同时
      伴随降息，则资产端收益率下降会盖过负债端收益。
      （4）汇率——宽松预期扩大中美利差倒挂，理论上人民币承压；但若
      降准提振增长预期、改善资产回报，反而可能支撑汇率。方向取决于
      "利差逻辑"和"增长逻辑"哪个占主导。
      核心是：不要背单向结论，要说清在什么条件下走哪个方向。
    spoken: >-
      我会分三步答。第一步先问预期差，市场是不是已经price in了，如果
      已经充分预期，落地反而可能利好出尽。第二步看传导：债市方面，
      降准直接利好短端，长端还是看基本面和通胀预期；股市是流动性和风险
      偏好改善，非银、地产链这些高弹性板块更受益；银行股要拆开看，
      单纯降准是好事，因为释放的准备金原本收益极低，能置换高成本负债、
      缓解息差，但如果同时降息，资产端下行会盖过这个好处；汇率上，
      宽松扩大中美利差倒挂理论上让人民币承压，但如果市场把它解读成
      增长预期改善，反而可能支撑汇率。第三步说约束条件。我觉得这类题
      最忌讳背单向结论，关键是讲清楚在什么条件下走哪个方向。
    followups:
      - q: 如果降准当天债市反而跌了，怎么解释？
        a: 三种可能：一是利好兑现、前期已过度定价；二是市场把降准解读为后续将有大规模政府债供给（供给冲击）；三是宽松被理解为稳增长发力、风险偏好上升带来股债跷跷板。
