# 题目 schema 见 docs/GLOSSARY_SCHEMA.md（字段含义 / 必备项 / 校验规则）
board: 固定收益与债券市场
questions:

  - id: fi-001
    qtype: short
    difficulty: 1
    institutions: [券商, 公募, 银行]
    tags: [久期, 凸性]
    question: 什么是久期和凸性？为什么说"久期是一阶、凸性是二阶"？实务中怎么用？
    exam_point: 麦考利久期 vs 修正久期；凸性的方向性价值；凸性对冲
    answer: >-
      麦考利久期是现金流的加权平均到期时间（权重为各期现金流现值占比）；
      修正久期 = 麦考利久期 /(1+y/m)，衡量收益率变动1个百分点时价格的
      百分比变动，是价格对收益率的一阶导数（取负）。凸性是二阶导数，
      刻画久期本身随收益率变化的速度。
      价格变动近似：ΔP/P ≈ −D_mod × Δy + 0.5 × C × (Δy)²。
      因为二阶项恒为正（正凸性），所以收益率大幅下行时价格涨得比久期
      预测的多、大幅上行时跌得比久期预测的少——凸性对多头是"免费的
      好处"，因此高凸性债券在同等久期下收益率通常更低。
      实务用途：用久期做利率风险敞口管理（组合久期 = 各券久期的市值
      加权），用凸性解释大波动下的偏差、以及在国债期货对冲时做二阶修正。
      含权债（可赎回债）会出现负凸性，需要用有效久期而非修正久期。
    spoken: >-
      久期是价格对收益率的一阶敏感度，凸性是二阶。价格变动大约等于
      负久期乘以收益率变动，再加上二分之一凸性乘以变动的平方。因为
      凸性项恒为正，所以利率大跌时价格涨得比久期算出来的多、大涨时
      跌得比久期算的少，凸性对多头是有价值的，所以同久期下高凸性
      债券收益率会更低。实务上久期用来管敞口和做国债期货对冲，凸性
      用来解释大波动下的偏差。要注意含权债比如可赎回债会出现负凸性，
      这时候得用有效久期。
    followups:
      - q: 为什么可赎回债有负凸性？
        a: 利率下行到一定程度，发行人会行使赎回权，价格被赎回价"封顶"，所以收益率越低、价格上涨越乏力，久期反而缩短，形成负凸性。

  - id: fi-002
    qtype: short
    difficulty: 2
    institutions: [券商, 公募, 银行]
    tags: [收益率曲线, 期限利差]
    question: 收益率曲线的三种形态各代表什么？期限利差走阔和收窄分别对应什么宏观情形？
    exam_point: 预期理论/流动性偏好/市场分割三大理论；牛陡熊平四象限
    answer: >-
      形态：正斜率（正常，隐含未来利率上行或期限溢价为正）、平坦
      （经济与政策预期分歧、转折点附近）、倒挂（市场预期未来降息或
      衰退，美债常作为衰退领先指标）。
      解释理论：纯预期理论（长端 = 未来短端预期的平均）、流动性偏好
      理论（叠加正的期限溢价）、市场分割/优先偏好理论（不同期限由
      不同投资者主导）。
      四象限：牛陡（短端下行更多，通常是货币宽松初期）、牛平（长端
      下行更多，经济预期走弱）、熊陡（长端上行更多，通胀或供给冲击）、
      熊平（短端上行更多，货币收紧）。
      我国特点：长端受"资产荒"、保险与银行配置盘、以及央行对长端利率
      的风险提示影响较大，2024年以来央行多次提示长债利率风险并开展
      国债借入与卖出操作，这是分析中国曲线不能忽略的政策变量。
    spoken: >-
      曲线形态就三种：正斜率、平坦、倒挂，倒挂通常意味着市场预期未来
      要降息或者衰退。分析时我用牛陡牛平熊陡熊平四象限：牛陡是短端
      下得多，一般是宽松初期；牛平是长端下得多，说明经济预期在走弱；
      熊陡是长端上得多，对应通胀或供给冲击；熊平是短端上得快，货币
      收紧。中国的特殊性在于长端不完全由基本面定价，保险和银行的配置
      盘、资产荒，还有央行对长债利率的风险提示都会直接影响，2024年
      以来央行多次做国债借入和卖出操作，这个政策变量必须考虑进去。
    followups:
      - q: 央行为什么关注长债利率过低？
        a: 一是防止利率单边下行形成拥挤交易，一旦反转引发机构（尤其是理财、农商行）的净值和流动性冲击；二是长端过低会扭曲期限溢价、削弱银行息差和保险的再投资收益，积累系统性风险。

  - id: fi-003
    qtype: short
    difficulty: 2
    institutions: [券商, 公募, 银行]
    tags: [信用利差, 资产荒]
    question: 什么是信用利差？为什么这两年信用利差被压到历史低位？这对固收投资意味着什么？
    exam_point: 利差三分解（信用风险+流动性+税收/制度）；化债与资产荒的因果链
    answer: >-
      信用利差 = 信用债收益率 − 同期限无风险利率，可分解为预期违约损失
      补偿、流动性溢价、以及税收与资本占用等制度性因素。
      压缩原因：（1）供给端——一揽子化债将高息城投债务置换为低息政府债，
      高票息资产净供给下降；城投严控新增融资；（2）需求端——存款利率
      多轮下调，居民资金流向理财与债基，配置需求上升；保险等长钱
      在利率下行中被迫拉久期；（3）风险端——城投违约预期显著下降，
      "城投信仰"在化债背景下强化。三者合力形成"资产荒"。
      投资含义：靠票息与信用下沉获取收益的空间被大幅压缩，收益来源
      转向久期与波段（资本利得），组合的利率风险敞口被动放大；一旦
      利率反转，回撤会显著大于历史经验。因此需要更严格的久期纪律、
      流动性分层管理与负债端稳定性评估。
    spoken: >-
      信用利差就是信用债收益率减去同期限无风险利率，拆开看是违约补偿、
      流动性溢价加上制度性因素。这两年压到历史低位，供给端是化债把
      高息城投换成了低息政府债、高票息资产净供给下降，需求端是存款
      利率下调之后钱搬到理财和债基、配置需求上升，风险端是城投违约
      预期大幅下降。结果就是资产荒。对投资的含义很重要：靠票息和信用
      下沉赚钱的空间没了，收益只能靠久期和波段，等于被动放大了利率
      风险敞口，一旦利率反转，回撤会比历史经验大得多。所以现在更要
      讲久期纪律和负债端稳定性。
    followups:
      - q: 现在做信用债还有什么alpha？
        a: 主要在三块：一是流动性溢价（挖冷门但资质好的主体）、二是条款与含权结构（永续、次级、可回售）的定价偏差、三是跨市场与跨品种的相对价值。纯粹的资质下沉性价比已经很低。

  - id: fi-004
    qtype: multi
    difficulty: 2
    institutions: [券商, 银行]
    tags: [债券品种]
    question: 下列关于我国债券市场品种与监管的表述，正确的有？
    options:
      - A. 企业债的发行审核职责已于2023年机构改革后划归中国证监会
      - B. 非金融企业债务融资工具在银行间市场由交易商协会注册发行
      - C. 国债和地方政府债属于利率债，政策性金融债也属于利率债
      - D. 可转债兼具债性与股性，其转股价向下修正条款对债券持有人不利
    correct: [A, B, C]
    exam_point: 债券分类与三套监管体系的统一；转股价下修对持有人有利
    answer: >-
      A、B、C正确。2023年机构改革把国家发展改革委的企业债券发行审核
      职责划入证监会，实现公司债与企业债统一监管。非金融企业债务融资
      工具（短融、中票、PPN等）在银行间市场由中国银行间市场交易商协会
      注册发行。利率债包括国债、地方政府债、政策性金融债和央票。
      D错误：转股价向下修正会提高转股价值，通常对可转债持有人有利
      （对原股东有摊薄影响），因此"下修"往往是转债的正面催化。
    spoken: >-
      前三项对。2023年机构改革把企业债审核从发改委划给证监会，解决了
      公司债、企业债两套标准的监管套利；银行间的短融中票是交易商协会
      注册制；利率债包括国债、地方债、政金债和央票。D是错的，转股价
      下修是把转股价调低，转债更容易转成股票、转股价值提升，对转债
      持有人是利好，对原股东才是摊薄。
    followups:
      - q: 为什么要统一企业债和公司债监管？
        a: 此前企业债归发改委、公司债归证监会、债务融资工具归交易商协会，同类债券三套规则，存在标准不一与监管套利。统一后有利于统一发行、披露和违约处置标准，推动"一个市场、一套规则"。

  - id: fi-005
    qtype: short
    difficulty: 3
    institutions: [券商, 银行]
    tags: [科创债, 科技金融]
    question: 科技创新债券的最大制度突破是什么？它怎么解决"债权工具支持股权投资"的矛盾？
    exam_point: 股权投资机构首次成为发行主体；风险分担机制
    answer: >-
      最大突破是2025年5月人民银行、证监会推出科技创新债券时，
      将股权投资机构（创投、私募股权基金管理人）与金融机构、科技型
      企业并列为三类发行主体。此前VC/PE只能靠募资和退出滚动，
      现在可以通过发债获得中长期资金。
      矛盾的化解靠三条：（1）资金端——人民银行提供低成本再贷款资金
      支持，压低发行成本；（2）增信端——地方政府、担保机构、信用增进
      公司参与增信，把尾部风险从债券投资者身上转移；（3）市场端——
      央行"十五五"规划提出建设债券市场"科技板"，通过差异化的发行、
      信息披露、投资者适当性与做市安排实现风险分层，让不同风险偏好的
      资金买到匹配的层级。
      本质是：债权工具本身承担不了股权风险，只能通过外部风险分担与
      投资者分层，把风险重新配置给能承担的人。
    spoken: >-
      最大的突破是2025年5月推出科技创新债券时，把股权投资机构也就是
      VC和PE纳入了发行主体，跟金融机构、科技型企业并列，这是第一次。
      为什么这是难题？因为科技创新的资金需求本质是股权属性——高失败率、
      长周期、看期权价值，而债券要求还本付息。解法有三条：央行给低成本
      再贷款压低发行成本；地方政府和担保机构增信，把尾部风险转出去；
      再通过债券市场"科技板"做差异化发行和投资者适当性安排，实现风险
      分层。说到底，债权工具自己扛不了股权风险，只能靠外部分担和投资者
      分层把风险配给能承担的人。
    followups:
      - q: 科创债的定价难点在哪？
        a: 科技企业缺乏历史现金流和抵押物，传统信用评级模型失效；估值高度依赖技术路线判断和期权价值，与债券投资者的风控框架不兼容。所以现阶段实际定价很大程度取决于增信主体的信用，而不是发行人自身资质。

  - id: fi-006
    qtype: short
    difficulty: 3
    institutions: [公募, 银行]
    tags: [理财赎回, 负反馈]
    question: 请描述"债市下跌 → 理财赎回 → 进一步下跌"的负反馈机制，以及监管的应对。
    exam_point: 净值化后的行为链条；2022年底赎回潮案例；估值整改
    answer: >-
      机制：资管新规后理财全面净值化，但客户风险认知仍停留在"类存款"。
      当债市调整、产品净值回撤，客户集中赎回 → 理财被迫抛售流动性
      较好的资产（利率债、同业存单、高等级信用债）→ 抛压推动收益率
      进一步上行、净值再跌 → 触发更多赎回，形成正反馈的下跌螺旋。
      放大因素：产品久期与开放频率错配（短开放期持有长久期资产）、
      持仓同质化、流动性分层（非银在压力期融资难）。
      典型案例：2022年11—12月，防疫优化与地产融资政策转向推动债市
      快速调整，引发大规模理财赎回潮。
      监管应对：（1）整改估值方法，限制用信托平滑机制、收盘价估值等
      方式人为压低净值波动，要求真实反映；（2）强化流动性管理，规范
      开放频率与持仓流动性匹配；（3）压实销售适当性与投资者教育；
      （4）推动产品体系分层（现金管理类、最短持有期、封闭式）。
    spoken: >-
      核心链条是：净值化之后产品波动是真实的，但客户的心理预期还是
      类存款。所以债市一调整、净值一回撤，客户就集中赎回，理财只能
      先卖流动性最好的资产，抛压推动收益率继续上行、净值继续跌，
      又触发新一轮赎回，形成螺旋。放大因素是开放期和资产久期错配、
      持仓同质化、以及压力期非银融资困难。2022年11月到12月那轮是
      典型。监管的应对主要在四块：整改估值方法，不许用信托平滑或
      收盘价估值人为压波动；强化流动性管理，让开放频率和持仓流动性
      匹配；压实销售适当性；再就是产品分层。
    followups:
      - q: 为什么监管特别在意"平滑估值"？
        a: 平滑让净值曲线看起来很稳，客户误以为低风险而买入，风险被延后而不是消除；一旦超出平滑能力，波动会集中释放，反而放大赎回冲击。这本质是变相刚兑，与资管新规相悖。

  - id: fi-007
    qtype: short
    difficulty: 2
    institutions: [券商, 银行]
    tags: [国债期货, 对冲]
    question: 国债期货有哪些用途？什么是CTD券和基差交易？
    exam_point: 套保/套利/久期管理；转换因子与最廉价交割
    answer: >-
      用途：（1）久期管理与套期保值——现券组合做空国债期货以对冲利率
      上行风险；（2）替代现券建立敞口（资金效率高、流动性好）；
      （3）基差交易与跨期、跨品种套利（如做陡/做平曲线用2年、5年、
      10年、30年合约组合）。
      CTD（Cheapest To Deliver）：国债期货采用一篮子可交割券和转换
      因子制度，空头有权选择交割哪只券，成本最低的那只即为最廉价
      交割券，期货价格主要跟随CTD券定价。
      基差 = 现券净价 − 期货价格 × 转换因子。基差交易即买入（卖出）
      现券同时卖出（买入）相应数量的期货，赚取基差收敛或持有期收益
      （carry）与净基差（BNOC）的变化。
      风险：转换期权价值变化、资金成本波动、交割券切换、以及保证金
      与流动性风险。
    spoken: >-
      国债期货主要三个用途：一是给现券组合做久期对冲，二是用它高效地
      建立利率敞口替代现券，三是做基差和曲线套利。技术上要理解CTD，
      因为国债期货是一篮子可交割券加转换因子，空头可以选最便宜的那只
      去交割，所以期货价格实际是跟着CTD券定价的。基差等于现券净价减去
      期货价格乘转换因子，基差交易就是同时持有现券和反向期货，赚基差
      收敛、carry和净基差变化。风险主要来自转换期权价值变化、资金成本
      波动和CTD切换。

  - id: fi-008
    qtype: single
    difficulty: 1
    institutions: [券商, 公募, 银行]
    tags: [基础概念]
    question: 某债券面值100元，票息3%（年付），剩余期限2年，当前市价98元。以下判断正确的是？
    options:
      - A. 到期收益率高于3%
      - B. 到期收益率等于3%
      - C. 到期收益率低于3%
      - D. 无法判断
    correct: [A]
    exam_point: 折价交易时 YTM > 票面利率 > 当期收益率的排序关系
    answer: >-
      A正确。债券折价交易（市价<面值）时，投资者除票息外还能获得
      到期时的价差收益，因此到期收益率高于票面利率。
      三者关系：折价债 YTM > 当期收益率 > 票面利率；
      溢价债 YTM < 当期收益率 < 票面利率；平价债三者相等。
      本题当期收益率 = 3/98 ≈ 3.06%，YTM 约为 4.07%。
    spoken: >-
      选A。债券折价交易，说明除了票息还有到期收回面值的价差收益，
      所以到期收益率一定高于票面利率。记住这个排序：折价债是到期
      收益率大于当期收益率大于票面利率，溢价债正好反过来，平价债
      三者相等。这题当期收益率是3除以98约3.06%，到期收益率大概4%出头。

  - id: fi-009
    qtype: short
    difficulty: 3
    institutions: [券商, 银行]
    tags: [流动性, DR007, 资金面]
    question: 分析资金面松紧，你会看哪些指标？政府债券大规模发行时资金面会发生什么？
    exam_point: 资金面指标体系；财政存款的抽水效应与央行对冲
    answer: >-
      指标体系：（1）价格——DR007（银行体系）、R007（全市场）、
      两者利差反映非银分层；隔夜与7天的利差反映跨期需求；同业存单
      发行利率反映银行中长期负债压力。（2）数量——公开市场操作净投放、
      MLF与买断式逆回购到期续作、超储率。（3）扰动项——缴税（每月
      中旬）、政府债券缴款、跨季跨年跨月、法定准备金补缴、现金走款
      （春节）。
      政府债券大规模发行时：认购资金从银行体系划入国库形成财政存款，
      短期抽走流动性（"抽水效应"），DR007上行、存单利率走高；随后
      财政支出投放回银行体系时流动性回补。央行通常通过加大逆回购
      投放、开展买断式逆回购、必要时降准或买入国债来平滑。
      因此在政府债供给高峰期，"宽货币"与"资金面偏紧"可以并存，
      不能简单用资金价格判断货币政策取向。
    spoken: >-
      我会看三层。价格层看DR007和R007，DR007代表银行体系，两者的
      利差代表非银分层，再加同业存单发行利率看银行中长期负债压力。
      数量层看公开市场净投放、MLF和买断式逆回购的到期续作、超储率。
      扰动层看缴税、政府债缴款、跨季跨年和春节现金走款。政府债大规模
      发行的时候，认购资金会从银行体系划到国库变成财政存款，短期抽走
      流动性，DR007和存单利率都会上行，等财政支出投放回来才回补。
      央行一般会加大逆回购、做买断式逆回购，必要时降准或买国债来平滑。
      所以在供给高峰期，"宽货币"和"资金面偏紧"是可以同时存在的，
      不能只看资金价格就下结论。

  - id: fi-010
    qtype: short
    difficulty: 2
    institutions: [券商, 公募, 银行]
    tags: [银行间市场, 交易所市场, 基础设施]
    question: 银行间市场和交易所市场有什么区别？为什么同一只债在两个市场会有价格差异？
    exam_point: 品种 / 托管 / 投资者 / 交易方式 / 监管 五维对比；两市场互联互通的进展
    answer: >-
      五个维度对比：
      （1）品种——银行间以国债、政金债、金融债、中票短融、同业存单、
      资产支持证券为主，是中国债券市场的"主场"（存量占比八成以上）；
      交易所主要是公司债、可转债、部分地方债和 ABS。
      （2）托管——银行间由中债登（国债、政金债、信用债）和上清所
      （中票短融、同业存单等）托管，交易所由中证登托管。
      （3）投资者——银行间是机构市场（银行、保险、基金、券商自营）；
      交易所允许非银、企业与个人参与。银行自2019年起可通过
      "银行间—交易所"互联互通机制开立交易所账户。
      （4）交易方式——银行间以询价交易、做市商报价为主；交易所
      以竞价撮合为主，两者的流动性与价格形成机制不同。
      （5）监管——银行间由人民银行主管、交易商协会自律管理；
      交易所由证监会与交易所管理。
      价格差异的四个来源：参与主体与资金成本不同（银行资金成本低于
      非银）、流动性与抵押品属性不同（银行间债券可用于质押回购，
      享"流动性溢价"）、税收与会计处理差异、以及两个市场资金不能
      完全自由划转造成的市场分割。套利存在，但受账户、托管与划转限制，
      价差不会完全消失。
    spoken: >-
      我按品种、托管、投资者、交易方式、监管五个维度比。银行间是机构
      市场，主要是国债、政金债、金融债、中票短融和存单，中债登和上清所
      托管，人民银行主管、交易商协会自律；交易所主要是公司债、可转债和
      部分地方债，中证登托管，证监会和交易所管，非银和个人也能参与。
      银行从2019年起可以通过互联互通开交易所账户。交易方式上银行间是
      询价加做市，交易所是竞价撮合。价格差异来自四点：参与者资金成本
      不同、流动性和抵押品属性不同、税收会计差异、以及托管和资金不能
      完全自由划转带来的市场分割，所以套利存在但价差不会消失。
    followups:
      - q: 为什么银行间市场的债券收益率通常更低（价格更高）？
        a: 银行资金成本低、质押回购杠杆便利，且银行间的机构对手方与违约处置路径成熟，投资者要求的流动性溢价更小；同一发行人在交易所发行的债券往往要给更高票息来补偿流动性与投资者结构差异。

  - id: fi-011
    qtype: short
    difficulty: 3
    institutions: [券商, 公募, 银行]
    tags: [资产荒, 信用利差, 化债]
    question: 什么是"资产荒"？为什么化债和存款利率下行会加剧它？对固收投资意味着什么？
    exam_point: 资产荒的本质是"负债端刚性 vs 资产端收益下移"；化债的置换逻辑；拥挤交易的风险
    answer: >-
      资产荒不是"没有资产"，而是缺**风险收益比合适**的资产：负债成本
      （存款利率、理财预期收益率、保险预定利率）下降得比资产收益率慢，
      机构为了覆盖负债只能不断下沉信用、拉长久期或加杠杆，形成
      "钱多、合适资产少"的局面。
      两个加剧因素：
      （1）化债——高息城投债被低息政府债或银行贷款置换，等于把市场上
      收益率最高的那一块信用资产直接"消灭"了，银行、保险、理财、
      债基的欠配压力同步上升。
      （2）存款利率下调——居民存款搬家到理财、货基、债基，这些产品的
      资金最终又投向债券市场，需求端持续加压。
      结果：信用利差和期限利差被压到历史低位，超长期国债、二级资本债、
      长久期信用债受追捧，一级市场"抢券"、认购倍数高企。
      对固收投资的含义：票息越来越薄，收益更多来自资本利得与交易能力，
      组合波动更大；要警惕三件事——拥挤交易的自我强化、机构行为一致的
      赎回负反馈、以及央行对长端利率的引导（风险提示与国债买卖操作）。
      策略上更强调久期与信用风险的平衡，并用转债、REITs、海外资产
      做多元补充。
    spoken: >-
      资产荒不是说没有资产，而是缺风险收益比合适的资产。负债成本降得比
      资产收益慢，机构为了覆盖负债只能下沉信用、拉长久期或者加杠杆。
      化债把高息城投债换成低息政府债和贷款，等于把市场上收益率最高的
      那块信用资产直接消灭了；存款利率下调又让居民资金通过理财和债基
      绕回债市，需求端持续加压。结果就是信用利差和期限利差压到历史低位，
      超长债和二级资本债被抢。对投资的含义是票息越来越薄、收益更多靠
      资本利得和交易，所以波动更大，要警惕拥挤交易、赎回负反馈和央行
      对长端的引导。策略上我会更强调久期与信用风险的平衡，并用转债、
      REITs 这类工具做多元补充。
    followups:
      - q: 资产荒下机构为什么偏爱超长期国债？
        a: 一是久期长、能放大利率下行的资本利得，满足收益要求；二是信用风险为零，不增加信用敞口，资本占用与会计处理友好；三是保险等负债久期长的机构有天然的长久期匹配需求。但超长债流动性相对薄、对政策表态最敏感，属于"收益与波动同时放大"的品种。
