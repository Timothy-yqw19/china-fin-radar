board: 监管法规与职业素养
questions:

  - id: reg-001
    qtype: multi
    difficulty: 1
    institutions: [券商, 公募, 银行]
    tags: [监管架构]
    question: 关于2023年金融监管机构改革，下列表述正确的有？
    options:
      - A. 组建国家金融监督管理总局，不再保留中国银行保险监督管理委员会
      - B. 中国证监会由事业单位调整为国务院直属机构
      - C. 国家发展改革委的企业债券发行审核职责划入中国证监会
      - D. 中国人民银行撤销大区分行，恢复省级分行体制
    correct: [A, B, C, D]
    exam_point: 一行一局一会架构的四项关键变动，全对题
    answer: >-
      四项全部正确。2023年《党和国家机构改革方案》形成"党中央集中
      统一领导 + 一行一局一会"架构：
      设立中央金融委员会（决策议事协调）与中央金融工作委员会（党建）；
      撤销银保监会、组建国家金融监督管理总局，统一负责除证券业外的
      金融业监管，并划入央行的金融控股公司监管职责与证监会的投资者
      保护职责；证监会调整为国务院直属机构，接收发改委的企业债审核
      职责，实现公司债与企业债统一监管；人民银行撤销大区分行、
      恢复省级分行，聚焦货币政策与宏观审慎；地方设立地方金融管理
      机构，压实属地风险处置责任。
    spoken: >-
      四个都对。2023年机构改革后形成的是"党中央集中统一领导加一行
      一局一会"。银保监会撤销、组建金融监管总局，统一管除证券业外的
      金融业，还接过了央行的金控监管和证监会的投资者保护；证监会
      从事业单位改成国务院直属机构，同时接了发改委的企业债审核，
      公司债企业债终于统一监管；央行撤大区分行、恢复省级分行，
      聚焦货币政策和宏观审慎。整体逻辑就是消除监管空白和监管套利。

  - id: reg-002
    qtype: short
    difficulty: 2
    institutions: [券商, 公募, 银行]
    tags: [适当性, 投资者保护]
    question: 什么是投资者适当性管理？"卖者尽责、买者自负"的法律含义是什么？
    exam_point: KYC/KYP/匹配三要素；举证责任在机构
    answer: >-
      适当性管理三要素：了解客户（KYC，风险承受能力评估）、
      了解产品（KYP，风险等级划分）、以及适当性匹配（把合适的产品
      卖给合适的投资者），并履行风险揭示、留痕（双录）与回访义务。
      "卖者尽责、买者自负"的法律含义：只有在机构完整履行了适当性
      义务的前提下，投资损失才由投资者自担；若机构未尽责，需对
      投资者损失承担赔偿责任。关键在于举证责任分配——按照《九民纪要》
      及司法实践，机构需要举证证明自己已尽适当性义务（推定过错），
      而非由投资者举证机构未尽责。因此销售留痕（风险测评、双录、
      风险揭示书签署）不是形式主义，而是机构的免责证据。
    spoken: >-
      适当性有三要素：了解客户、了解产品、做匹配，再加上风险揭示、
      双录留痕和回访。"卖者尽责、买者自负"的法律含义关键在举证责任：
      只有机构完整履行了适当性义务，损失才由投资者自担；如果没尽责，
      机构要赔。而且按照九民纪要和司法实践，是机构要举证自己尽了责，
      不是投资者举证机构没尽责。所以销售留痕不是走形式，它就是机构
      的免责证据，这一点我在实习的时候感受特别深。
    followups:
      - q: 如果客户主动要求买超出其风险等级的产品呢？
        a: 部分机构允许在充分风险揭示并由客户签署书面确认后购买，但仍需履行特别的告知与记录义务；若产品与客户情况严重不匹配，机构应当拒绝销售。不能以"客户自愿"作为免责的唯一依据。

  - id: reg-003
    qtype: short
    difficulty: 2
    institutions: [券商, 公募, 银行]
    tags: [反洗钱]
    question: 反洗钱的三大核心义务是什么？发现可疑交易应该怎么处理？新《反洗钱法》有哪些变化？
    exam_point: 三项义务 + 处理流程 + 保密义务 + 2025年新法要点
    answer: >-
      三大核心义务：客户尽职调查（CDD/KYC，含身份识别与持续关注）、
      大额交易与可疑交易报告、客户身份资料与交易记录保存
      （自业务关系结束或交易发生之日起至少5年）。
      可疑交易处理流程：识别与分析 → 内部提交合规/反洗钱岗 →
      经审核后通过系统上报中国反洗钱监测分析中心；
      同时负有保密义务，不得向客户或任何无关人员泄露已报告的事实
      （"禁止泄密"），也不得因此擅自终止客户业务除非符合规定。
      新《反洗钱法》（2024年11月8日修订通过，2025年1月1日施行）
      要点：确立"风险为本"原则，按风险等级配置合规资源；
      强化受益所有人识别与信息登记，穿透至最终自然人；
      将特定非金融机构（房地产、贵金属、律师会计师事务所等）
      纳入适用范围；同时强调保护个人信息、避免过度收集，
      并加大违法处罚力度。
    spoken: >-
      三大义务是客户尽职调查、大额和可疑交易报告、以及客户身份资料
      和交易记录保存至少五年。发现可疑交易的流程是识别分析、内部
      提交合规岗、审核后通过系统上报中国反洗钱监测分析中心，同时
      负有保密义务，不能告诉客户。新反洗钱法2024年11月修订、
      2025年1月施行，我记的三个变化：确立"风险为本"原则，按风险等级
      配置资源，不再一刀切；强化受益所有人识别，穿透到最终自然人；
      把房地产、贵金属、律所会计所这些特定非金融机构纳入适用范围。
      同时也强调保护个人信息、不能过度收集。

  - id: reg-004
    qtype: short
    difficulty: 3
    institutions: [券商, 公募]
    tags: [内幕交易, 合规]
    question: 内幕交易、操纵市场、利用未公开信息交易（"老鼠仓"）有什么区别？
    exam_point: 三类违法行为的构成要件差异，公募岗高频
    answer: >-
      内幕交易：内幕信息知情人或非法获取内幕信息的人，在内幕信息
      公开前买卖相关证券、建议他人买卖或泄露信息。核心要件是
      "内幕信息"（重大性 + 未公开性）与"知情身份"。
      操纵市场：通过资金优势、持股优势、信息优势或连续交易、
      对倒、虚假申报、蛊惑交易、抢帽子交易等方式，影响证券交易
      价格或交易量。核心要件是"人为影响价格形成机制"。
      利用未公开信息交易（"老鼠仓"）：证券基金从业人员利用职务
      便利获取的"内幕信息以外的其他未公开信息"（如基金的投资
      标的、时点、数量），自己买卖或建议他人买卖。核心区别在于
      信息类型不是上市公司内幕信息，而是机构自身的交易信息，
      主体限于金融机构从业人员及监管、行业协会工作人员。
      三者在《证券法》与《刑法》第180条、182条中分别规制。
      实务合规要点：投研隔离墙、通讯留痕、个人证券账户申报与
      交易报备、敏感期禁止交易、内幕信息知情人登记制度。
    spoken: >-
      三个的核心区别在信息类型和行为方式。内幕交易的对象是上市公司
      的内幕信息，要件是重大性加未公开性，主体是知情人或非法获取
      信息的人。操纵市场的核心是人为影响价格形成，比如连续交易、
      对倒、虚假申报、抢帽子。老鼠仓在法律上叫利用未公开信息交易，
      信息不是上市公司的内幕信息，而是机构自身的投资标的、时点、
      数量这类交易信息，主体限于从业人员。落到合规实务上，防线是
      投研隔离墙、通讯留痕、个人账户申报报备、敏感期禁止交易、
      还有内幕信息知情人登记。

  - id: reg-005
    qtype: short
    difficulty: 2
    institutions: [券商, 公募]
    tags: [投资者保护, 诉讼]
    question: 什么是特别代表人诉讼？它和普通代表人诉讼有什么区别？举一个案例。
    exam_point: “默示加入、明示退出”；投服中心；康美药业案
    answer: >-
      特别代表人诉讼是2019年新《证券法》第95条第3款确立的中国特色
      证券集体诉讼：投资者保护机构（中证中小投资者服务中心）
      受50名以上投资者委托后，可以作为代表人参加诉讼，并采用
      "默示加入、明示退出"——由登记结算机构确认的权利人自动
      成为原告，除非明确声明退出。
      普通代表人诉讼则是"明示加入"，投资者需主动登记加入。
      两者的核心差异在于覆盖范围与投资者的参与成本：特别代表人
      诉讼把沉默的中小投资者自动纳入，极大提高了违法成本。
      案例：康美药业案是首例特别代表人诉讼，5.2万名投资者获赔约
      24.59亿元，且独立董事被判承担连带赔偿责任，对上市公司
      治理产生深远影响。
      配套机制还有先行赔付（如紫晶存储案由中介机构设立赔付专项基金）、
      支持诉讼、示范判决与调解。
    spoken: >-
      特别代表人诉讼是2019年新证券法确立的中国特色集体诉讼，
      由投服中心接受50名以上投资者委托后作为代表人起诉，最关键
      的机制是"默示加入、明示退出"，由登记结算机构确认的权利人
      自动成为原告，除非声明退出。普通代表人诉讼是明示加入，
      要投资者主动登记。差别就在覆盖范围和参与成本，特别代表人
      诉讼把沉默的中小投资者自动纳进来，违法成本一下子抬起来了。
      案例是康美药业，首例特别代表人诉讼，5.2万名投资者获赔约
      24.59亿，独董还被判连带责任，对上市公司治理震动很大。
      配套的还有先行赔付，比如紫晶存储由中介机构出资设立专项
      赔付基金。

  - id: reg-006
    qtype: short
    difficulty: 2
    institutions: [券商, 公募]
    tags: [程序化交易, 量化]
    question: 程序化交易监管的框架是什么？监管是否反对量化？
    exam_point: 报告制度 + 高频认定 + 差异化收费 + 异常交易监控；监管取向
    answer: >-
      框架三层：（1）报告制度——先报告后交易，报送账户信息、
      资金来源、策略类型、交易软件与系统信息；
      （2）高频交易认定与差异化管理——按单账户每秒申报/撤单笔数、
      单日申报/撤单笔数等阈值认定为高频交易，从严管理并提高
      流量费、撤单费；
      （3）异常交易监控——重点监控瞬时申报速率异常、频繁瞬时撤单、
      短时间大额成交、日内高频突击拉抬打压等情形。
      依据：2024年5月证监会《证券市场程序化交易管理规定（试行）》，
      2025年沪深北交易所发布实施细则。
      监管取向：并不否定量化交易对流动性与定价效率的贡献，
      而是要解决速度与信息优势带来的公平性问题，以及避免在极端
      行情中放大波动。核心原则是"公平准入、同等对待、有效监控"。
    spoken: >-
      框架是三层：第一是报告制度，先报告后交易，要报账户、资金
      来源、策略类型和系统信息；第二是高频交易的认定和差异化收费，
      按每秒申报撤单笔数和单日笔数设阈值，达到就按高频管理并提高
      流量费和撤单费；第三是异常交易监控，盯瞬时申报速率异常、
      频繁瞬时撤单、日内高频突击拉抬打压这几类。依据是2024年5月
      证监会的管理规定和2025年交易所的实施细则。监管并不反对量化，
      量化对流动性和定价效率是有贡献的，它要解决的是速度优势带来
      的公平性问题，以及极端行情下放大波动的问题。

  - id: reg-007
    qtype: case
    difficulty: 3
    institutions: [券商, 公募, 银行]
    tags: [行为面试, 职业操守]
    question: >-
      实习期间，你的直属带教让你把一份还没核对完的数据直接放进
      即将发出的报告里，理由是"来不及了，先发再说"。你怎么处理？
    exam_point: 考察风险意识与沟通方式，不是考"服从"或"对抗"；给方案而非只提问题
    answer: >-
      处理原则是：不对抗、不盲从、给方案、留痕迹。
      （1）先明确风险边界——对外发布的数据一旦出错，涉及的是机构
      信誉和潜在的合规责任（误导性陈述），这不是效率问题而是风险问题。
      （2）立即给出可执行的折中方案，而不是单纯说"不行"：
      例如先核对影响结论的关键数据（通常是少数几个），非关键数据
      在报告中标注"待核"或暂不列示；或者先发内部版本、对外版本
      延后30分钟；或者请同事并行核对以压缩时间。
      （3）如实告知不确定性——在报告中明确数据口径与来源，
      对未完成校验的部分做出标注。
      （4）如果带教仍坚持，向上或向合规同步，方式是"请示"而非
      "举报"：以"这个数我还没核完，想确认一下我们是否接受这个
      口径"的方式让更高层级知情，把决策放在有权限的人手里，
      并保留邮件或消息记录。
      核心表达：我尊重时间压力，但对外数据的准确性是我作为
      从业人员的底线，我的目标是既不误事也不出错。
    spoken: >-
      我的原则是不对抗、不盲从、给方案、留痕迹。首先我会在心里
      划清楚这不是效率问题而是风险问题——对外发布的数据出错，
      影响的是机构信誉，还可能构成误导性陈述。然后我不会只说
      "不行"，我会立刻给一个能执行的折中方案：比如先把影响结论
      的那几个关键数核完，非关键的在报告里标注"待核"或者先不列；
      或者先出内部版、对外版晚半小时；或者请同事并行核对压缩时间。
      如果带教还是坚持，我会用"请示"而不是"举报"的方式把情况
      同步上去，比如说"这个数我还没核完，想确认我们是不是接受
      这个口径"，让有权限的人来决策，同时留下邮件记录。我会
      表达清楚：我理解时间压力，但对外数据的准确性是我的底线，
      我的目标是既不误事也不出错。
    followups:
      - q: 如果因为你坚持核对导致报告延迟，你怎么看？
        a: 我会先承担责任，复盘是不是我的流程效率有问题、能不能提前预留校验时间。但我不会因此改变对数据准确性的标准，而是改进流程——比如建立校验清单、把易错项前置。

  - id: reg-008
    qtype: case
    difficulty: 2
    institutions: [券商, 公募, 银行]
    tags: [行为面试, 自我介绍]
    question: >-
      "请你介绍一下自己"——面对券商/公募/银行三类不同机构，
      这段自我介绍应该怎么调整？
    exam_point: 考察岗位理解；同一段经历要能映射到不同的价值主张
    answer: >-
      结构统一用"一句话定位 + 两段证据 + 一句为什么是这里"，
      控制在90秒内，但证据的选取要按机构调整：
      券商（投行/研究）：突出行业研究深度、财务建模、
      信息处理效率与抗压能力。证据选"做过某行业的深度研究/
      完整搭过一个模型/在实习中独立完成过某个交付"。
      落点是"我想做能形成判断并对判断负责的工作"。
      公募（投研）：突出投资框架、独立判断与长期思维、
      对风险的敬畏。证据选"管过模拟组合并能复盘归因/
      对某个标的有过与市场不同的判断及其验证过程"。
      落点是"我认同以投资者最终回报为核心"。
      银行（管培/对公/风控）：突出规则意识、执行力、
      沟通协调与客户视角。证据选"在实习中处理过跨部门协作/
      服务过客户并解决过具体问题/对某类企业的经营有实际了解"。
      落点是"我愿意从一线开始理解真实的企业与客户"。
      通用禁忌：不要背简历、不要罗列所有经历、不要用形容词
      代替事实（说"我学习能力强"不如说"两周内自学并交付了X"）。
    spoken: >-
      我会用同一个结构但换证据：一句话定位、两段证据、一句为什么
      是这里，控制在90秒。面券商我会挑行业研究和建模的经历，
      落点是我想做能形成判断并对判断负责的工作；面公募我会挑
      模拟组合和归因复盘、或者某个和市场不一样的判断以及后来
      怎么验证的，落点是认同以投资者最终回报为核心；面银行我会
      挑跨部门协作和服务客户解决具体问题的经历，落点是愿意从
      一线开始理解真实的企业和客户。我给自己定的红线是不背简历、
      不罗列、不用形容词代替事实——说"我学习能力强"不如说
      "两周内自学并交付了什么"。
